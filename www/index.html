at", "title": "የመጽሐፍ ቅዱስ ጥናት", "subtitle": "ለቀዳማይ ክፍል የተዘጋጀ", "epigraph": "«በእግዚአብሔር መጽሐፍ ፈልጉ አንብቡም አፌ አዝዞአልና፣ መንፈሱም ሰብስቦአቸዋልና ከነዚህ አንዲት አትጠፋም፡፡» (ኢሳ. 34÷16)", "publisher": "በመናገሻ ገነተ ጽጌ ቅዱስ ጊዮርጊስ ቤተ ክርስቲያን ሰንበት ት/ቤት ትምህርት ክፍል የተዘጋጀ", "chapters": [{"chapter_id": "ymkt_ch1", "title": "ምዕራፍ አንድ፡ መግቢያ", "page_start": 1, "sections": [{"heading": "የመጽሐፍ ቅዱስ ታሪክና ትርጉም", "content": "በዓለም የተለያየ ሐሳብ መጠንና ዕድሜ ያላቸው ዓለማውያት /ስለ ዓለማዊ ሁኔታ የሚናገሩ/ እና አምላካውያት /ቅዱሳት/ መጻሕፍት ይገኛሉ፡፡ በዚህ ምዕራፍ አምላካውያት መጻሕፍት በይበልጥ መጽሐፍ ቅዱስን የስሙን ትርጉም፣ ለምን ቅዱስ እንደተባለ፣ በምን ቋንቋ፣ በማን፣ መቼና የት እንደተጻፈ፤ በምዕራፍና በቁጥር የአከፋፈሉን ሁኔታ እንዲሁም ከቋንቋ ወደ ቋንቋ ምሳሌያዊና ምሥጢራዊ ትርጉም ሲባል እንዴት እንደሆነ እንመለከታለን፡፡\n\nስያሜው፦ መጽሐፍ ቅዱስ የሚለው ቃል የሁለት ቃላት ጥምረት ነው፡፡ «መጽሐፍ» የሚለው ቃል ተጠቃሎ በአንድ ጥራዝ ሥር የተሰበሰበ ጽሑፍን ሲገልጥ፤ «ቅዱስ» የሚለው ቃል በዕብራይስጥ ክድስ፣ በሱርስት ካዲህ፣ በግዕዝና በዓረብኛ ቅዱስ ካለው ቃል የተገኘ ነው፡፡ ትርጉሙም የተለየ፣ የተከበረ ማለት ነው፡፡\n\nቅዱስ /የተለየ/ የተባለበት ምክንያት፦\n\nአስገኚው እግዚአብሔር ቅዱስ ስለሆነ፣ /ዘሌ. 19÷2/\n\nቅዱሳን ሰዎች የጻፉት በመሆኑ፣ /2ጴጥ. 1÷20-21/\n\nየቅዱሳን ክቡር ታሪክና ስም ስለሚገኝበት፣\n\nየዕድሜው ርዝማኔና ዘመን የማይሽረው መሆኑ፣ /ኢሳ. 40÷8/\n\nስላለፈውና ስለሚመጣው ነገር በእርግጠኝነት በመናገሩ፣\n\nአንባብያኑን የሚሰሙትንና ተከታዮቹን ወደ ቅድስና የሚመራ በመሆኑ ነው፡፡ /ራዕይ 22÷7/\n\nመጽሐፍ ቅዱስ፦\n\nየመንፈስ ምግብ ነው፡፡ /ማቴ. 4÷4፣ ኤር. 15÷16/\n\nየመንገዳችን መብራት ነው፡፡ /መዝ. 118÷105/\n\nሁለት አፍ ያለው ሰይፍ ነው፡፡ /ዕብ. 4÷12/\n\nያነጻል፡፡ /ዮሐ. 15÷3/\n\nያለመልማል፡፡ /መዝ. 1÷3/"}, {"heading": "በምን ቋንቋ፣ መቼ ተጻፈ?", "content": "መጽሐፍ ቅዱስ በአንድ ዘመን በአንድ ቦታ በአንድ ሰው ተጽፎ ያለቀ አይደለም፡፡ የሄኖክ መጽሐፍ ከተጻፈበት ከክርስቶስ ልደት 4014 ዓመት በፊት ጀምሮ ዮሐንስ ራዕይ እስከ ተጻፈበት ድረስ ከ4100 ዓመት በላይ አልፏል፡፡ እንደ ጊዜው መለያየትም ጸሐፊዎቹ አጠራራቸው፣ የተጻፈበትም ቦታዎች የተለያዩ ናቸው፡፡ ምንም እንኳን በዚህ መልኩ ቢለያይም በአንድ መንፈስ ቅዱስ ገላጭነት ስለጻፉት የሐሳብ መጋጨት የለበትም፡፡ /2ኛጴጥ. 1÷21/\n\nለምሳሌ፦ ከጸሐፊዎቹ ለመጥቀስ ያህል፦\n\nሰሎሞን ንጉሥ ነበር፡፡ ምሳሌ 1÷1\n\nሕዝቅኤል ካህን ነበር፡፡ ሕዝ. 1÷1-3\n\nአሞጽ እረኛ ነበር፡፡ አሞጽ 1÷1\n\nማቴዎስ ቀራጭ ነበር፡፡ ማቴ. 9÷9\n\nሉቃስ ሐኪም ነበር፡፡ ቆላ. 4÷14\n\nዳዊት እረኛ ነበር፡፡ 1ኛ ሳሙ. 17÷15\n\nከዚህ የእግዚአብሔር ምርጫ ቅድስናውን፣ የልቡን የዋህነትና ቅንነትን ተመልክቶ እንጂ በዕውቀት፣ በውበትና በሀብት አለመሆኑን እንረዳለን፡፡ እንዲሁም የተጻፉት በተለያየ ቦታ ነው፡፡\n\nለምሳሌ፦\n\nየኦሪት መጻሕፍት — በሲና ምድረ በዳ\n\nመጽሐፈ ኢያሱ፣ መጽሐፈ መሳፍንት፣ መጽሐፈ ነገሥት — በምድረ ከነዓን /በእሥራኤል/\n\nመጽሐፈ አስቴር — በፋርስ\n\nትንቢተ ዳንኤል — በባቢሎን\n\nመልእክታት — በሮም\n\nየዮሐንስ ራዕይ — በፍጥሞ ደሴት\n\nበዚህ ሁኔታ አብዛኛዎቹ የብሉይ ኪዳን መጻሕፍት በዕብራይስጥ፤ የሐዲስ ኪዳን ደግሞ በግሪክ ቋንቋ ተጽፈዋል፡፡ ከዚህም በኋላ የብሉይ ኪዳን መጻሕፍት ከክርስቶስ ልደት በፊት በ284 ዓመት በንጉሥ በጥሊሞስ ዘመነ መንግሥት በ70 የአይሁድ ሊቃውንት /ሴፕቱአጀንት/ ከዕብራይስጥ ወደ ፅርዕ በግሪክ ሀገር ተተረጎመ፡፡ በሐዲስ ኪዳን ዘመንም እስከ 5ኛው መቶ ክ/ዘመን መጽሐፍ ቅዱስ የተተረጎመባቸው ለመጽሐፍ ቅዱስ ነጠላ ትርጓሜ መሠረታውያን የሆኑ ቋንቋዎች አሉ፡፡ እነርሱም፦\n\nበኢትዮጵያ /ግዕዝ/\n\nሮማይስጥ የጥንቱ ላቲን /ቮልጌት/\n\nበግብጽ ቅብጥ /ኮፕት/\n\nበሶሪያ /ሱርስት/\n\nበአርመን /አርመንኛ/ ናቸው፡፡\n\nበእነዚህ ቋንቋዎች የተተረጎሙት መጻሕፍት በአሁኑ ጊዜ በጣም አስፈላጊ እንደሆኑ ይታመናል፡፡ ምክንያቱም መጽሐፍ ቅዱስ የተጻፈባቸው መሠረታውያን ቋንቋዎች በመሆናቸው በየጊዜው ለሚነሱ ስህተቶች ማረሚያ ስለሚሆኑ ነው፡፡\n\nበጥንት ዘመን ቅዱሳት መጻሕፍት ለንባብ በሚያመች ሁኔታ በክፍል በክፍል ብቻ ተለይተው ይኖሩ ነበር እንጂ በምዕራፍና በቁጥር ተለይተው የሚነበቡ አልነበረም፡፡ ሉቃስ 4÷16-21፣ 2ቆሮ. 3÷14፡፡\n\nበ4ኛው መቶ ክፍለ ዘመን የተነሳው ታላቁ የቤተክርስቲያን አባት አባ ጀሮም ለ40 ዓመታት የዕብራይስጥ የግሪክ ቋንቋዎችን በሚገባ በማጥናት መጽሐፍ ቅዱስን ወደ ቮልጌት /ሮማይስጥ/ ተርጉሟል፡፡\n\nሉተር በ16ኛው መቶ ክፍለ ዘመን መጽሐፍ ቅዱስን ወደ ጀርመንኛ ተርጉሟል፡፡ በራሱ አመለካከት ስለተረጎመውና የአባ ጀሮምን ትርጉም ባለመቀበሉ በካቶሊኮችና በፕሮቴስታንት መካከል አለመግባባት እያየለ ሄዷል፡፡\n\nበ1525/26 እ.ኤ.አ. ቴንዳሌ የተባለ እንግሊዛዊ የተወሰኑ መጻሕፍትን ወደ እንግሊዝኛ ተረጎመ፡፡\n\nበዚህ አኳኋን የትርጉሙ ሥራ ቀጥሎ ከ1228 ዓ.ም. ጀምሮ በምዕራፍ፣ ከ1551 ጀምሮ ደግሞ ምዕራፎችን በቁጥር መከፋፈል ተጀምሯል፡፡\n\nትርጉም ሲባል ከላይ በተጠቀሰው ዓይነት ከቋንቋ ወደ ቋንቋ፣ ነጠላ ትርጉም፣ ምሳሌያዊና ምሥጢራዊ ትርጉም በመባል አራት ክፍሎች ሊኖሩት ይችላሉ፡፡\n\n1/ ከቋንቋ ወደ ቋንቋ መተርጎም፦ እጅግ ጠቃሚ ቢሆንም አንድ ከቋንቋ ወደ ሌላ ቋንቋ የሚተረጉም ሰው ለዚህ ትርጉም ሥራ ከመነሳቱ አስቀድሞ ፈሪሀ እግዚአብሔርን ገንዘብ ማድረግና በቂ የሆነ የቋንቋ እውቀት ሊኖረው ይገባል፡፡ ከእነዚህም ችግሮች የተነሳ ሮሜ. 8÷27 ላይ «መንፈስ ቅዱስ ይራራልናል» የሚለውን «በማይነገር መቃተት ይማልድልናል» በማለት ተርጓሚዎች መንፈስ ቅዱስን የተሳደቡ ሲሆን እንዲሁም በሮሜ 8÷34 \"ስለ እኛ የሚፈርደው ክርስቶስ ኢየሱስ ነው\" የሚለውን በሮሜ 8÷34 \"ስለ እኛ የሚማልደው ክርስቶስ ኢየሱስ ነው\" በማለት የነበረውን አስወጥተው የሌለ ነገር አስገብተው ጽፈዋል፡፡\n\n2/ ነጠላ ትርጉም፦ መጽሐፍ ቅዱስ በቀጥታ ትርጉም የሚወሰዱና ከዚያ የተለየ ምንም ዓይነት ምሥጢራዊ ወይም ምሳሌያዊ ትርጉም የሌላቸው በቀጥታ ሊወሰዱ የሚችሉት በርካታ ኃይለ ቃላት ይገኛሉ፡፡ እንደዚህ ላሉት የሚሰጠው ማብራሪያ ነጠላ ትርጉም ይባላል፡፡ ለምሳሌ፦ በመጽሐፍ ቅዱስ ውስጥ በታሪክነት የተመዘገቡ በነጠላ ትርጉም የሚወሰዱ ናቸው፡፡ የአብርሃም ከካራን መውጣት፣ የያዕቆብና ልጆቹ ስደት ... ወዘተ\n\n3/ ምሳሌያዊ ትርጉም፦ አንድን ነገር የበለጠ ግልጽ ለማድረግ የምንጠቀምበት ነው፡፡ በመጽሐፍ ቅዱስ ውስጥ በምሳሌ የተነገሩ በርካታ ክፍሎች ይገኛሉ፡፡ የእመቤታችን ዘላለማዊ ድንግልና ሐ. 20÷31፣ መዝ. 118÷105፣ 2ኛጢሞ. 3÷13-17/\n\nየእግዚአብሔርን ትእዛዝና ፈቃድ እናውቅበታለን፡፡ /ዘፍ. 4÷2፣ ማቴ. 22÷37-39/\n\nስለ እግዚአብሔር መግቦትና ሕልውና ማወቅ ነው፡፡ /መዝ. 134÷6፣ መዝ. 102÷19፣ 1ኛ ጢሞ. 6÷15፣ ራዕይ 17÷14፣ መዝ. 146÷8-9/\n\nጥያቄ\n\nየሚከተሉትን ጥቅሶች በምህጻረ ቃል ከጻፍክ በኋላ በሌላ መጽሐፍ የሚገኙበትን ቦታ በምህፃረ ቃል ጥቀስ፡፡ ሀ/ ወደ ዕብራውያን ምዕራፍ 12 ቁጥር 5 እና 6 ለ/ የይሁዳ መልዕክት ቁጥር 14 እና 15"}]}, {"chapter_id": "ymkt_ch3", "title": "ምዕራፍ ሦስት፡ የቅዱሳት መጻሕፍት አሰያየም አቆጣጠርና አንዳንድ ጥያቄዎች", "page_start": 3, "sections": [{"heading": "ምዕራፍ ሦስት፡ የቅዱሳት መጻሕፍት አሰያየም አቆጣጠርና አንዳንድ ጥያቄዎች", "content": "መጽሐፍ ቅዱስ የብዙ ቅዱሳት መጻሕፍት መድብል ነው፡፡ በአንድ ወቅት ብቻ ተጠርዞ የተገኘ ወይም የተሰጠ አይደለም፡፡ ስለሆነም የእያንዳንዱ መጻሕፍት ስም /አሰያየም/ የተለያየ ነው፡፡\n\nሀ/ በጸሐፊው ስም የሚጠሩ መጻሕፍት፦\n\nመጽሐፈ ኢያሱ\n\nመጽሐፈ ሄኖክ\n\nመዝሙረ ዳዊት\n\nየጴጥሮስ መልዕክት ወ.ዘ.ተ\n\nለ/ ከይዞታቸው መጽሐፉ የሚይዘው ሀሳብ በመነሳት ስም የተሰጣቸው መጻሕፍት፦\n\nመጽሐፈ ኦሪት\n\nመጽሐፈ ኩፋሌ\n\nመጽሐፈ አስቴር\n\nመጽሐፈ ነገሥት\n\nመጽሐፈ መሣፍንት ወ.ዘ.ተ\n\nሐ/ በጸሐፊውና በይዞታቸው የሚጠሩ፦\n\nመኃልየ መኃልይ ዘሰሎሞን\n\nትንቢተ ኢሳይያስ\n\nየማቴዎስ ወንጌል\n\nየዮሐንስ ወንጌል\n\nመ/ በሀገር /በከተማ/ ስም የሚጠሩ፦\n\nወደ ሮሜ ሰዎች መልዕክት /የቅዱስ ጳውሎስ መልእክታት/\n\nሠ/ በተላከላቸው ሰዎች ስም የሚጠሩ፦\n\nቲቶ፣ 1ኛ እና 2ኛ ጢሞቴዎስ፣ ፊልሞና\n\nቅዱሳት መጻሕፍትን መሰብሰብ የተጀመረው የመጀመሪያው መጽሐፍ ከተጻፈበት ጊዜ ጀምሮ መሆኑ ግልጥ ነው፡፡ ሆኖም ብዛታቸውንና ዓይነታቸውን ለይቶ ለማወቅ ሲባል በተለይ በሐዲስ ኪዳን ከፍተኛ ጥረት ተደርጓል፡፡ ከዚህም ሌላ በ325 ዓ.ም. በኒቅያ በተካሄደው ጉባኤ ላይ እውነተኞቹን ቅዱሳት መጻሕፍት ለመሰብሰብ በተወሰነው መሠረት ቅዱስ አትናቴዎስ ሐዋርያዊ በ367 ዓ.ም. በ39ኛው መልእክቱ ላይ የቅዱሳት መጻሕፍትን ቁጥር ዓይነት አስታውቋል፡፡ ከዚያም በኋላ በሎዶቅያ ጉባዔና በ393፣ 399 እና በ419 ዓ.ም. በሰሜን አፍሪካ ትገኝ በነበረችው ቅርጣግና /ካርቴጅ/ በተካሄዱት ጉባዔዎች ቅዱሳት መጻሕፍትን ለይቶ ለማወቅ ጥረት ተደርጓል፡፡ ከዚህ ጉባዔ በኋላ ቅዱሳት መጻሕፍትን በአንድ ላይ መጠረዝ እንደተጀመረ ይነገራል፡፡ የሁሉም ቅዱሳት መጻሕፍት መድብል /ጥራዝ/ በአንድነት \"መጽሐፍ ቅዱስ\" ተብሎ ይጠራል፡፡ ይህም መጽሐፍ የ81 /ሰማንያ ወአሐዱ/ መጻሕፍት መድብል ሲሆን ብዛቱም በ318ቱ ሊቃውንት የተወሰነ ነው፡፡ /ፍትሐ ነገሥት አንቀጽ ሁለት/\n\nሰማንያ አንዱም መጻሕፍት በ325 ዓ.ም. በጉባዔ ላይ እንደተወሰነ ተካትተው የተጠረዙ አይደሉም፡፡ ምክንያቱም በወቅቱ በዓለማዊ ፍልስፍና እየተበረዘ ያሉት መጻሕፍት ላይ ብቻ ትኩረት በመሰጠቱ፣ መጻሕፍቱ የተቀመጡበት ቦታ ቆይቶ በመታወቁ /ዕዝ. ሱቱኤል 11÷37/፣ እንዲሁም ከመጻሕፍቱ ውስጥ አንዳንዶቹ በይዘታቸው ትላልቅ በመሆናቸው ራሳቸውን ችለው እንዲቀመጡ በመደረጉ ነው፡፡\n\nእነዚህ 81 መጻሕፍት በ66ቱ መጻሕፍት ላይ ማለትም በብሉይ ኪዳን እና በሐዲስ ኪዳን መጻሕፍት ላይ በመጨመር የሚሟሉ ናቸው፡፡\n\nየብሉይ ኪዳን ተጨማሪ መጻሕፍት | የሐዲስ ኪዳን ተጨማሪ መጻሕፍት\n--- | ---\n❖ መጽሐፈ ኩፋሌ | * ሥርዓተ ጽዮን ሲኖዶስ\n❖ መጽሐፈ ሔኖክ | * ትዕዛዝ ሲኖዶስ\n❖ መጽሐፈ ዕዝራ ሱቱኤል | * ግፅው ሲኖዶስ\n❖ መጽሐፈ ጦቢት | * አብጥሊስ\n❖ መጽሐፈ ዮዲት | * 1ኛ መጽሐፈ ኪዳን\n❖ መጽሐፈ መቃብያን ቀዳማዊ | * 2ኛ መጽሐፈ ኪዳን\n❖ መጽሐፈ መቃብያን ዳግማዊና ሣልሣዊ | * ቀሌምንጦስ\n❖ መጽሐፈ ሲራክ | * ዲድስቅልያ\n❖ መጽሐፈ ጥበብ | \n❖ መጽሐፈ ዮሴፍ ወልደ ኮርዮን |\n\nበ1980 ዓ.ም. በታተመው የአማርኛ መጽሐፍ ቅዱስ አንዳንድ ለብቻቸው የተቀመጡ መጻሕፍት አሉ፡፡ ምንም እንኳን ለብቻ ተዘርዝረው መጠሪያ ስም ተሰጥቷቸው ቢገኙ አቆጣጠራቸው ግን ወደ እናት መጻሕፍቶቻቸው እየገቡ ነው፡፡ ይህም ማለት ለየብቻ በየራሳቸው እንደ አንድ መጽሐፍ አይቆጠሩም ማለት ነው፡፡\n\nሌሎች ከኢትዮጵያ ኦርቶዶክስ ተዋሕዶ ቤተክርስቲያን ውጭ የሆኑትም አይሁድ የብሉይ ኪዳን መጻሕፍትን፤ ሳምራውያን 5ቱን የሙሴ ሕግ መጻሕፍትን ሲቀበሉ ካቶሊክ 73፣ የግሪክ ኦርቶዶክስ 76/77/፣ ፕሮቴስታንት 66፣ የራስል ተከታዮች /ጅሆባውያን/ የ1000 ቃላት ዕርማት ሰጥተው 66 መጻሕፍትን ይቀበላሉ፡፡\n\nአንዳንድ የሃይማኖት ድርጅቶች /መናፍቃን/ ከላይ የጠቀስናቸውን መጻሕፍት በሙሉ ላለመቀበል የሚሰጧቸው ምክንያቶች የሚከተሉት ናቸው፡፡\n\n1. የመጀመሪያው ምክንያት፦ አይሁድ አልተረከቧቸውም ሰባው ሊቃውንትም ብሉይ ኪዳንን ከዕብራይስጥ ወደ ፅርዕ ሲተረጉሙ አልተረጎሟቸውም፡፡ መጻሕፍቱም የተገኙት ከአይሁድ ስለሆነ እነርሱ ያልተቀበሉትን እንዴት እንቀበላለን? የሚል ነው፡፡\n\n2. መልስ፦ ይህን ጥያቄ ለመመልከት አይሁድ የቅዱሳት መጻሕፍትን ቁጥር ከወሰኑበት ስንነሳ አይሁድ ጌታችንን ጠልተውትና ተመቅኝተው አሳልፈው ቢሰጡትም በትንሣኤው ነገራቸውን አፈረሰባቸው፡፡ ባረገ በ10ኛው ቀን ሐዋርያት በመንፈስ ቅዱስ ተቃኝተው አይሁድ ከያዟቸው መጻሕፍት የተነገሩ ትንቢቶችን በአምላካችን በኢየሱስ ክርስቶስ መፈጸሙን ያስተማሩበትና አይሁድ ለሚጠይቋቸው መልስ በመስጠት ያሳለፉበት ጊዜ ነበር፡፡ /የሐዋ. ሥራ 5÷17-42፣ የሐዋ. ሥራ 7÷1-60/ በዚህ የተረበሹት አይሁድ የተጠቀሙበትንና ግልጽ ትንቢት ያለባቸውን ለማጥፋት በጉባዔ ወስነው በተለይም በዕብራይስጥ ብቻ የተጻፉትን አቃጥለዋቸዋል፡፡ ለምሳሌ ሕዝቅኤል አሁን በመጽሐፍ ቅዱስ ካለው ሌላ የትንቢት መጽሐፍ የነበረውን በዚሁ ጊዜ ጠፍቷል፡፡\n\nእንዲሁም የግሪኩ ትርጓሜ ያላቸውን እንደ መጽሐፈ ሄኖክ በሙት ባህር አካባቢ ሲገኝ በዕብራይስጥ ቋንቋ ሆኖ መገኘቱ በአይሁድ ዘንድ ተቀባይነት እንደነበረው ከመረጋገጡም በላይ በኢትዮጵያ ቤተክርስቲያን ከሚገኘው ጋር ተመሳክሮ አንድነት ስለነበረው በተለያዩ ቋንቋዎች እንዲጻፍ ተደርጓል፡፡ ከዚህም በተጨማሪ በግሪኮች ዘንድ መጽሐፈ ሶስና፣ መዝሙር ዘሰለስቱ ደቂቅ እና ተረፈ ዳንኤል /ቤል ወደራጎን/ ልክ እንደኛ አቆጣጠር ከትንቢተ ዳንኤል ጋር ተጨምረው ይቆጠራሉ፡፡ ስለዚህ እነዚህን መጻሕፍት ሰብዓው ሊቃውንት አልተረጐሟቸውም ነበር የሚል ሐሳብ ከንቱ ፈጠራ መሆኑን ልብ ይሏል፡፡ በተጻፉበት በእናት ቋንቋቸው /በዕብራይስጥ/ ተጽፈው ሳያገኟቸው ሊተረጉሟቸው አይችሉምና፡፡\n\n3. ሁለተኛው ምክንያት፦ መጻሕፍቱ ታምኖባቸው ቢሆን ኖሮ የሐዲስ ኪዳን ጸሐፍያን ከእነዚህ መጻሕፍት አንዳንድ ጥቅሶች በጠቀሱ ነበር፡፡ ነገር ግን ምንም የተጠቀሰ የለም፡፡\n\n4. መልስ፦ በመሠረቱ አንድ መጽሐፍ ተቀባይነት እንዲኖረው ለማድረግ በግድ በሐዲስ ኪዳን መጠቀስ አለበት የሚል የሃይማኖት ዶግማ አልተደነገገም፡፡ እንደ ርያርክ በአትናቴዎስ እጅ ተሹሞ ጃንደረባው በመሠረተው ላይ ክርስትናን ከማጠናከሩ በተጨማሪ ቅዱሳት መጻሕፍትን ከሱርስት፣ ከዕብራይስጥና ከፅርዕ ቋንቋ ወደ ግዕዝ ቋንቋ መልሷል፡፡\n\nበቢዛንታይን መንግሥት ስቃይ የበዛባቸው ዘጠኙ ቅዱሳን መነኮሳት ከሶሪያ ከታናሽዋ እስያ ተሰደው በ480 ዓ.ም. ወደ ኢትዮጵያ በመምጣት የሀገሪቱን የግዕዝ ቋንቋ ተምረው አያሌ መጻሕፍትን ከሱርስት፣ ከፅርዕ ቋንቋ ወደ ግዕዝ ከመመለሳቸው በተጨማሪ 70 ሊቃውንት የተረጎሙትን መጻሕፍት ይዘው መጥተዋል፡፡\n\nከዚያም በ14ኛው መቶ ክፍለ ዘመን አባ ሰላማ /መተርጉም/ ሐዲስ ኪዳንን ከተለያዩ ቋንቋዎች ወደ ግዕዝ ተርጉመዋል፡፡ አባ አብርሃም /ግብጾች አባ ሮሜ ይሏቸዋል/ የተባሉት ኢትዮጵያዊ ሊቅ ከጎንደር ተነስተው ወደ ግብፅ በመሄድ የተለያዩ ቋንቋዎችን በማጥናት ሙሉ መጽሐፍ ቅዱስን ወደ አማርኛ ተርጉመዋል፡፡ ከዚህም ትርጉም በ1816 ዓ.ም. አርባዕቱ ወንጌላት /አራቱ ወንጌሎች/፣ በ1821 ዓ.ም. ሐዲስ ኪዳን፣ በ1832 ዓ.ም. ደግሞ ሙሉው መጽሐፍ ቅዱስ ታትሞ ወጥቷል፡፡ ከዚያ ወዲህ በ1878 ዓ.ም. የኢትዮጵያ ሊቃውንት የዕብራይስጡንና የግሪኩን ቋንቋ ከሚያውቁ የውጭ ሀገር ዜጎች ጋር በመሆን /ለምሳሌ ማርቲን ፍላድ/ እንደገና በማገናዘብ እንዲታተም ተደርጓል፡፡\n\nስለዚህ ለኢትዮጵያ ቤተክርስቲያን ስለ ቅዱሳት መጻሕፍት እና ትርጉም አስተምራለሁ ማለት \"ለቀባሪው አረዱት\" እንደሚባለው ይሆናል፡፡ እንዲህ አድርጋ ቅዱሳት መጻሕፍትን ከሥር ከሥር የተቀበለች በመሆንዋ ለሁለቱም ኪዳናት ብቸኛ ባለቤት የሆነችው ሀገራችን ለሰማንያ አሐዱ ቅዱሳት መጻሕፍትም ብቸኛ ባለቤት ናት፡፡ ሌሎች መጻሕፍት እንደ ሃይማኖተ አበው፣ ድርሳናትና ፍትሐ ነገሥት መጻሕፍት በ14ኛው መቶ ክፍለ ዘመን በአጼ ዘርዓ ያዕቆብ ዘመን ወደ ኢትዮጵያ ገብተዋል፡፡\n\nከላይ በተገለጹት የታሪክ መሠረትነት ቅድስት ሀገራችን በባህል የምትመራ ብቻ እንዳይደለች እንረዳለን፡፡ ቅዱሳት መጻሕፍትን በማንበብ፣ በመጸለይ፣ በመዳሰስ ፈውስ እናገኝበታለን፡፡ የልዑል እግዚአብሔር ቃል ኃይል አለውና፡፡ እነዚህንም መጻሕፍት በቃል፣ በሥርዓት በምግባር ታስተምረዋለች፤ ሥርዓትዋ አሠራርዋ አልባሳትዋ ሁሉ ትምህርተ ወንጌል ይዘዋልና፡፡\n\nየኢትዮጵያ ልዩ ልዩ ቅዱሳት መጻሕፍት በሁለት ክፍሎች ይገኛሉ፦\n\n1. በሀገር ውስጥ የሚገኝ\n\nበግለሰቦች እጅ\n\nበጥንታውያን አድባራትና ገዳማት ዕቃ ግምጃ ቤቶች\n\nበዘመናዊ ሙዚየም /ቤተ መዘክር፣ ቤተ መጻሕፍት /በቤተክርስቲያናት/ ለምሳሌ፦ ዝዋይ፣ ጽዮን ማርያም፣ መናገሻ ገነተ ጽጌ ቅዱስ ጊዮርጊስ፣ እንጦጦ ማርያም\n\nበሀገሪቱ ባሉ ዓብያተ መዘክርና ዓብያተ መጻሕፍት\n\nአዲስ አበባ ዩኒቨርሲቲ ቤተ መጻሕፍት\n\nብሔራዊ ቤተ መጻሕፍት ወመዘክር\n\nከላይ በተጠቀሱት ቦታዎች ውስጥ ዘጠና በመቶ የሚሆኑት መጻሕፍት በግዕዝ ቋንቋ በጥንታዊ የብራና የአጻጻፍና የአጠራረዝ ዘዴ የተጻፉ ናቸው፡፡\n\n2. ከሀገር ውጭ\n\nበግለሰቦች እጅ\n\nበአብያተ ክርስቲያናት፣ መዘክሩና፣ መጻሕፍት የሚገኝ\n\nእነዚህ በውጭ ሀገር የሚገኙ መጻሕፍት በስጦታ፣ በመገልበጥ፣ በዝርፊያ የወጡ ናቸው፡፡\n\nየኢትዮጵያ መጻሕፍት በአሥር ክፍላት ልናያቸው እንችላለን፦\n\nመጽሐፍ ቅዱስ፦ 46 የብሉይ ኪዳን 35 የሐዲስ ኪዳን መጻሕፍት\n\nየትርጓሜ መጻሕፍት፦ ብሉይና ሌሎችም የተተረጎመባቸው መጻሕፍት\n\nነገረ ሃይማኖት መጻሕፍት፦ ሃይማኖታዊ ይዘት ያላቸው መጻሕፍት እንደ ሃይማኖተ አበው፣ አእማደ ምሥጢራት፣ ክብረ ቅዱሳን .. ወዘተ\n\nየጸሎት መጻሕፍት፦\n\nሀ/ ለአገልግሎት - ምሥጢራት ሲፈጸ ሲሆን በዘመነ ብሉይ የሌዊ ነገድ በአሮንና ልጆቹ መሪነት ወንድ ሁሉ ደብተራ ኦሪትን በክህነት የሚያገለግል ነበር፡፡ ዘሌዋውያን የተባለውም የሌዊን ነገድ የክህነት ሥርዓት ስለሚገልጽ ነው፡፡ 27 ምዕራፎች ሲኖሩት ይዘቱም፦\n\nከምዕ. 1-10 ስለ መሥዋዕትና ሥርዓተ ክህነት፤\n\nከምዕ. 11-16 ስለ መባልዕትና መንጻት፤\n\nከምዕ. 17-22 ስለ ጋብቻና የካህናት ምርጫ፤\n\nከምዕ. 23-27 ሕግና በዓላትን፣ በረከትንና መርገምን የሚገልጽ ሲሆን ሌሎችም ሕግጋተ እግዚአብሔር ተገልጸዋል፡፡\n\nኦሪት ዘኍልቁ\n\nዘኍልቁ ቆጠራ ማለት ሲሆን እሥራኤል፦\n\nበሲና ምድረ በዳ /1÷1-3/\n\nበሞአብ /26÷1-4/ መቆጠራቸውን ስለሚገልጽ ዘኍልቁ ቆጠራ ይባላል፡፡\n\nእሥራኤል ከግብፅ ከወጡ ከ2 ዓመት ከ1 ወር ጀምሮ ሞአብ ሜዳ ድረስ ያለውን ጉዞና እሥራኤል ባለመታዘዛቸው የደረሰባቸውን ጥፋት ይገልጻል፡፡ ከጥፋቶቹም፦\n\nምኞት /11÷4/\n\nማጉረምረም /13-14/\n\nየመሪባ ውኃ /20÷1/\n\nበተጨማሪም የሙሴ እኅት ማርያምና አሮን ሞት፣ በመጨረሻም ምድረ ርስትን እንዴት እንደሚከፋፈሉ ሕግ ከእግዚአብሔር መሰጠቱን የሚገልጽ ሲሆን 36 ምዕራፎች ያሉት መጽሐፍ ነው፡፡\n\nኦሪት ዘዳግም\n\nዘዳግም ማለት የሚደገም ማለት ነው፡፡ በኦሪት ዘጸአት፣ ዘሌዋውያንና ዘኍልቁ የቀረቡትን ሕግጋትና ትእዛዛት በስብከት መልክ ስለሚደግማቸው ዘዳግም /የሚደገም/ ሲባል፤ መጽሐፉ 34 /አርባ/ ምዕራፎች አሉት፡፡\n\nኦሪት ዘዳግም በዮርዳኖስ ማዶ ባለች በሞአብ ምድር ሙሴ ለሕዝበ እሥራኤል የተናገረው ነው፡፡ ይህም እግዚአብሔር ስላደረገላቸውና ስለሰጣቸው ሕግ ማሳሰቢያ ከዚያም ሕጎችንና ደንቦችን እንደ አዲስ የሚተረጉም ሲሆን ሕግጋተ እግዚአብሔርን በመጠበቅ የሚገኝ በረከትና ባለመጠበቅ የሚመጣ መርገምን በምክር መልክ ያስረዳል፡፡ በመጨረሻም፦ ኢያሱ ተሹሞ ሙሴ ባርኮ ማረፉን ይገልጻል፡፡\n\nመጽሐፈ ኩፋሌ\n\nኩፋሌ መክፈል ማለት ሲሆን ከኦሪት የተከፈለ ማለት ነው፡፡ በመጀመሪያው የሥነ ፍጥረት ቀን ጀምሮ እሥራኤል ከግብፅ እስከወጡበት ድረስ ያለውን በኦሪት መጻሕፍት የተጠቀሰ ታሪክ የሚገልጹ 34 ምዕራፎች ያሉት በሙሴ የተጻፈ መጽሐፍ ነው፡፡ መጽሐፉ፦\n\nከአዳም እስከ ሙሴ ያለውን /3830 ዓመት/ ታሪክ ይተርካል፤\n\nታሪኮቹ የተፈጸሙበትን ዘመናት በሱባኤ ይገልጻል፤\n\nታሪኩን ከሕግ ጋር እያዛመደ ያስረዳል፡፡ ለምሳሌ፦ አዳምና ሔዋን ከተፈጠሩበት ምድር ወደ ገነት የገቡበት በ40 እና በ80 ቀናቸው እንደሆነ በምዕ. 4÷8-13 ሲገልጽ ይህም በዘፍ. 2÷7-25 ካለው ታሪክና ዘሌ. 12÷1-5 ከተሰጠው ሕግ ጋር አዛምዶ የተፈጸመባቸው ጊዜያት በሱባዔ ቆጥሮ ይገልጻል፡፡"}, {"heading": "2. የታሪክ ክፍል መጻሕፍት", "content": "መጽሐፈ ኢያሱ ወልደ ነዌ\n\nበጸሐፊው ስም የተሰየመ መጽሐፍ ሲሆን፤ ኢያሱ አዳኝ ማለት ነው፡፡ የመጀመሪያ ስሙ \"አውሴዕ\" ይባል ነበር፡፡ ኢያሱ ያለው ሙሴ ነው፡፡ /ዘኁ. 13÷16/ ይህ መጽሐፍ ሃያ አራት ምዕራፎች ሲኖሩት ሦስት ዋና ትምህርቶችን ይዘዋል፦\n\nየእሥራኤልን ከነዓን መግባት\n\nምድረ ርስትን መከፋፈል\n\nየኢያሱ የመጨረሻ ምክርና ዕረፍት\n\nመጽሐፈ መሳፍንት\n\nመስፍን ፈራጅ አስተዳዳሪ ማለት ነው፡፡ መጽሐፈ መሳፍንት የተባለበት ምክንያት ከኢያሱ ሞት በኋላ እስከ ሳኦል መንገሥ እሥራኤልን ያስተዳድሩ ስለነበሩ መሳፍንት ስለሚገልጽ ነው፡፡ መጽሐፉን የጻፈው ሳሙኤል ነው ተብሎ በብዙ ሊቃውንት ይታመናል፡፡ መጽሐፉ 21 ምዕራፎች አሉት፡፡ እሥራኤል ከአምልኮተ እግዚአብሔር ሲርቁ ጣኦት ሲያመልኩ ለአሕዛብ ያስማርካቸው ነበር፡፡ ተጸጽተው ሲመለሱም መሳፍንቱን እያስነሣ ነፃ ያወጣቸው ነበር፡፡ /2÷11-23/\n\nበዚህ ጊዜ የነበሩ መሳፍንት 15 ሲሆኑ በመጽሐፈ መሳፍንት የተጠቀሱት 13 ናቸው፡፡ ያልተጠቀሱት ኤሊና ሳሙኤል የቤተመቅደስ ሊቃነ ካህናት ነበሩ፡፡ እነዚህ መሳፍንት ለ450 ዓመታት አስተዳድረዋል፡፡ /የሐዋ. ሥራ 13÷20/\n\nበመጽሐፉ ከምዕ. 1-2 እሥራኤል የእግዚአብሔርን ውለታ መዘንጋታቸው፤\n\nከምዕ. 3-16 የመሳፍንቱ አነሳስና በነርሱ አማካይነት የተፈጸሙት ታሪኮች፤\n\nከምዕ. 17-21 ንጉሥ ባልነበረበት ዘመን የተፈጸሙ ታሪኮችን እናገኛለን፡፡\n\nመጽሐፈ ሩት\n\nመጽሐፉ በነቢዩ ሳሙኤል እንደተጻፈ የሚታመን ሲሆን 4 ምዕራፎች አሉት፡፡ በዘመነ መሳፍንት አቤሜሌክና ኑኃሚን ከሁለት ወንድ ልጆቻቸው ጋር በረሃብ ከቤተልሔም ዘይሁዳ ወደ ሞአብ መሰደዳቸውና በቤተሰቡ የደረሰው መከራ እንዲሁም ሞዓባዊቷ ሩት ለኑኃሚን ያደረገችላትን ውለታና ሩት የንጉሥ ዳዊት ቅድመ አያት መሆኗን ይገልጻል፡፡\n\nበምዕ. 1 መሰደዳቸውና ከስደት መልስ፤\n\nከምዕ. 2-3 ሩት የቦኤዝን እርሻ በመቃረም ኑኃሚንን መርዳቷና፤\n\nበምዕ. 4 ቦኤዝን አግብታ በዳዊት ሐረግ መቆጠሯን እናገኛለን፡፡\n\nመጽሐፈ ሄኖክ\n\nመጽሐፈ ሄኖክ እንደ ቤተክርስቲያናችን አቆጣጠር በ4014 ዓ.ዓ. ከጌታ ልደት በፊት ሄኖክ እንደጻፈው ይታመናል፡፡ እንዲሁም ሐዋርያት የገለጹት /ይሁዳ 1÷14/ 70 ሊቃውንትም የተረጎሙት ሲሆን፦\n\nስለመድኃኒታችን ኢየሱስ ክርስቶስ\n\nስለፀሐይ፣ ጨረቃ ዑደትና ስለ እፅዋት\n\nስለ ቅዱሳን መላእክት\n\nስለ ጻድቃንና ኃጥአን\n\nበኖኅ ዘመን የተፈጸመው ኃጢአትና ቅጣትን በሰፊው የሚገልጽ 42 ምዕራፎች ያሉት መጽሐፍ ነው፡፡\n\nመጽሐፈ ዮዲት\n\n16 ምዕራፎች ያሉት በእግዚአብሔር ጥበብ ሆሎፎርኒስ የተባለውን የናቡከደነጾር የጦር መሪ ገድላ ወገኖቿን እና ሀገሯን እንዴት እንዳዳነች የሚገልጽ መጽሐፍ መሳ. 3÷15-30 ከተጠቀሰው የናኦድ ታሪክ ጋር ተመሳሳይነት ያለው ታሪክ ነው፡፡ በማንና መቼ እንደተጻፈ በትክክል ባይታወቅም በስደት የነበሩ አይሁድ ሳይጽፉ አይቀርም፡፡ ታሪኩ የተፈጸመው 600 /ስድስት መቶ/ ዓመታት ከጌታ ልደት በፊት ሲሆን መጽሐፉ፦\n\nሀ. በሆሎፎርኒስ የጦር ዘመቻና የእሥራኤል ልጆች ፍርሐት /ከምዕ. 1-7/፤\n\nለ. ዮዲት ሆሎፎርኒስን ገድላ ወገኖቿን ማዳኗ /ምዕ. 8-15/ እናገኛለን፤\n\nሐ. ዮዲት ለእግዚአብሔር ያቀረበችው ምስጋና እና እረፍቷን /በምዕ. 16/ እናገኘዋለን፡፡\n\nመጽሐፈ ነገሥት /መጽሐፈ ሳሙኤል/ ቀዳማዊ እና ካልዕ\n\nእነዚህ መጻሕፍት በነቢዩ ሳሙኤል የተጠሩት ሳሙኤል ስለጀመራቸው ሲሆን 1ኛ ሳሙኤልን የተወሰነውን ክፍል፤ 2ኛ ሳሙኤልን ናታንና ጋድ ጽፈውታል /1ኛ ዜና መዋ. 29÷29/፡፡\n\nመጽሐፈ ሳሙኤል ቀዳማዊ፦ ስለነቢዩ ሳሙኤል አጠራር፣ የታቦተ ጽዮን መማረክና ኃይል አድርጎ መመለስ፣ የመጀመሪያው የእሥራኤል ንጉሥ ሳኦል መንግሥትና የዳዊት በሳኦል መተካትን ይገልጻል፡፡\n\nመጽሐፈ ሳሙኤል ካልዕ፦ ሙሉ በሙሉ የዳዊትን ታሪክ ሲገልጽ፤ ዳዊት ምንም እንኳን ልበ አምላክ ቢባልም ሁለት ጊዜ እግዚአብሔርን እንዳሳዘነና በንስሐ በመመለሱም እግዚአብሔር እንደተደሰተበት፣ ለቃል ኪዳኑ ታቦት የነበረውንም ክብር እናያለን፡፡\n\nበአጠቃላይ 1ኛ እና 2ኛ ሳሙኤል በአራት ዐበይት ጉዳዮች ይካተታሉ፡፡ እነርሱም፦\n\nየነሳሙኤል ሕይወት\n\nየሳኦል ዘመነ መንግሥት\n\nየታቦተ ጽዮን ክብር\n\nየዳዊት ዘመነ መንግሥት\n\nመጽሐፈ ነገሥት /መጽሐፈ ነገሥት ቀዳማዊና ካልዕ/ ሣልስ ዋዕል በድጋሚ እንደተገለጸው ዓይነት ነው፡፡\n\nመጽሐፈ አስቴር\n\nበትልቁ መጽሐፍ ቅዱስ ሁለት በአስቴር የተሰየሙ መጻሕፍት ሲኖሩ፤ በ66ቱ ጭምር የሚገኘውን በቅድሚያ እናያለን፡፡ በዚህ መጽሐፍ የእግዚአብሔር ስም ያልተጠቀሰ ሲሆን፤ በ127 አገሮች ነግሦ በነበረው በአርጤክስስ ዘመን የተፈጸመ ታሪክ የሚገልጽ 10 ምዕራፎች ያሉት መጽሐፍ ነው፡፡ በይዘቱም፦\n\nንጉሥ አርጤክስስ አስቴርን ማግባቱንና መርዶክዮስ በንጉሡ የታቀደውን ግድያ ማጋለጡ /ከምዕ. 1-2/፤\n\nሐማ በመርዶክዮስና በአይሁድ ያሴረው ሤራ /ከምዕ. 3-5/፤\n\nበአስቴር አማካይነት አይሁድ ሦስት ቀን ከጾሙ በኋላ ሐማ እና የአይሁድ ጠላቶች መጥፋታቸው /ከምዕ. 6-10/ ይገልጻል፡፡\n\nሁለተኛው /በ81ዱ መጽሐፍ ጥራዝ ብቻ የሚገኘው/ መጽሐፈ አስቴር፦ 11 ምዕራፎች ይዞ ከላይ ባየነው መሠረት ያሉትን በስፋት የሚገልጽ የሚደግም ነው፡፡ ከላይኛው የሚለየውም የታሪኩ መነሻ ሕልም ከነትርጓሜው በመጽሐፉ በመጀመሪያና መጨረሻ ስለሚገልጽ ሲሆን፤ በተጨማሪም በዚህኛው መጽሐፈ አስቴር የእግዚአብሔር ስም ተጠቅሷል፡፡ መጽሐፈ አስቴርን ማን እንደጻፈው በትክክል ባይታወቅም የፋርስን ቤተመንግሥት ሥርዓት የሚያውቅ መርዶክዮስ እንደጻፈው በብዙ ሊቃውንት ይታመናል፡፡\n\nመጻሕፍተ መቃብያን\n\nበዓለም ስምንት የሚደርሱ የመቃብያን መጻሕፍት አሉ፡፡ ማን እንደጻፋቸው በግልጽ አይታወቅም፡፡ ከነዚህም ሁለቱ በፍትሐ ነገሥት የተገለጹት የሚከተሉት ናቸው፦\n\nመጽሐፈ መቃብያን ቀዳማዊ፦ 16 ምዕራፎች የያዘ ይሁዳ መቃብያስንና ወንድሞቹ ሃይማኖታዊ ሕግና ሥርዓት ለመጠበቅ ከሌሎች መንግሥታት ጋር ያደረጉትን ተጋድሎ ይገልጻል፡፡\n\nመጽሐፈ መቃብያን ካልዕ፦ በ15 ምዕራፎች የተከፈለ የመጀመሪያው ተከታይና በተለይም በግብጽ የሚኖሩ አይሁድ በኢየሩሳሌም ቤተመቅደሱ ይፈርሳል ብለው ስለሚፈሩት አደጋ ይዘረዝራል፡፡\n\nእነዚህ ከላይ ያየናቸው የመቃብያን መጻሕፍት በመጽሐፍ ቅዱስ ከተጠቀሱት የመቃብያን መጻሕፍት ይለያሉ፡፡ በመጽሐፍ ቅዱስ የተጠቀሱትም፦\n\nመጽሐፈ መቃብያን ቀዳማዊ፦ የመቃቢስ ዘብንያም ልጆች አብያ፣ ሲላስና ፈንቶስ ከሁለት ወንድሞቻቸው ጋር የተቀበሉትን ሰማዕትነት የተናገሩትን እንዲሁም ከብሉይ ኪዳን ታሪኮችና ምሳሌዎችን እየጠቀሱ ስለትንሣኤ ሙታን፣ የሰው ልጅ የነፍስና ሥጋ በረከትና ሕይወት ስለሚያገኝበት መንገድ የመከሩትን ሲገልጽ፣ በተጨማሪም ይሁዳ፣ መብክያስና መቃቢስ 36 ምዕራፎች ያሉት መጽሐፍ ነው፡፡\n\nመጽሐፈ መቃብያን ካልዕ፦ 21 ምዕራፎች አሉት፡፡\n\nሀ. ከምዕራፍ 1-4 መቃቢስ ዘሞዓብ የተባለው ንጉሥ በኢየሩሳሌም ያደረሰው ጥፋት፣ በንስሐ ተመልሶ የሠራውን በጎ ሥራና ዕረፍቱን፣\n\nለ. ከምዕራፍ 5-12 የመቃቢስ ዘሞዓብ ልጆች በእግዚአብሔር ስላመኑ ጺሩጻይዳን የተባለው የከለዳውያን ንጉሥ ያደረሰባቸው መከራ፤\n\nሐ. ከምዕራፍ 13-21 የመቃቢስ ዘሞዓብ ልጆችን አብነት አድርጎ ስለትንሣኤ ሙታን ለማያምኑ የተሰጠ መልስ የያዘ መጽሐፍ ነው፡፡\n\nመጽሐፈ መቃብያን ሣልስ፦ የብሉይ ኪዳንን ታሪኮች እየጠቀሰ የጽድቅና የኩነኔን የትንሣኤ ሙታንን እንዲሁም ዲያብሎስ የሰው ልጆችን የሚያስትባቸውን መረቦች የሚገልጽ 10 ምዕራፎች ያሉት መጽሐፍ ነው፡፡\n\nመጽሐፈ ጦቢት\n\nየቅዱሳን መላእክት ተራዳኢነት ስለተደረገለት ጦቢት ስለተባለው ቅዱስ አባትና ቤተሰቡ የሚገልጽ 14 ምዕራፎች ያሉት መጽሐፍ ነው፡፡\n\nጦቢት በበጎ ሥራው እያለ ባገኘው መከራ እና ሣራ የተባለችው ሴት የጸለዩት ጸሎት /ከምዕ. 1-3/\n\nጦቢት በመከራው ጊዜ ልጁን ጦቢያን ወደ ወገኖቹ ሲልክ ቅ. ሩፋኤል በሰው ተመስሎ እንዴት እንደረዳቸው /ከምዕ. 4-12/\n\nየጦቢት ምስጋናና ዕረፍት /ከምዕራፍ 13-14/ መጽሐፉ ከ700ኛው-500ኛው ዓመት ከጌታ ልደት በፊት የተፈጸመውን ታሪክ ይገልጻል፡፡"}, {"heading": "3. የመዝሙር ክፍል መጻሕፍት", "content": "መዝሙር፦ ማዜም ማለት ነው፡፡ በዚህ ትምህርታችንም ይህንን መዝሙርን የያዙትንና በመዝሙር መልክ የተጻፉ ታሪካዊና የጥበብ /የምክር/ መጻሕፍትን እናገኛለን፡፡\n\n1. መጽሐፈ ኢዮብ\n\nዖጽ በሚባል ሀገር ስለነበረ ኢዮብ ስለተባለ ጻድቅ በዲያብሎስ ተንኮል በእግዚአብሔር ፈቃድ ተፈትኖ በትእግስት ማለፉን የሚገልጽ 42 ምዕራፎች ያሉት አጻጻፉም ከመጀመሪያውና ከመጨረሻው በስተቀር እንደ መዝሙር ምሳሌ ዓይነት አጻጻፍ ያለው መጽሐፍ ሲሆን፦\n\nሀ. የኢዮብ መፈተን /ከምዕራፍ 1-3/፤\n\nለ. ጓደኞቹ እንደተከራከሩት /ከምዕራፍ 4-37/፤\n\nሐ. የእግዚአብሔር ጥያቄና የኢዮብ እጥፍ በረከት መቀበል /ምዕራፍ 38-42/፡፡\n\nኢዮብ በመሥዋዕት አቀራረቡ ከአብርሃም አምስተኛ ትውልድ ለሙሴ ሕግ ከመሰጠቱ በፊት የነበረ እንደሆነ የቤተክርስቲያን ሊቃውንት ያስረዳሉ፡፡\n\n2. መዝሙረ ዳዊት\n\n150 መዝሙራትን የያዘ በቤተክርስቲያናችን ሆነ በሌሎች ዘንድ ተወዳጅነት ያለው መጽሐፍ ሲሆን የቤተክርስቲያናችን የጸሎት፣ የመዝሙር መጻሕፍትም መሠረታቸው ይህ መጽሐፍ ነው፡፡ /ለምሳሌ ድጓ/\n\nመዝሙራትን ማን እንዳሰባሰበው ባይታወቅም ንጉሥ ዳዊት በነበረበት ዘመን ጀምሮታል /1ኛ ዜና 16/፡፡ ነገር ግን ከምርኮ በኋላ ስለነበሩ ሁኔታዎች የሚገልጽ ዕዝራ አሰባስቦ በአሁኑ መልክ ሳያዘጋጀው አልቀረም የሚሉ ሲኖሩ በቤተክርስቲያናችን መጽሐፍ ቅዱስን መሠረት አድርጎ የሚሰጠው አንድምታዊ ትምህርት የሚከተለው ነው፡፡\n\nዳዊት ልበ አምላክ፦ የተመረጠ ማለት ሲሆን የመጀመሪያው ንጉሥ ሳኦል ለእግዚአብሔር ባለመታዘዙ፣ ዳዊትን በነቢዩ ሳሙኤል አማካኝነት እግዚአብሔር ለንግሥና መረጠና ቀባው፡፡ ሲቀባውም ለዳዊት ሰባቱ የመንፈስ ቅዱስ ስጦታዎች ተሰጥተውታል፡፡ እነዚህም፦\n\nሀብተ መንግሥት\n\nሀብተ ክህነት\n\nሀብተ ኃይል\n\nሀብተ መዊዕ /ማሸነፍ/\n\nሀብተ በገና\n\nሀብተ ፈውስ\n\nሀብተ ትንቢት ናቸው፡፡\n\nሀብተ ትንቢትም 150 መዝሙራትን መድረስ ትንቢትን መናገር ነው፡፡ እነዚህም /ዳዊት በተሰጠው ፀጋ የደረሳቸው መዝሙራት/ የዳዊት መዝሙራት ሲባሉ በአሥር አርዕስት ይከፈላሉ፡፡ እነርሱም፦\n\nለሁሉም ተግሳፅ /ምክር/ (መዝ. 1÷1)\n\nስለክርስቶስ የተነገረ (መዝ. 2÷1)\n\nስለዳዊት የተነገረ (መዝ. 3÷1)\n\nስለመናንያን የተነገረ (መዝ. 4÷1)\n\nስለትሩፋት የተነገረ (መዝ. 5÷1)\n\nስለ ሕዝቅያስ የተነገረ (መዝ. 13÷1)\n\nስለኤርምያስ የተነገረ (መዝ. 34÷1)\n\nስለመቃብያን የተነገረ (መዝ. 43÷1)\n\nለካህናት ተግሣጽ (መዝ. 49÷1)\n\nስለ ሰሎሞን (መዝ. 71÷1) የተነገሩ ትንቢቶችና ሌሎች 140 በእነዚህ ሥር ይካተታሉ፡፡\n\nበዚህም 7 ዓበይት ትምህርት የሚሰጡ ነገሮች አሉበት፡፡ እነርሱም፦\n\nጠላትን መውደድ /7÷4/\n\nትህትና /21÷6/\n\nሃይማኖት /21÷10/\n\nተስፋ መንግሥተ ሰማያት /26÷1/\n\nኃጢአትን ማመን /37÷4/\n\nይቅርታ /50/\n\nምፅዋት /111÷8/ ናቸው፡፡\n\nስለዚህም መዝሙረ ዳዊት ከዳዊት በፊትም ሆነ በኋላ የተደረጉትን ድርጊቶች መግለጻቸው ያለፈውን አንስቶ ምክር ተግሳጽና ምስጋና ለወደፊት ስለሚሆነው በትንቢት መናገር ነው፡፡ በአጠቃላይ መዝሙረ ዳዊት ከክርስቶስ ልደት በፊት 1000 ዓመት በንጉሥ ዳ ሩትን ትንቢት በጽሑፍ ያላሠፈሩ የተነገራቸውን በታሪክ መጻሕፍት የተጻፉ ናቸው:: ለምሳሌ :- ኤልያስ፣ ኤልሳዕ፣ ረዓይ፣ አኪያ ወዘተ\n\nለ/ የጽሑፍ:- የተናገሩትን በጽሑፍ ያሠፈሩ ናቸው:: እነዚህም በጻፏቸው መጻሕፍት ምዕራፍና ቁጥር ብዛት በማዕረጋቸው /ብቃታቸው/ ዐበይትና ደቂቅ ተብለው ይከፈላሉ፡፡\n\nዐበይት:- የሚባሉት ኢሳይያስ፣ ኤርሚያስ፣ ሕዝቅኤልና ዳንኤል ሲሆኑ\n\nደቂቅ:- ነቢያትም ከትንቢተ ሆሴዕ እስከ ሚልክያስ ያሉት ስማቸው በመጻሕፍቶቻቸው በርዕስነት የተጠቀሱት ናቸው፡፡\n\n1. ትንቢተ ኢሳይያስ ኢሳይያስ መድኃኒት ማለት ሲሆን መጽሐፉ 66 ምዕራፎች ያሉት ከጌታ ልደት በፊት 700 ዓ.ም. የተጻፈ ነው፡፡ ነቢዩ በትንቢቱ፡-\n\nሀ. ስለ ባቢሎን ምርኮ፤\n\nለ. ከምርኮ ስለመመለሳቸውና፤\n\nሐ. ስለጽዮን /በተለያየ መልኩ/ የሚናገር ሲሆን በተለይም ስለጌታችን ግልጽ ትንቢቶችን ተናግሯል:: /7÷14፣ 53÷1፣ 9÷6/ በዚህም የውጭ ሊቃውንት ወንጌላዊ ነቢይ የሀገራችን ቤተክርስቲያን ሊቃውንት ደግሞ ደረቅ ሐዲስ ይሉታል::\n\nነቢዩ ኢሳይያስ ኦዝያን ክህነት ሳይኖረው ቤተ መቅደስ ሲያጥን ባለመገሰጹ ለ3 ዓመት ነቢይነት ከተነሣ በኋላ በትንቢተ ኢሳ. 6÷1 እንደምናገኘው በድጋሚ የተላከ ታላቅ የእግዚአብሔር ነቢይ ነው፡፡\n\n2. ትንቢተ ኤርሚያስ ኤርሚያስ እግዚአብሔር ከፍ ያደርጋል ማለት ነው:: ከጌታ ልደት በፊት በ600 ዓ.ም. በባቢሎን ምርኮ የነበረ ካህን ሲሆን የመከራ፣ የልቅሶ፣ የሰቆቃ ነቢይ ይባላል፡፡ ከማኅፀን የተመረጠ በ20 ዓመቱ የተጠራ /1÷4-7/ በመጨረሻም በድንጋይ ተወግሮ በሰማዕትነት ያረፈ በሕይወቱም ስለ እግዚአብሔር ቃል እየመሠከረ ብዙ መከራ የተቀበለ ነቢይ ነው:: /ተረፈ ኤር. 11÷61/ መጽሐፉ 52 ምዕራፎች ያሉት ስለ ኢየሩሳሌም ብቻ ሳይሆን ለጎረቤት ሀገሮችም የተነበየ፣ በተለይም ስለ ባቢሎን ምርኮ የሕዝቡን በደል እየነገረ እንዲመለሱ በትንቢት ያስጠነቅቃል:: የኢየሩሳሌምን በባቢሎን መማረክ ይገልጻል:: በተጨማሪም ከትንቢተ ኤርምያስ ጋር የሚቆጠሩ 1. በነቢዩ 2. በደቀመዝሙሩ በባሮክ የተጻፉ መጻሕፍት አሉ፡፡ እነዚህም:-\n\nሰቆቃወ ኤርምያስ:- ሰቆቃ ልቅሶ፣ ሙሾ ማለት ነው:: /ተረፈ ኤር. 8÷22፣ 2ኛ ዜና 35÷25/ ነቢዩ ኤርምያስ በኢዮስያስ ሞትና በኢየሩሳሌም መጥፋት ያለቀሰውን የጻፈው 5 ምዕራፍ ያለው መጽሐፍ ነው፡፡\n\nተረፈ ኤርምያስ:- ከሰቆቃወ ኤርምያስ ቀጥሎ ምዕራፍ 6 ብሎ የሚጀምር 6 ምዕራፎች ያሉት ስለ ባቢሎን ምርኮ /ለነ ኤርምያስ/ ለባሮክና ለአቤሜሌክ የምርኮውን ዘመን እግዚአብሔር እንዴት እንዳሳለፈላቸው፣ በነቢዩ ኤርምያስ ስለተመለሱ ምርኮዎችና ስለ ኤርምያስ ሰማዕትነት የሚገልጽ በባሮክ የተጻፈ መጽሐፍ ነው:: /ተረፈ ኤርምያስ 11÷63/\n\nመጽሐፈ ባሮክ:- በባቢሎን ለተማረኩት አይሁድ የላከላቸው 5 ምዕራፎች ያሉት መጽሐፍ ነው:: በይዘቱም አይሁድን ለንስሐ የሚቀሰቅስ ጸሎት ምክር እናገኛለን፡፡ ከላይ ያየናቸው ሦስት መጻሕፍት የተጻፉበት ጊዜ ከትንቢተ ኤርምያስ ጋር ተቀራራቢ ነው፡፡\n\n3. ትንቢተ ሕዝቅኤል ሕዝቅኤል እግዚአብሔር ብርታት ይሰጣል ማለት ሲሆን፤ 600 ዓመት ከጌታ ልደት በፊት የነበረና በልጅነት ወደ ባቢሎን የተማረከ እዚያው ለ20 ዓመታት እያስተማረ ቆይቶ በሰማዕትነት ያረፈ ነው:: መጽሐፉ 48 ምዕራፎች ያሉት ሲሆን-\n\nሀ. የእግዚአብሔርን ቃል ማስተላለፍ ስላለበት ኃላፊነት፣ ስለ አይሁድ በባቢሎን መማረክ /ከምዕ. 1-24/፤\n\nለ. ከምርኮ መመለሳቸው፣ ቤተመቅደስ መታደስ፣ የሕንፃው አሠራር፣ ምድረ ርስት ክፍፍል፣ ስለ መንግሥተ ሰማያት /ከምዕ. 25-48/ በተጨማሪም ሕዝቅኤል ስለ ምሥጢረ ሥጋዌ /43÷1-2/ ስለ እመቤታችን /44÷2/ ስለ ምሥጢረ ጥምቀት /36÷25-27/ ስለ ትንሣኤ ሙታን /37÷1/ የጻፈ ሲሆን እንዲሁም ሕዝቅኤል እንደ ትንቢተ ኢሳይያስና ተረፈ ኤርምያስ ግልጽ ትንቢት ያለው መጽሐፍ ነበረው፤ አቃጥለውታል::\n\n4. ትንቢተ ዳንኤል ዳንኤል እግዚአብሔር ፈራጅ ነው ማለት ሲሆን፤ ከጌታ ልደት በፊት 600 ዓመት ናቡከደነጾር /ብልጣሶር/ በቄሮስና ዳርዮስ ዘመን የሕዝቅኤል ጓደኛ የነበረ ነቢይ ነው፤ መጽሐፉም በ12 ምዕራፎች የተከፈለ ነው:: 1. የነቢዩ ዳንኤልና የ3ቱ ደቂቅ /አናንያ፣ አዛርያ፣ ሚሳኤል/ በናቡከደነጾር ቤተመንግሥት መመረጥ ነው:: 2. የነቢዩ ዳንኤል የሕልም ትርጉም አዋቂነትና 3. ለነቢዩ ዳንኤል የተገለጸለት ምሥጢር /ስለጌታችን ዳግም ምጽአት፣ በምድር ስለሚፈጸሙ ታሪኮችን ወ.ዘ.ተ. የምናገኝበት መጽሐፍ ሲሆን፣ በተጨማሪም ነቢዩ ከዚሁ ጋር የሚቆጠሩ 3 መጻሕፍት አሉት፡፡ እነርሱም:-\n\n4.1 ጸሎተ 3ቱ ደቂቅ /የሦስቱ ልጆች መዝሙር/:- በትንቢተ ዳንኤል 3÷23 ባለው ታሪክ መሠረት ሠለስቱ ደቂቅ ሲድራቅ፣ ሚሳቅ አብደናጎም /አናንያ፣ አዛርያ፣ ሚሳኤል/ ታሥረው በሚነድ እሳት በተጣሉ ጊዜ ወደ ልዑል እግዚአብሔር ያቀረቡትን ጸሎትና ምስጋና የሚገልጽ አንድ ምዕራፍ ያለው መጽሐፍ ነው::\n\n4.2 ታሪከ ሶስና:- ሶስና በዝሙት ወንጀል ተፈርዶባት ልትወገር ስትል ነቢዩ ዳንኤል የእግዚአብሔር ጥበብ በሞላበት ዘዴና ፍርድ እንዳዳናት የሚገልጽ አንድ ምዕራፍ ያለው መጽሐፍ ነው፡፡\n\n4.3 ተረፈ ዳንኤል:- ይህ መጽሐፍ አንድ ምዕራፍ ያለው:-\n\nሀ. ፋርሳውያንና የባቢሎን ሰዎች ያመልኳቸው የነበሩትን ጣዖት ነቢዩ ዳንኤል እንዴት እንዳጠፋና እንዳሳፈረ /ከቁ. 1-28/\n\nለ. ነቢዩ ዳንኤልን እግዚአብሔር ከአንበሶች አፍ እንዳዳነው /ከቁ. 29-42/ የሚገልጽ ከት. ዳንኤል 6÷4-24 ላይ ከተጠቀሰው ታሪክ ጋር ተመሳሳይነት ያለውና አስፍቶ የሚገልጽ ነው::\n\n5. ትንቢተ ሆሴዕ ሆሴዕ እግዚአብሔር ያድናል ማለት ሲሆን፤ በ700 ዓ.ም. /ከጌታ ልደት በፊት የነበረ የእሥራኤል ነቢይ ነው፡፡ ትንቢተ ሆሴዕ 14 ምዕራፎች ሲኖሩት ስለ እግዚአብሔርና ሕዝበ እሥራኤል፤ በነቢዩ፣ በሚስቱና በልጆቹም ምሳሌ እያደረገ /ሆኖ/ ያስተማረና የተነበየ ነው፡፡ ሆሴዕ ስለጌታችን በምዕ. 6÷1-3፣ 11÷1 ተንብዮአል::\n\n6. ትንቢተ አሞጽ አሞጽ ከእረኝነት የተጠራ የእሥራኤል ነቢይ ነው:: 7÷14 በዘጠኝ ምዕራፎች የከፈለው መጽሐፉ፡-\n\nሀ. የፍልስጥኤም እሥራኤል ሕዝብ ኃጢአት በመብዛቱ ማስጠንቀቂያ፤\n\nለ. በሳምራውያን የእግዚአብሔር ቁጣ፤\n\nሐ. ለእሥራኤል ተስፋ ይገኝበታል፡፡\n\n7. ትንቢተ ሚክያስ ሚክያስ እግዚአብሔርን የሚመስል ማን ነው? ማለት ሲሆን መጽሐፉ 7 ምዕራፎች አሉት፡፡ ስለሰማርያና ኢየሩሳሌም መማረክና መመለስ፤ ስለጌታችን በቤተልሔም መወለድ /5÷2/ የተነበየ ከክርስቶስ ልደት በፊት በ700 ዓመት በፊት የነበረ ነቢይ ነው፡፡\n\n8. ትንቢተ ኢዩኤል ኢዩኤል እግዚአብሔር አምላክ ነው ማለት ሲሆን ከጌታ ልደት በፊት በ600 ዓመት የነበረ የይሁዳ ነቢይ ነው፡፡ መጽሐፉ 3 ምዕራፎች ያሉት ስለ ባቢሎን ምርኮ መልስ፣ ስለርደተ መንፈስ ቅዱስ /የመንፈስ ቅዱስ መውረድ በሐዋርያት 2÷28/ ተንብዮአል፡፡\n\n9. ትንቢተ አብድዩ አብድዩ የእግዚአብሔር አገልጋይ ማለት ሲሆን፤ 600 ዓመት ከጌታ ልደት በፊት የነበረ ነቢይ ነው:: መጽሐፉ አንድ ምዕራፍ ያለው ስለ ኤዶምያስ /ኤሳው ወገኖች/ የተነበየ ነው፡፡\n\n10. ትንቢተ ዮናስ ዮናስ ርግብ፣ የዋህ ማለት ነው:: 900 ዓመት ከጌታ ልደት በፊት የነበረ ሲሆን መጽሐፉ በአራት ምዕራፎች የተከፈለ:-\n\nሀ. ዮናስ እግዚአብሔር ካዘዘው ሀገር መኮብለሉ /በምዕ. 1-2/\n\nለ. በድጋሚ የዮናስ መላክና የነነዌ ንስሐ /ምዕ. 1-3/\n\nሐ. በነነዌ ሊደርስ የነበረው ጥፋት መመለስና የነቢዩ ዮናስ አለመደሰት /ምዕ. 4/ የሚገልጽ ነው፡፡\n\n11. ትንቢተ ናሆም ናሆም መጽናናት ማለት ሲሆን፣ 700 ዓመት ከጌታ ልደት በፊት የነበረ ስለይሁዳ ሕዝብ ከአሦራውያን ነፃ መውጣት፣ ስለ ነነዌ ዳግም ጥፋት የተነበየ፤ መጽሐፉ በ3 ምዕራፎች የተከፈለ ነው::\n\n12. ትንቢተ ዕንባቆም ዕንባቆም ማቀፍ ማለት ሲሆን መጽሐፉ ሦስት ምዕራፎች ያሉት፣ የአይሁድ ሕዝብ በኃጢአቱ ስለሚደርስበት መከራ፣ ከለዳውያን በሚገዟቸው ላይ ባደረሱት ግፍ የሚደርስባቸው ቅጣትና ነቢዩ የጸለየውን ጸሎት የሚገልጽ ነው፡፡\n\n13. ትንቢተ ሶፎንያስ 700 ዓመት ከጌታ ልደት በፊት የነበረ የይሁዳ ነቢይ ነው፡፡ መጽሐፉ 3 ምዕራፎች ሲኖሩት:- አይሁድ እንዲመለሱ ምክርና ማስጠንቀቂያ፣ /1÷4-6፣ 12/ በኢየሩሳሌም አካባቢ ለሚገኙ ሕዝቦች ማስጠንቀቂያ /2÷4/ እና አሕዛብ ወደ እግዚአብሔር እንዲመለሱ 3÷8-13 እግዚአብሔር እሥራኤልና ይሁዳን ከምርኮ እንደሚመልሳቸው 3÷14-20 ይገልጻል፡፡\n\n14. ትንቢተ ሐጌ 500 ዓመት ከጌታ ልደት በፊት ከባቢሎን ምርኮ በኋላ የነበረ የይሁዳ ነቢይ ሲሆን በ3 ምዕራፍ የተከፈለ መጽሐፍ ነው:: ስለ ቤተመቅደስ ዳግም መታነጽ ምዕ. 1÷4-15፣ ምዕ. 2÷3-9 እግዚአብሔር ቁጣውን በበረከት እንደሚመልሰው ምዕ. 2÷11-19 ስለ ዘሩባቤል ምዕ. 2÷20-23 ይገልጻል::\n\n15. ትንቢተ ዘካርያስ ዘካርያስ እግዚአብሔር ያስተምራል ማለት ሲሆን 500 ዓመት ከጌታ ልደት በፊት የነበረ ነው፡፡ መጽሐፉ 14 ምዕራፎች ሲኖሩት የአይሁድ ከምርኮ መመለስ የቤተመቅደስ መታደስ ስለኢያሱና ዘሩባቤል በኢየሩሳሌም ዙሪያ ላሉት አሕዛብም የተነገረ ትንቢት ሲኖረው ስለጌታችን ጎኑን በጦር መወጋት /12÷10/ የሐዋርያት ጌታ ሲያዝ መበተን /13÷7/ ስለሆሳዕና ምዕ. 9 ስለዳግም ምጽአት /14÷5/ በተጨማሪም ስለእመቤታችን በወርቅ መቅረዝ ምዕ. 4÷3 ስለመላእክት ተራዳኢነት /1÷12/ ይገልጻል::\n\n16. ትንቢተ ሚልኪያስ ሚልኪያስ ማለት መልእክተኛ ማለት ሲሆን 400 ዓመት ከጌታ ልደት በፊት የነበረ ነቢይ ነው፡፡ መጽሐፉ 4 ምዕራፎች ሲኖሩት:-\n\nስለአይሁድ ካህናትና ሕዝብ የተሰጠ የእግዚአብሔርን ተግሳጽ /1÷2/\n\nስለ አሥራት በኵራት የተነገረ ምክርና ስለጌታችንና መጥምቁ ዮሐንስ /3÷1፣ 4÷5/ ይገልጻል፡፡"}]}, {"chapter_id": "ymkt_ch7", "title": "ምዕራፍ ሰባት፡ ሐዲስ ኪዳን", "page_start": 7, "sections": [{"heading": "ምዕራፍ ሰባት፡ ሐዲስ ኪዳን", "content": "በዚህ ጥናታችን የወንጌል፣ የታሪክ፣ የትምህርት /መልእክት/፣ የትንቢትና የሥርዓት ብለን 35ቱን የሐዲስ ኪዳን መጻሕፍትን በአምስት እንከፍላቸዋለን:: ከእነዚህም በዚህ ምዕራፋችን የወንጌልንና የታሪክ መጻሕፍትን በአንድ ላይ እንመለከታለን፡፡"}, {"heading": "ወንጌል (አርባዕቱ ወንጌላት)", "content": "ዩአንጌልዮን /ኢቫንጌልዮን/ ከሚለው የግሪክ ቃል የተወሰደ ሲሆን ትርጉሙም ስብከት የምሥራች ማለት ነው፡፡ ይህ የምሥራች እንደሚሰበክ አስቀድሞ በትንቢት፣ ኋላም በመላእክት የተሰበከ ሲሆን በመጀመሪያ ጌታችን ኢየሱስ ክርስቶስ ኋላም ሐዋርያት ገልጸዋል፡፡ /ኢሳ. 61÷1-2፣ ሉቃስ 4÷17፣ ማቴ. 24÷14፣ ማር. 16÷15፣ ማቴ. 4÷23፣ ማር. 1÷4/\n\nወልድ በሥጋ ተገልጾ ያደረገውን የማዳን ጉዞ ለሰዎች የሰጠውን ከኃጢአትና ከዲያብሎስ ባርነት ነፃ መውጣት ስለሚገልጽ ወንጌል የምሥራች ተብሏል፡፡ ጸሐፊያኑም ወንጌላውያን ሲባሉ ማቴዎስና ዮሐንስ ከሐዋርያት ማርቆስና ሉቃስ ከአርድእት ናቸው፡፡\n\nወንጌላውያን አራት ናቸው:: ምክንያቱም፦\n\nየጌታን ዙፋን ከሚሸከሙት 4ቱ እንስሳት ምሳሌ ወንጌላውያንም አራት ሆነዋል /ራዕይ 4÷7፣ ኢሳ. 6÷2/\n\nከአንድ ዕፀ ሕይወት ሥር መንጭተው ምድርን ከድርቀት ወደ ልምላሜ፤ ከልምላሜ ወደ አበባ፣ ከአበባ ወደ ፍሬ የሚያደርሱ አራት አፍላጋት /ወንዞች/ /ዘፍ. 2÷10-15/ ወንጌላውያንም አራት ሲሆኑ ከአንድ ጌታ ተምረው ዓለምን ከኃጢአት ወደ ንስሐ ከንስሐ ወደ ትሩፋት ከትሩፋት ወደ ክብር የሚያደርስ ወንጌልን ጽፈውልናል፡፡ በእነዚህና በሌሎች ምክንያት ወንጌላውያን አራት ሆነዋል፡፡"}, {"heading": "1. የማቴዎስ ወንጌል", "content": "ማቴዎስ የአምላክ ስጦታ ማለት ሲሆን አባቱ ዲቁ እናቱ ክሩትስያ ሲባሉ የዲቁ ሌላ ስም ደግሞ እልፍዮስ ነው:: /ማር. 2÷14/\n\nየማቴዎስ የመጀመሪያ ስም ሌዊ ነበር፡፡ ማቴዎስ ያለው ጌታችን ነው::\n\nማቴዎስ ከቀራጭነት የተጠራ ሐዋርያ ሲሆን /ማቴ. 9÷9/ ከበዓለ ጰራቅሊጦስ በኋላ በፍልስጥኤም፣ በሕንድ፣ በኢትዮጵያ ያስተማረ ሐዋርያ ነው:: በመጨረሻም ጥቅምት 12 በሰማዕትነት አርፏል::\n\nማቴዎስ የዳዊት ልጅ፣ የአብርሃም ልጅ የኢየሱስ ክርስቶስ ወንጌል እያለ ምድራዊ ልደቱን ይጽፋልና በገጸ ሰብእ /ሰው/ ይመሰላል፡፡\n\nማቴዎስ ወንጌሉን በዕብራይስጥ /በአረማይክ/ ቋንቋ ለዕብራውያን ጽፎላቸዋል፤ ይህም የነቢያትን ትንቢት ለሚያውቁ ነውና የጻፈው ከአብርሃም ጀምሮ እስከ ጌታችን በቆጠረው የትውልድ ቁጥርና ከሌሎች ወንጌላውያን በላይ አብዝቶ የብሉይን ኪዳን ጥቅሶችን በማቅረቡ ይታወቃል::\n\nበተጨማሪ ታላቁ የቤተክርስቲያን አባት ጎርጎርዮስ ዘእንዚናዙ \"ማቴዎስ ለዕብራውያን ተአምራተ ኢየሱስን ጻፈ\" ሲል አረጋግጦልናል::\n\nበ28 ምዕራፎች የከፈለው ወንጌሉ:- ከምዕራፍ 1-2 ከልደት - ስደት እስከተመለሱበት፤\n\nከምዕራፍ 3÷4-11 ጥምቀትና ጾም ከምዕራፍ 26-28 ከጸሎተ ሐሙስ ማታ እስከ እሑድ ትንሣኤ ያለውን ይገልጻል::"}, {"heading": "2. የማርቆስ ወንጌል", "content": "ቅዱስ ማርቆስ አባቱ አርስጦቡሎስ፤ እናቱ ማርያም ትባላለች:: ማርቆስ የቀድሞ ስሙ ዮሐንስ እንደነበር ማርቆስ የተባለ ዮሐንስ ሲል የሐዋርያት ሥራ 12÷12፣ 12÷25፣ 15÷37 ይገልጽልናል፡፡\n\nማርቆስ የቅዱስ ጴጥሮስ ረድዕ ሲሆን፣ ከጌታችን በልጅነት እድሜው ተምሯል፡፡ በተጨማሪም ከቅዱስ ጳውሎስ ጋር ሐዋርያዊ ተልዕኮን ፈጽሟል፡፡\n\nማርቆስ በሮም ከቅዱስ ጴጥሮስ ጋር የተማረ ሲሆን ወደ ሰሜን አፍሪካ እስክንድርያና ወደተወለደበት ሀገር ሲረናይካ እና አካባቢው አስተምሮአል፡፡\n\nበዚሁ አገልግሎት ላይ እንዳለም ሚያዝያ 30 በሰማዕትነት አርፎአል፡፡\n\nቅዱስ ማርቆስ ወንጌሉን ለሮማውያን በሮማይስጥ ቋንቋ ራሱ የሚያውቀውን ከቅዱስ ጴጥሮስም እየተረዳ በመንፈስ ቅዱስ መሪነት ጽፎታል፡፡\n\nያለ እኛ ማን አለ? ብለው በሥጋዊ ኃይላቸው ስለሚመኩ ከእነርሱ በላይ ኃያል መኖሩን ለመግለጥ የጌታችንን ኃይል በደዌያት /በሽታ/፣ በአጋንንት፣ እና የማስተማር ሥልጣን ደጋግሞ ገልጧል:: /1÷27፣ 1÷34፣ 1÷22/ ዋና ዓላማው /መልእክቱ/ የኢየሱስ ክርስቶስን የእግዚአብሔር ልጅነት መግለጥ ስለሆነ ሲጀምር /1÷1/ ሲያጠናቅቅ /15÷39/ በወንጌሉ ውስጥ /1÷11፣ 9÷7፣ 14÷61፣ 3÷11፣ 5÷7/ አስረግጦልናል፤ ይህን ያመኑትን ሮማውያንን ጠቅሷል::\n\nማርቆስ ዘአንበሳ ወይም በገጸ አንበሳ ይመሰላል፡፡ ምክንያቱም፦\n\nአንበሳ ኑሮው በበረሃ ነው:: በዚያ ሆኖ ሲጮህ ድምጹ በሩቅ ይሰማል፡፡ ማርቆስም ወንጌሉን ሲጽፍ በበረሃ የሚጮህ ሰው ድምፅ የተባለ የመጥምቁ ዮሐንስን ትምህርትና ሥራ በማስቀደም ስለሚጀምር፤ /ማር. 1÷1-8/\n\nበአንበሳ ድምፅ አራዊት ሲሸበሩ የቤት እንስሳት እንደሚገሠጹ /ወደ ማደሪያቸው እንደሚሰበሰቡ/ በማርቆስ ስብከት ኢ-አማንያን ተሸብረዋል፤ አማንያን ወደ ሃይማኖት ተመልሰዋል::\n\nአንበሳ ለላህም ጌታው ነው ይሰብረዋል:: ቅዱስ ማርቆስ አምልኮተ ላሕምን በሙሴና በኤርምያስ ትምህርትና ተዓምራት እንኳ ባልተወች ግብጽ የእግዚአብሔር ልጅ የኢየሱስ ክርስቶስን ወንጌል ብሎ በመስበክ አምልኮተ ጣኦትን ከግብጽ አጥፍቷልና ዘአንበሳ ተብሏል:: /ማር. 1÷1/\n\nአከፋፈሉ:- 16ቱን የማርቆስ ወንጌል ምዕራፋት በ6 ዐበይት ክፍሎች እንከፍላቸዋለን፡፡\n\nለወንጌሉ የሰጠው ርዕስ /1÷1/\n\nጌታችን ከመዋዕለ ስብከቱ በፊት ያደረጋቸው /1÷2-13/\n\nጌታችን በገሊላና አካባቢው ያስተማረው ትምህርትና ገቢረ ተአምራቱ /1÷14 - 9÷50/\n\nወደ ይሁዳ ገብቶ ያስተማረው ትምህርትና የሠራው ሥራ /10÷1 - 14÷42/\n\nከሐሙስ ማታ እስከ ዓርብ ሰርክ ድረስ የነበረው የስቅለት ታሪክ /14÷43 - 15÷47/\n\nትንሣኤና ዕርገት /16÷1-20/"}, {"heading": "3. የሉቃስ ወንጌል", "content": "ሉቃስ ከአሕዛብ ወገን የሆነ ወንጌላዊ ሲሆን፣ የሕክምና ባለሙያና ሠዓሊም የነበረ ነው፡፡ /ቆላ. 4÷14/ ከ72 አርድእት አንዱ የሆነው ሉቃስ ከሐዋርያው ዮሐንስ ጋር ወደ ግሪክ ሄዶ በመቄዶንያ አስተምሯል:: ከቅዱስ ጳውሎስ ጋር ሐዋርያዊ ጉዞዎችን በሚያደርግበት ጊዜ ያስተማረና መልእክት በማድረስ ይረዳው ነበር።\n\nቅዱስ ጳውሎስ በሰማዕትነት ካረፈ በኋላም በተለያዩ ቦታዎች እየሰበከ ከቆየ በኋላ በ84 ዓመቱ በሰማዕትነት ጥቅምት 22 ቀን ዐረፈ፡፡\n\nቅዱስ ሉቃስ በድንግልናዊ ሕይወት የኖረ አባት ነው፡፡\n\nሉቃስ የክርስቶስ ምሳሌ የሆነውን \"የሰባን ፍሪዳ /ላም/ አምጥታችሁ እረዱት\" /ሉቃስ 15÷23/ ብሎ ስለጻፈና የጌታን በከብቶች በረት መወለድ ስለገለጸ \"ዘላሕም\" ይባላል፡፡ ወይም ከአራቱ እንስሳት በገጸ ላሕም ይመሰላል፡፡\n\nሉቃስ በ60 ዓ.ም. ገደማ በግሪኩ \"ዮናኒ\" ቋንቋ ቴዎፍሎስ ለተባለው ባለሥልጣን ወንጌሉን ጽፎለታል፡፡ /ሉቃስ 1÷1-4/\n\nየወንጌሉ ዓላማ በምዕራፍ 1÷1 \"ስለተማርኸው ነገር እርግጡን እንድታውቅ በጥንቃቄ ሁሉን ከመጀመሪያው ተከትዬ ልጽፍልህ መልካም ሆኖ ታየኝ::\" እንዳለው ቴዎፍሎስ በቃል የተማረውን በጽሑፍ ማስረጋገጥ ነው፡፡\n\nበዚህ ወንጌል 20 የጌታችን ታሪኮች በሌሎች ወንጌላት ያልተጠቀሱ ሲገኙ፤ ብዙ ተአምራት ተጽፈዋል፡፡ ከእነዚህም የ19ኙ ሙሉ ታሪካቸው ሲጻፍ አራቱ በወንጌለ ሉቃስ ብቻ የሚገኙ ናቸው፡፡ እነርሱም /7÷11-17፣ 13÷10-17፣ 14÷1-6፣ 17÷11-19/ የተጠቀሱት ናቸው::\n\nጌታችን ኢየሱስ ክርስቶስ አምስት በቁጥር በቀጥታ ያስተማራቸው ሰባት በጥያቄ መነሻነት ያስተማራቸው በዚህ ወንጌል ብቻ የሚገኙ 12 ትምህርቶችን አካቷል:: /5÷16-30፣ 14÷1-24፣ 14÷25-35፣ 16÷1-31፣ 18÷1-14፣ 10÷25-37፣ 11÷1-13፣ 12÷13-59፣ 13÷1-9፣ 15÷1-32፣ 17÷5-11፣ 17÷20-21/\n\nሃያ አራት ምዕራፎች ያሉትን የሉቃስ ወንጌል ከፋፍለን ስናጠናው፦\n\nከምዕ. 1÷1-4 ወንጌሉን ለማን ለምንና እንዴት እንደጻፈው፤\n\nከምዕ. 1÷4 - 2÷52 የጌታችን ከፅንሰት ጀምሮ የሕፃንነት ዕድሜ ታሪክ፤\n\nከምዕ. 3÷1 - 4÷13 ጥምቀትና ጾም፤\n\nከምዕ. 4÷14 - 9÷50 ጌታችን በገሊላና በዙሪያዋ ባሉ ከተሞች ያስተማረው ትምህርትና ተአምራቱ፤\n\nከምዕ. 9÷51 - 19÷27 ከገሊላ ወደ ኢየሩሳሌም በመጓዝ ላይ ሳለ ጌታችን የሠራውና ያስተማረው፤\n\nከምዕ. 19÷28 - 22÷46 ጌታ በኢየሩሳሌም በመጨረሻው ሳምንት ያደረገው፤\n\nከምዕ. 22÷47 - 23÷56 ጌታ ከተያዘበት ሐሙስ ማታ ጀምሮ በዓርብ ሰርክ በአዲስ መቃብር እስከተቀበረበት፤\n\nከምዕ. 24÷1-53 ትንሣኤና ዕርገት፡፡\n\nበተጨማሪም የሉቃስ ወንጌል ለአሕዛብ ስለጻፈው \"ወንጌለ አሕዛብ\"፣ ስለመንፈስ ቅዱስ ፀጋ ደጋግሞ ስለገለጠ /1÷35፣ 12÷12፣ 4÷1፣ 11÷13/ \"ሰባኪ መንፈስ ቅዱስ\"፣ ስለ እመቤታችንና ስለሌሎቹ ቅዱሳት አንስት /1÷5-56፣ 7÷37-50/ ስለጻፈው \"ወንጌለ አንስት\" በመባል ይጠራል::"}, {"heading": "4. የዮሐንስ ወንጌል", "content": "የዘብዴዎስ ልጅ ዮሐንስ ከወንድሙ ከያዕቆብ ጋር የነጎድጓድ ልጆች በአረማይክ \"ቦአኔርጌስ\" ማር. 3÷17 ሲባሉ፤ ጌታ ይወደው የነበረ /13÷23/፣ ነባቤ መለኮት /ታኦሎጎስ/፣ አቡቀለምሲስ /ባለራእይ/፣ ቁጹረ ገጽ /ፊቱ በሐዘን የተቋጠረ/ በመባል ይጠራል፡፡ ዮሐንስ ከዓሣ አጥማጅነት የተጠራ ሲሆን /ማቴ. 4÷21/ እስከ መስቀል አምላኩን ተከትሎ እመቤታችንን በአደራ የተረከበ /ዮሐ. 19÷26-27/ ከበዓለ ጰራቅሊጦስ በኋላ ከቅዱስ ጴጥሮስ ጋር በኢየሩሳሌምና አካባቢዋ እና በአንጾኪያ፣ ከዚህም ሌላ በሎዶቂያ በእስያ ከተሞች በተለይም በኤፌሶን አስተምሯል፡፡ በኤፌሶን በሚያስተምርበት ጊዜ ንጉሥ ድምጥያኖስ ለራሱ ምስል እንዲሰግድ ባዘዘበት ወቅት ዮሐንስ ይህን ተቃውሞ በፍጥሞ ተሰዷል:: ሐዋርያው ዮሐንስ ከሌሎች ሐዋርያት ይልቅ ረዥም እድሜ በሕይወተ ሥጋ እስከ 96 ዓ.ም. ለ99 ዓመታት የቆየ፤ አስቀድሞ ጌታችን ቃል ኪዳን በገባለት መሠረትም /21÷22/ የተሠወረ አባት ነው፡፡\n\nወንጌላዊው ዮሐንስ በገጸ ንሥር ይመሰላል፡፡ ምክንያቱም:-\n\nንሥር በእግሩ ይሽከረከራል፤ በክንፉ መጥቆ ይበራል:: ዮሐንስ ጌታችን በምድር የሠራውን ይጽፋል፤ ከሕልውናው ተገልጾለትም በመጀመሪያ ቃል ነበር /ዮሐ. 1÷1/ ብሎ ይጽፋልና፡፡\n\nየንሥር አይኑ ፅሩይ /የጠራ/ ነው:: ሽቅብ ወጥቶ በሮ ቅንጣት ታህል ሥጋ ብትሆንም አትሠወረውም አንስቶ ይመገባል:: እርሱም ምሥጢር ተገልጦለት ንጽሐ ሥጋን ንጽሐ ነፍስንና ንጽሐ ልቡና ተሰጥቶት ምሥጢረ መለኮትን ተናግሮአልና ነው::\n\nከአራቱ ወንጌላውያት መጨረሻ ለኤፌሶን ክርስቲያኖች በግሪክ ወንጌሉን የጻፈው ዮሐንስ ምሥጢረ መለኮትን አልቆ ሊያስረዳ በተመስጦ እያለ መልአከ እግዚአብሔር ከባሕሩ በእንቁላል ቅርፊት ውኃውን እየቀዳ ወደ ደረቁ ምድር ሲገለብጥ ተመልክቶ እንዴት ይህን ባሕር በእንቁላል ቅርፊት ቀድተህ ለመጨረስ ትነሣለህ? ብሎ ሲጠይቀው፤ መልአኩ እኔስ ፍጡርን ነው አንተ ተመራምሮ የማይደረስበትን ባሕርየ መለኮትን እመረምራለሁ ብለህ ትለፋ የለምን አለው:: ያን ጊዜ ዮሐንስ የሥላሴን ምሥጢር ጠልቆ መመርመሩን አቁሞ ከእግዚአብሔር የተላከ ዮሐንስ የሚባል አንድ ሰው ነበረ ... ብሎ ሌላ ታሪክ ጀመረ:: /ዮሐ. 1÷1-6/ በመጨረሻም ኢየሱስም በዚህ መጽሐፍ ያልተፃፈ ሌላ ብዙ ምልክት በደቀመዛሙርቱ ፊት አደረገ:: ነገር ግን ኢየሱስ ክርስቶስ የእግዚአብሔር ልጅ እንደሆነ ታምኑ ዘንድ አምናችሁም በስሙ ሕይወት ይሆንላችሁ ዘንድ ይህ ተጽፏል:: ኢየሱስም ያደረገው ብዙ ሌላ ነገር ደግሞ አለ፤ ሁሉ በእያንዳንዱ ቢጻፍ ለተጻፉት መጻሕፍት ዓለም ራሱ ባልበቃቸው ይመስለኛል:: ዮሐ. 20÷30-31፣ 21÷25 ሲል አጠናቋል::\n\nከዚህ እንደምንረዳው፣ የዮሐንስ ወንጌል የተጻፈባቸው ዓላማዎች-\n\nቅድመ ዓለም የነበረው እና ሥጋን የተዋሐደው /ትንቢት የተነገረለትና ሱባዔ የተቆጠረለት መሲህ የእግዚአብሔር ልጅ እርሱ መሆኑን/ በመግለጥና ማሳመን ነው፡፡ እርሱ ክርስቶስ የእግዚአብሔር ልጅ እንደሆነ ታምኑ ዘንድ ... ይህ ተጽፏል::\n\nየዘለዓለም ሕይወት የሚገኝበትን መንገድ ለማስተማር ነው:: ይህንን በተለያየ ትምህርት ገልጾታል:: /3÷15፣ 5÷24-34፣ 6÷40-54፣ 10÷28፣ 11÷27፣ 12÷25፣ 17÷3/ ... አምናችሁ በስሙ ሕይወት ይሆንላችሁ ዘንድ ይህ ተጽፏል እንዲል፡፡\n\nእግዚአብሔር አምላክ በሰባተኛው ቀን ከሥራው ሁሉ ስለ ዐረፈ ሰባት በዕብራውያን ፍጹም ቁጥር ነው:: በዮሐንስ ወንጌልም በሰባት የተቀመሩ ነገሮች አሉ፡፡\n\nሰባቱ \"እኔ ነኝ\"\n\nየሕይወት እንጀራ እኔ ነኝ /ዮሐ. 6÷35/\n\nየዓለም ብርሃን እኔ ነኝ /8÷12/\n\nየበጎች በር እኔ ነኝ /10÷7/\n\nመልካም እረኛ እኔ ነኝ /10÷11/\n\nትንሣኤና ሕይወት እኔ ነኝ /11÷25/\n\nመንገድም፣ እውነትና ሕይወት እኔ ነኝ /14÷6/\n\nእውነተኛ የወይን ግንድ እኔ ነኝ /15÷1/\n\nየእግዚአብሔር ልጅነቱን የሚመሰክሩ ሰባት ሰዎች:-\n\nመጥምቁ ዮሐንስ /ዮሐ. 1÷29-36/\n\nእንድርያስ /ዮሐ. 1÷41-42/\n\nፊልጶስ /ዮሐ. 1÷46/\n\nናትናኤል /ዮሐ. 1÷50/\n\nማርታ /ዮሐ. 11÷27/\n\nጴጥሮስ /ዮሐ. 6÷68-69/\n\nቶማስ /ዮሐ. 20÷28/\n\nከመሞቱ በፊት ያደረገው ሰባቱ ተአምራት:-\n\nየቃናው ሠርግ ተአምር /ዮሐ. 2÷1-11/\n\nየመኮንኑን ልጅ ማዳኑ /ዮሐ. 4÷46-54/\n\nመጻጉዕን ማዳኑን /ዮሐ. 5÷1-47/\n\nአምስት ሺህ ሕዝብ መመገቡ /ዮሐ. 6÷1-14/\n\nበባህር ላይ መሄዱ /ዮሐ. 6÷15-25/\n\nዕውር ሆኖ የተወለደውን ማዳኑን /ዮሐ. 9÷1-41/\n\nአልዓዛርን ከሞት ማስነሳቱ /ዮሐ. 11÷1-44/\n\nየዮሐንስ ወንጌል ስለ ኢየሱስ ክርስቶስ ታሪክ፣ ትምህርትና ተአምራት የያዘው ቃል ከሌሎች ወንጌላት የተለየ ነው:: ምክንያቱም ከላይ እንደተገለጸው የጻፈው ከሌሎች ወንጌላት በመጨረሻ ነውና ወንድሞቹ ያልገለጹትን የሌሎችን ካየ በኋላ ገልጾአል/ጽፏል፡፡\n\nአከፋፈሉ:- በዮሐንስ ወንጌል የተጠቀሱ አራት የፋሲካ በዓላት አሉ /ዮሐ. 2÷13፣ 5÷1፣ 6÷4፣ 12÷1/ ፋሲካ በዓመት አንዴ ሚያዚያ 14 ቀን የሚከበር እሥራኤል ከሞተ በኩር መዳናቸውን የሚያስቡበት በዓል ነው:: ጌታችን በመዋዕለ ስብከቱ ሦስቱን ሲያከብር በአራተኛው ፋሲካ ግን ተሰቅሎአል:: በዚህ መሠረትነት 21 የዮሐንስ ወንጌል ምዕራፎችን በ7 እንከፍላለን፡፡ እነርሱም:-\n\nየጌታ ቅድመ ዓለም ሕልውናና በሥጋ መገለጡ ይህ መግቢያ ነው:: /ዮሐ. 1÷1-18/\n\nከመጀመሪያው ዓመት ጥቂት ቀደም ብሎ በሦስቱ ወራት ውስጥ የተደረጉ ነገሮች /ዮሐ. 1÷19 - 2÷12/\n\nበመጀመሪያው የማስተማር ዓመቱ ያደረጋቸው /ከምዕ. 2÷13 - 4÷54/\n\nበሁለተኛው የማስተማር ዓመቱ ያደረጋቸው /ከምዕ. 5÷1 - 6÷71/\n\nበሦስተኛው የማስተማር ዓመቱ ያደረጋቸው /ከምዕ. 7÷1 - 12÷11/\n\nበመጨረሻው ሳምንቱ የተደረጉ /ከምዕ. 12÷12 - 21÷14/\n\nየመደምደሚያ ትምህርቶች /21÷15 : በነብያትና በሐዋርያት መሠረትነት ላይ ተሠርታችኋልና፡፡ የማዕዘኑም ራስ ክርስቶስ ነው:: በማዕዘኑም ደንጊያ ላይ ሥራው ሁሉ ጸንቶበት ይኖራል ይላቸዋል:: ኤፌ. 2÷1-22::\n\n6. ወደ ፊልጵስዮስ ሰዎች የተላከ ሰላምታ ከሰጣቸው በኋላ ወንድሞች ሆይ የክርስቶስ ሕግ ወንጌልን ለማስተማር ዝናዬና ስለ ክርስቶስም የታሠርሁት እሥራቴ ፈጽሞ በሰው ሁሉ ዘንድ እንደተሰማ እንድታውቁ እወዳለሁ፡፡ ቅዱስ ጳውሎስ ታሥሮ ሳለ ከሰዎች ወገን እኵሌቶቹ መምህር እርሱ ብቻውን ይቆጨው ይንደደው እኛም እናስተምራለን እያሉ በምቀኝነት የክርስቶስን ነገር የሚያስተምሩ ነበሩ፡፡ እኩሌቶች ደግሞ ቅዱስ ጳውሎስ ስለታሠረ ትምህርቱ እንዳይቀር እያሉ በእውነትና በፍቅር የክርስቶስን ትምህርት የሚያስተምሩ ነበሩ፡፡ በዚህም ነገር ጳውሎስ አላዘነም፡፡ ለዚህም ሲጽፍላቸው በምቀኝነትም ሆነ በፍቅር ሁሉም እንጂ አላዝንም ብሎአቸዋል። ፊል. 2÷1-12፡፡ አይሁድ እርሱን የሚያሳዝን ሥራ ከመሥራት አያርፉምና ከውሾች ተጠበቁ በማለት ጽፎላቸዋል:: እውነተኞች ግዙራንስ እግዚአብሔርን በመንፈስ የምናመልከው እኛ ነን በሥጋ ግዝረት አንመካምና፡፡ መመካትም ቢያስፈልግ ፈሪሳዊ ክብር እኔ እበልጣቸዋለሁ ብሏቸዋል:: ፊል. 3÷2-7።\n\n7. ወደ ቆላስዮስ ሰዎች የተላከ መልዕክት ቆላስዮስ ዛሬ ቱርክ በሚባል ሀገር ትገኛለች:: ቅዱስ ጳውሎስ ይህንን መልእክት የጻፈው በሁለት ምክንያት ነው፡፡ 1ኛ. የቆላስዮስ ተወላጅ አናሲሞስ ወደ ሀገሩ ስለሚመለስ ለቤተ ክርስቲያን መጻፉ፡፡ 2ኛ. በቤተ ክርስቲያን ውስጥ የሐሰት ትምህርት ስለነበረ ሐዋርያው የማስጠንቀቂያ መልእክት ሊጽፍላቸው ችሏል:: በ62 ዓ.ም. ገደማ ተጽፏል::\n\nአከፋፈሉ፡-\n\nየሐዋርያው ምስጋና ጸሎት እንዲሁም ክርስቶስ የሁሉ ጌታና ፍጹም መድኅን ስለመሆኑ፤ ምዕ. 1\n\nከሐሰት ትምህርት እንዲጠበቁ፤ ምዕ. 2\n\nስለክርስቲያናዊ ኑሮ፤ ምዕ. 3\n\nአብረውት ስለሚሠሩ ሰዎች ሰላምታ፤ ምዕ. 4÷7፣ 8÷18\n\n8. አንደኛው ወደ ተሰሎንቄ ሰዎች የተላከ መልእክት በግሪክ አውራጃ ዋና ከተማ ነበረች:: ሐዋርያው መልዕክቱን የጻፈው በ51 ዓ.ም. ገደማ ነው:: ቅዱስ ጳውሎስ በዚህች አገር አስተምሯል፡፡ ሆኖም መሠረታዊ ትምህርትን ሊያስተምራቸው ስለፈለገ ሁለቱንም ጻፈላቸው:: የመጀመሪያው መልእክት አከፋፈል፡-\n\nየሐዋርያው ምስጋና፤ ምዕ. 1\n\nየሐዋርያው ገድል በተሰሎንቄ ቤተክርስቲያን፤ ምዕ. 2÷1-16\n\nስለ ተሰሎንቄ ቤተክርስቲያን የሐዋርያው ስጋት፣ ምዕ. 2÷17 - ምዕ. 3÷13\n\nስለ ምእመናን ቅድስናና ፍቅር፤ ምዕ. 1÷12\n\nስለ ጌታ ዳግም ምጽአት፤ ምዕ. 1÷12\n\nስለ ምእመናን በኅብረት መኖር፤ ምዕ. 5÷12-28\n\n9. ሁለተኛው የተሰሎንቄ ሰዎች የተላከ መልእክት አከፋፈሉ፡-\n\nክርስቲያንና መከራው፤ ምዕ. 1\n\nክርስቲያንና ዳግም ምጽአት፤ ምዕ. 2\n\nክርስቲያንና ዕለታዊ ተግባሩ፤ ምዕ. 3\n\n10. 1ኛ ወደ ጢሞቴዎስ የተላከ መልእክት ጢሞቲዎስ ሐዋርያው ጳውሎስ በልስጥራን ያገኘው ወጣት ነው፡፡ ይህም ልጅ የቅዱስ ጳውሎስ የመንፈስ ልጁ ነበር፡፡ በሄደበት ሁሉ ይሄድ ነበር፡፡ 2ኛቆሮ. 1÷1፣ ፊልጵ. 1÷1-2፣ ተሰሎ. 1÷1። ሐዋርያው ለጢሞቲዎስ ሁለት መልእክት ጽፎለታል፡፡ ጢሞቲዎስን ለማበረታታት ጽፎለታል፡፡ 1ኛጢሞ. 1÷3-7 ዘመኑ በ63 ዓ.ም. ገደማ ነበር።\n\nአከፋፈሉ:-\n\nስለ ጳውሎስና ስለ ጢሞቲዎስ፣ ምዕ. 1\n\nስለ ቤተክርስቲያን አገልግሎት ሥርዓትና አስተዳደር፣ ምዕ. 2-6\n\nልዩ ልዩ ትዕዛዝና ምክር፣ ምዕ. 6\n\n11. 2ኛ ለጢሞቴዎስ የተላከ መልእክት ይህች " የሚለው ቃል ሦስት ትርጉም አለው።\n\n\"ቤተክርስቲያን\" የግዕዝ ቃል ሲሆን በአማርኛም እንጠቀምበታለን። ፍቺውም ህፃኑ፣ ሽማግሌው፣ ወንዱ፣ ሴቱ፣ የተማረው፣ ያልተማረው አንድ ላይ ተሰባስቦ ጸሎት የሚያደርስበትን የጌታችን ቅዱስ ሥጋና ክቡር ደም የሚፈተትበት ቅዱስ ቦታ /ሕንፃ ቤተክርስቲያንን/ ያመለክታል። የሐዋ. ሥራ 20÷28፣ 1ኛ ጢሞ. 3÷15፣ 1ኛ ነገ. 9÷3።\n\nጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ የባሕርይ አምላክ የዓለም መድኃኒት መሆኑን የሚያምኑ ሰዎች ሁሉ ቤተክርስቲያን ይባላሉ። የያዕቆብ /የእስራኤል/ ወገን የሆኑ በሙሉ ቤተእስራኤል እንደሚባሉ በክርስትና የክርስቶስ የሆኑ የክርስቲያን ወገኖችም ቤተክርስቶስ፣ ቤተክርስቲያን ይባላሉ። የሐዋ. ሥራ 5÷11፣ የሐዋ. ሥራ 12÷1፣ 1ኛ ቆሮ. 3÷16፣ 2ኛ ቆሮ. 6÷16፣ ዮሐ. 14÷23፣ የሐዋ. ሥራ 9÷3።\n\nየክርስቲያኖች ማኅበር፣ የክርስቲያኖች ጉባዔ፣ የክርስቲያኖች ስብሰባ /አንድነት/ ቤተክርስቲያን ይባላል። «የኢትዮጵያ ኦርቶዶክስ ተዋህዶ ቤተክርስቲያን» እንዲል። ሮሜ. 16÷1፣ 1ኛ ጴጥ. 5÷13።\n\nጥያቄ፦\n\nቤተክርስቲያን ምንድናት?\n\nቤተክርስቲያን ለምን እንመጣለን?\n\nሠ. የቤተክርስቲያን ዕድሜ፦ አንዳንድ የቤተክርስቲያን ሊቃውንት ቤተክርስቲያን የሚለውን ቃል በምሥጢራዊ አፈታት ሲፈቱ፣ ቤተክርስቲያን ማለት እግዚአብሔር ከሰውና ከመላእክት ጋር ያለው ግንኙነት ነው ይላሉ። በዚህም መሠረት የቤተክርስቲያንን ዕድሜ በሦስት ይከፍሉታል።\n\nሰው ከመፈጠሩ በፊት በዓለመ መላእክት የነበረች የቅዱሳን መላእክት አንድነት\n\nበዘመነ ብሉይ የነበሩ ደጋግ አባቶች ከእግዚአብሔር ጋር የነበራቸው ግንኙነት\n\nበጌታችን በመድኃኒታችን በኢየሱስ ክርስቶስ ደም የተመሠረተችውና በመንፈስ ቅዱስ የምትመራው አማናዊት ቤተክርስቲያን /የምዕመናን አንድነት/ እሷም የፀጋና የጽድቅ ምንጭ ናት። ኤፌ. 3÷9-11።\n\nእነዚህንም የቤተክርስቲያን ዕድሜዎች በዝርዝር ስንመለከታቸው፦"}, {"heading": "1. ዓለመ መላእክት እና 2. በብሉይ ዘመን የነበሩ ደጋግ አባቶች", "content": "እግዚአብሔር መላእክትን በከተማ አስር፣ በነገድ መቶ አድርጎ ከፈጠራቸው በኋላ ተሰወረባቸው። እነርሱም \"ፈጣሪያችን ማን ይሆን?\" እያሉ ይጠይቁ ጀመር። በዚህ ጊዜ በክብር ላቅ ብሎ ይገኝ የነበረው ሣጥናኤል \"እኔ ነኝ የፈጠርኳችሁ\" በማለቱ ክርክር ተነስቶ መላእክት ለሁለት ተከፈሉ። በመጨረሻም እግዚአብሔር አምላክ ተገልጦላቸው አቡሃ ለሐሰት ሣጥናኤልንና ሠራዊቱን ወደ ዘለዓለም ፍርድ፣ ባሉበት የጸኑትን ቅዱሳን መላእክትን ደግሞ የዘለዓለም ሕይወትና ክብር ሰጣቸው። በዚህም መላእክት ከእግዚአብሔር አምላክ ጋር ግንኙነት ጀመሩ። ራዕ. 12÷7-8፣ ኢሳ. 14÷15።\n\n2. በብሉይ ዘመን የነበሩ ደጋግ አባቶች\n\nበ4 ይከፈላሉ። እነሱም የተነሱባቸው ዘመናት፦\n\nዘመነ አበው\n\nዘመነ መሳፍንት\n\nዘመነ ነገሥት\n\nዘመነ ነቢያት /ካህናት/ ናቸው።\n\nክፍል አንድ\n\nየቤተክርስቲያን ታሪክ ከአዳም እስከ ክርስቶስ ዕርገት በ5500 ቅድመ ልደተ ክርስቶስ 34 ዓመተ ምህረት፤ /ከፍጥረተ ዓለም እስከ ጰራቅሊጦስ/"}]}, {"chapter_id": "ybt_ch2", "title": "ክፍል አንድ - ምዕራፍ አንድ፡ ዘመነ አበው", "page_start": 2, "sections": [{"heading": "ክፍል አንድ - ምዕራፍ አንድ፡ ዘመነ አበው", "content": "ከአዳም እስከ ኖኅ ያለው 2,256 ዓ.ዓ. ሲሆን ከኖኅ እስከ ሙሴ ያለው 1,600 ዓመት ከአዳም እስከ ሙሴ ያለው 3,85 "heading": "ሐ. ሄኖክ", "content": "የያሬድ ልጅ ነው። ዘፍ. 5÷18።\n\nከአዳም ጀምሮ 7ኛ ትውልድ ነበረ። ይሁዳ 1÷14።\n\nበእምነቱ እግዚአብሔርን ደስ እንዳሰኘው ተመስክሮለታል። ዕብ. 11÷5።\n\nአካሄዱን ከእግዚአብሔር ጋር ስላደረገ በሥጋ ሞትን ሳያይ ከዚህ ዓለም ተለየ። ዘፍ. 5÷24።\n\nስለዚህም በአቤል ሞት እንዲታወቅ በሄኖክም ሕይወት /ዘለዓለማዊነት/ የተረዳ ሆነ።\n\nሰባት ዓመት በእግረ ገነት በብሕትውና ነበረ። አንድ መጽሐፍ የጻፈ ሲሆን ስለጌታችን መገለጥና ስለ ኖኅ ዘመን ጥፋት ተንብይዋል።"}, {"heading": "መ. ኖኅ", "content": "የአዳም ልጅ የሴት ትውልድ ነው። ዘፍ. 5÷28።\n\nክፉ ሕዝብ በነበረበት በዚያ ዘመን ኖኅ ብቻ አካሄዱን ከእግዚአብሔር ጋር አደረገ። ዘፍ. 6÷9።\n\n500 ዘመን ከሆነው በኋላ ሴምን፣ ካምን፣ ያፌትን ወለደ። ዘፍ. 5÷32።\n\nእግዚአብሔር የጥፋትን ውኃ በምድር ላይ እንደሚያመጣ አስጠነቀቀው። ኖኅና ቤተሰቦቹ እንዲሁም ሕያው ነፍስ ካላቸው ተባእትና እንስት ፍጥረታት /ከሚበሉት ሰባት ሰባት ከማይበሉት ሁለት ሁለት/ የሚድኑበትን መርከብ እንዲያዘጋጅ ታዘዘ። ዘፍ. 6÷13-22።\n\n600 ዓመት በሆነው ጊዜ የውኃ ጥፋት መጣ። ከርሱ ጋር ወደ መርከቡ ከገቡት በቀር የዳነ አልነበረም። ዘፍ. 7÷1።\n\nእግዚአብሔር ስለ ኖኅ የጥፋትን ውኃ ከምድር አደረቀ። ኖኅም ወጥቶ መሥዋዕትን ሠዋ። እግዚአብሔርም ምድርን ዳግመኛ በጥፋት ውኃ እንዳያጠፋ ከኖኅና ከሕያው ፍጥረት ሁሉ ጋር ቃል ኪዳን ገባ። ምልክቱም ቀስተ ደመና ነበረ። ዘፍ. 8፣ ዘፍ. 9÷8-12። ልጆቹንም ብዙ ተባዙ ብሎ ባረካቸው።\n\nኖኅ ወይን ተከለ፣ ከወይን ጠጁም ጠጥቶ ሰከረ። ካምም ያባቱን ነውር ገለጠ። በዚህም ልጁ ከነዓን ተረገመበት ይህን ያላደረጉት ሴምና ያፌት ተባረኩ። ዘፍ. 9÷20-27።\n\nልጆቹም ምድርን ሲከፋፈሉ የካም ልጅ ኩሽ /ኢትዮጲስ/ እንዲሁም ልጆቹ ሳባና አቢስ ዕጣ የደረሳቸው ቦታ የኢትዮጵያ ምድር ነበረች።\n\n950 ዓመት ሲሆነው ሞተ። ዘፍ. 9÷29።\n\nኖኅ የሠራት መርከብ ፍጥረታትን ከጥፋት ማዳኗ ለቤተክርስቲያንና ለእመቤታችን ምሳሌ ናት።\n\nጥያቄ፦\n\nለሰው ልጅ መትቶ መግደል ያስተማረ ማን ነው?\n\nበኖኅ የሳቀበት ካም ሆኖ ሳለ የረገመው ከነዓንን ነው ለምን?\n\nከኖኅ ምን እንማራለን?\n\n«የእግዚአብሔር ልጆችም የሰውን ሴቶች ልጆች መልካሞች እንደሆኑ አዩ። ከመረጡአቸውም ሁሉ ሚስቶች ለራሳቸው ወሰዱ» ዘፍ. 6÷2 የእግዚአብሔር ልጆች የተባሉት እነማን ናቸው? የሰው ልጆችስ?\n\nቤተክርስቲያን ከኖኅ መርከብ ትበልጣለች እንዴት?"}, {"heading": "ሠ. አብርሃም", "content": "የታራ ታላቅ ልጅ ነው፣ የቀድሞ ስሙ አብራም ነበር።\n\nአባቱ ታራ ጣኦት አምላኪ ነበር። እግዚአብሔርም አብርሃምን ከሀገሩ እንዲወጣ ከዘመዶቹ ተለይቶ እግዚአብሔር ለእስራኤል ሕዝብ አባቶች የመጀመሪያው ይሆን ዘንድ ከትውልድ ሀገሩ ከዑር እንዲወጣ አነጋገረው። ዘፍ. 12÷1።\n\nበሚስቱ በሣራ ፈቃድ ከግብፃዊት ገረዱ ከአጋር እስማኤልን ወለደ። ዘፍ. 16÷1-4። ቃል ኪዳኑና ምልክት የሆነውን ግዝረት ከሰጠው በኋላ የተስፋ ልጅ ይስሐቅ ከሣራ ተወለደለት። ዘፍ. 17÷21።\n\nበእግዚአብሔርና በአብርሃም መካከል ቃል ኪዳን ተደረገ፤ ምልክቱም ግዝረት ነበር። ዘፍ. 17÷2-4፣ ዘፍ. 12÷8-13።\n\nእግዚአብሔር በመምሬ አድባር ዛፍ ተገልጦለት ልጅ እንደሚወልድ ነገረው። ዘፍ. 18÷1-25 ዘሩም በይስሐቅ ዘር እንደሚጠራለት ተነገረው። ዘፍ. 21÷12-13።\n\ ኦንም «እግዚአብሔር አምላካችሁን አላውቅም፣ እስራኤል ባሮቼንም አልለቅም» በማለቱ የደረሱ አሥሩ መቅሠፍታት፦\n\nየውኃ ወደ ደም መለወጥ /ዘጸ. 7÷20-25/\n\nጓጉንቸር /ዘጸ. 8÷6-15/\n\nቅማል /ዘጸ. 8÷16-19/\n\nየዝንብ መንጋ /ዘጸ. 8÷20-30/\n\nየከብት እልቂት /ዘጸ. 9÷1-7/\n\nሻህኝ የሚያመጣ ቁስል /ዘጸ. 9÷8-12/\n\nነጎድጓድና በረዶ /ዘጸ. 9÷13-35/\n\nየአንበጣ መንጋ /ዘጸ. 10÷1-20/\n\nጨለማ /ዘጸ. 10÷21-29/\n\nየበኩር ልጅ ሞት /ዘጸ. 12÷29-36/\n\nእስራኤል ከግብጽ ወጥተው 40 ዓመት በምድረ በዳ ከተጓዙ በኋላ ወደ ተስፋቸው ሀገር /ምድረ ርስት/ ከመግባታቸው በፊት ሙሴ ሞተ /ዘንኍ. 20÷1-23፣ መዝ. 105÷32-33፣ ዘዳ. 34/። ከግብጽ ከወጡት ከ20 ዓመት በላይ የሆናቸው ከስድስት መቶ ሺህ እስራኤላውያን ውስጥ ከነዓን የገቡት ሁለቱ ኢያሱና ካሌብ ብቻ ነበሩ። ዘዳ. 1÷37።\n\nሙሴ የጌታ ምሳሌ ነው።\n\nየዋሁ ሙሴ በአርአያነት ከሚታወቅባቸው የሕይወት ጉዞ ጥቂቶቹን እንመልከት፦\n\nመፍቀሬ ሢመት አልነበረም።\n\nበኀያልነቱ እጁን ብቻ በመዘርጋቱ ጠላቶቹን ድል ይመቱ ነበር።\n\nበጸሎቱ ተሰሚነት በአማላጅነቱ ብቃት፤\n\nለፈጣሪው በታማኝ አገልጋይነቱ፤\n\nበጽዋሚነት፤\n\nከፈጣሪው እጅ በእጅ የህግ ጽላት በመቀበሉ ይታወቃል።"}, {"heading": "2. ኢያሱ", "content": "ኢያሱ ማለት አዳኝ፣ መድኃኒት ማለት ነው።\n\nከሙሴ ሞት በኋላ እስራኤልን መርቶ ወደ ተስፋይቱ ምድር ከነዓን አስገብቷቸዋል። ምድሪቱንም አከፋፈላቸው። /መጽሐፈ ኢያሱ/\n\nኢያሱ የጌታ ምሳሌ ነው።\n\n110 ዓመት ሲሆነው ሞተ። /ኢያሱ 24÷29-31/"}, {"heading": "3. ጌዲዎን", "content": "እስራኤላውያንን ከምድያማውያን ሊያድን ተጠራ። /መሳ. 6÷11-24/\n\nየበዓልን መሠዊያ ካፈረሰ በኋላ ይሩበዓል ተብሎ ተጠራ። /መሳ. 6÷25-32/\n\n32,000 ሰዎች ሲወጡለት በእግዚአብሔር ትዕዛዝ 300 ሰዎችን አስከትሎ ምድያማውያንን በማባረር አሸነፋቸው። /መሳ. 6÷32፣ 8÷21/\n\nየጌዲዎን ፀምር የእመቤታችን ምሳሌ ነው። /መሳ. 6÷37-40/\n\nሕዝቡ «በእስራኤል ላይ ንገሥ» ቢሉት እምቢ ብሎ 40 ዓመት ፈራጅ ሆነ። /መሳ. 8÷22-23/\n\nእምነቱ በዕብ. 11÷32 ተመስክሮለታል።"}, {"heading": "4. ሶምሶን", "content": "የተወለደው በመልአክ ብሥራት ነው። /መሳ. 13÷2-23/\n\n15 ዓመት ሲሆነው አባቱ ለጉዳይ ወደ ምድረ ኢሎፍሊ ይዞት ሄደ። በመንገድም የአንበሳ ደቦል አግኝቶ እንደ ጠቦት በእጁ ቆራረጠው። ከሄደበት ሲመለስ አንበሳ መደብ ለመቀመጥ፣ አውሬ ለመቀስቀስ፣ የገደለው አንበሳ እንዴት እንደሆነ ለማየት ሲሄድ የአንበሳው ሬሳ ውስጥ ንብ ሠፍሮበት ማርም ተሠርቶበት አገኘ። ከማሩም ቆርጦ በልቶ ለአባቱና ለእናቱም ይዞላቸው ሄደ። «ከበላተኛ ውስጥ መብል ወጣ፣ ከብርቱም ውስጥ ጥፍጥ ወጣ» የተባለው በዚህ ጊዜ ነው። /መሳ. 14÷5-15/\n\nከፍልስጤማዊቷ ደሊላ ጋር በመወዳጀቱ የተሰጠውን ፀጋ አጥቷል። /መሳ. 16÷30/\n\nሶምሶን የጌታ ምሳሌ ነው።\n\nሶምሶን በእስራኤል ላይ 20 ዓመት ፈረደ። /መሳ. 16÷31/"}, {"heading": "ማጠቃለያ (ዘመነ መሳፍንት)", "content": "ዘመነ መሳፍንት ከሕገ ልቡና ዘመን ይልቅ ለአማናዊት ቤተክርስቲያን የቀረበ ነው፡፡ ምክንያቱም:-\n\nሕገ ኦሪት የተሰጠበት በመሆኑ፤\n\nታቦተ ሕግ የተሰጠበት በመሆኑ፣\n\nደብተራ ኦሪት የተሠራችበት በመሆኑ፣ / ፤ መንግሥቱም ይከፈል ዘንድ ምክንያት ሆነ፡፡ በእስራኤል ላይ 40 ዓመት ነግሦ በዳዊት ከተማ አንቀላፋ፣ በዛም ተቀበረ። 1ኛ ነገ. 11÷40-43::"}, {"heading": "ሮብዓም", "content": "ሮብዓምም ንጉሥ በሆነ ጊዜ የአርባ አንድ ዓመት ጎልማሳ ነበር፡፡ ለ17 ዓመታት የይሁዳን መንግሥት አስተዳድሯል:: 1ኛ ነገ. 14÷21\n\nሮብዓም እንደነገሠ አባቱ ሰሎሞን የጫነውን ቀንበር ያቀልላቸው ዘንድ፣ ካቀለለላቸው በኋላ ለእርሱ እንደሚገዙለት እስራኤላውያን ሮብዓምን ቢጠይቁት ከሦስት ቀናት በኋላ እንደሚመልስላቸው ቃል ገብቶ፣ ሽማግሌዎች የመከሩትን ምክር ትቶ ከእርሱ ጋር በፊቱ ይቆሙ ከነበሩት ብላቴኖች ጋር ተማክሮ እንዲያውም ጫናውን እንደሚያከብድባቸው ነገራቸው:: ይህና ሌሎች ምክንያቶች ሆነው እስራኤል (ምድረ ፍልስጥኤም) በ922 ቅድመ ልደተ ክርስቶስ ለሁለት ተከፈለች:: 1ኛ ነገ. 12÷1-18:: በዚህ ጊዜ ሁለቱ ነገድ /ብንያምና ይሁዳ/ አሠፋፈራቸው በደቡብ ፍልስጥኤም ሲሆን ዋና ከተማቸው ኢየሩሳሌም፣ ንጉሣቸውም ሮብዓም ነበር:: መንግሥታቸውም «የይሁዳ መንግሥት» ተባለ:: 1ኛ ነገ. 12÷25:: የተከፋፈለ ሕዝብ ለጠላቶች ጥቃት የተመቸ ነውና በ722 ከክርስቶስ ልደት በፊት ሰሜኑን ክፍል አሦራውያን በስልምናሶር መሪነት ወግተው ማረኩ። 2ኛ ነገ. 17:: በደቡብ የነበሩት እንደ ጠላት ያዩአቸው ስለነበር ደስ ሳይላቸው አልቀረም:: በሰሜን የደረሰው ወረራ ለደቡብም አልቀረለትም:: በ586 ከክርስቶስ ልደት በፊት ባቢሎናውያን በናቡከደነጾር መሪነት መጥተው ኢየሩሳሌምን አጠፉ:: ቤተመቅደስንም አፈረሱ፤ ሕዝቡንም ማርከው ወሰዱ::"}, {"heading": "ማጠቃለያ እና የነገሥታትና ነቢያት ሰንጠረዥ", "content": "በዚህ ዘመን በደብተራ ኦሪት የነበረችው ታቦተ ጽዮን ወደ ቤተ መቅደስ ገባች:: እንዲሁም ዛሬ ላለው የቤተክርስቲያን አሠራር መሠረት የጣለ ዘመን ነበር፡፡ ንጉሡ ዳዊትም በሰሎሞን የተመደቡ ካህናትና መዘምራንን፣ ሰሞነኞችን፣ ለቤተ መቅደስ በመመደብ ዛሬ ለምንጠቀምበት ሥርዓት መሠረቱን አስቀምጧል፡፡ ሌላው ይህን ዘመን ልዩ የሚያደርገው በንጉሥ ሰሎሞን ዘመነ መንግሥት ታቦተ ጽዮን ወደ ኢትዮጵያ መምጣቷ ነው፡፡\n\nእስራኤላውያን ለሁለት ከተከፈሉ በኋላ በይሁዳና በእስራኤል የነገሡ ነገሥታትና በዘመናቸው የነበሩ ነቢያት እንዲሁም በጊዜው የነበሩ ሌሎች መንግሥታት የሚከተሉት ናቸው፡፡\n\nየይሁዳ ነገሥታት | ነቢያት | የእስራኤል ነገሥታት | ሌሎች መንግሥታት\n--- | --- | --- | ---\nሮብአም | አኪያ | ኢዮርብአም 1ኛ | የሶሪያ መንግሥት ወልደ አዴር 1ኛ /በግብጽ ሺሻቅ/\nአቢያም | ኢዶ | ናዳብ | \nአሳ |  | ባኦስ (ቦአስ) | \n |  | ኤላ | \n |  | ዘምሪ (ዘሪም) | \n |  | ታምኒ | \n |  | ዘንበሪ (ዖምሪ) | \nኢዮሳፍጥ | ኤልያስ | አክአብ | ወልደ አዴር 2ኛ\n |  | አካዝያስ | \nኢዮራም | ኤልሳዕ | ኢዮራም | \nአካዝያስ / ጎቶልያ |  |  | \nኢዮአስ | አብድዩ | ኢዩ | \n | ኢዩኤል | ኢዮአካዝ | አዛሄል\nአሜስያስ | ዮናስ | ዮአስ | ወልደ አዴር 3ኛ\nአዛርያስ / ዖዝያን | አሞጽ | ኢዮርብአም 2ኛ | \n | ሆሴዕ | ዘካርያስ | \n | ኢሳይያስ | ሻሎም | \n | ሚክያስ | ምናሔም | ረአሶን\nኢዮአታም |  | ፋቅሕያስ | \nአካዝ |  | ፋቁሔ | የደማስቆ ውድቀት / የአሦር መንግሥት\n |  | ሆሴዕ | ስልምናሶር፣ ሳርጎን\nሕዝቅያስ |  |  | ሰናክሬም / የኢትዮጵያ ቴርሐቅ / አስራዶን\nምናሴ |  |  | \nአሞን ሕት የሆነች የእግዚአብሔርን ቃል በማኅፀኗ ለመሸከም የበቃች በናዝሬት ከተማ የምትኖር አንዲት ድንግል ነበረች:: የዚህችም ድንግል ስሟ ማርያም ነበር፡፡ ሉቃስ 1÷27፡፡ እግዚአብሔር የዓለሙ ድኅነት ፈቃዱ ስለሆነ ለዚህ ዓለም ድኅነት ምክንያት ይህችን ድንግል መረጠ:: ስለዚህም በፊቱ የሚቆመውን ባለሟሉን መልአክ ቅዱስ ገብርኤልን የምሥራች ይናገር ዘንድ ወደ እርሷ ላከ፡፡ መልአኩም ወደዚያች ድንግል በደረሰ ጊዜ «ደስ ይበልሽ ጸጋን የሞላብሽ ሆይ እግዚአብሔር ከአንቺ ጋር ነው አንቺ ከሴቶች መካከል የተባረክሽ ነሽ አላት» ሉቃስ 1÷28:: ቅድስት ማርያም እውነተኛ ስለነበረች በውዳሴ ከንቱ አልተጠለፈችም:: ስለዚህ ወዲያውኑ አልተቀበለችውም ነበርና «ወንድ የማላውቅ ስሆን ይህ እንደምን ይሆናል?» ብላ ጠየቀችው፡፡ መልአኩም የተላከበት ነገር ነውና በብዙ አስረጂ አስረዳትና ማሠሪያውን «ለእግዚአብሔር የሚሳነው ነገር የለም» አላት:: ቅድስት ማርያምም «በእርግጥ ለእግዚአብሔር የሚሳነው ነገር የለምና እነሆ የእግዚአብሔር ገረዱ አለሁኝ እንደቃልህ ይሁንልኝ» አለችው:: ሉቃስ 1÷37:: በዚህ ጊዜ አካላዊ ቃል በማኅፀኗ ተቀረፀ::\n\nየኤልሳቤጥ ምስክርነት- እመቤታችን ቅድስት ድንግል ማርያም የመልአኩን ብሥራት እንደሰማች ወዲያውኑ አክስቷ ኤልሳቤጥ ወደምትገኝበት ወደ ይሁዳ ሄደች:: ሉቃስ 1÷39። ከኤልሳቤጥም ዘንድ ደርሳ ሰላምታ እንደተሰጣጡ በኤልሳቤጥ ላይ መንፈስ ቅዱስ ሞላባትና የቅዱስ ገብርኤልን ቃል በመድገም «አንቺ ከሴቶች ሁሉ ተለይተሽ የተባረክሽ ነሽ የማኅፀንሽም ፍሬ የተባረከ ነው» ብላ ብፅዕናዋን፣ ቅድስናዋን፣ የጌታም እናት መሆኗን ተናገረች፡፡ ሉቃስ 1÷41-45:: ቅድስት ድንግል ማርያምም ከሰማያውያን መላእክት የቅዱስ ገብርኤልን፣ ከምድራውያን ከኤልሳቤጥ ከሁለት ወገን ምስክር ስላገኘች ለባለውለታው አምላክ ምስጋና አቀረበች:: ሉቃስ 1÷46-55::\n\nየክርስቶስ ልደት- በሮማ አውግስጦስ ቄሣር በነገሠ፣ በሶርያም ቄሬኔዎስ ገዥ በነበረበት ጊዜ በኢየሩሳሌምና በአውራጃዋም ሄሮድስ በነገሠ ጊዜ ሕዝቡ ሁሉ እንዲቆጠር /እንዲፃፍ/ ቄሣር በሰጠው አዋጅ የእመቤታችንና የቅዱስ ዮሴፍ አገር ይሁዳ /ቤተልሔም/ ነበርና በአዋጁ መሠረት ሊቆጠሩ እንደመጡ ጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ በቤተልሔም ተወለደ:: ሉቃስ 2÷1። ለቆጠራው የመጣው ሰው በዝቶ ቦታውን ይዞት ስለነበር እመቤታችንና ዮሴፍ ማደሪያ አጥተው በአንድ በረት እንደሠፈሩ የጌታችን ልደት በዚያው በበረት ሆነ:: ሆኖም አምላክ ነውና እንደ አምላክነቱ ከእንስሳት ወገን ላህምና አህያ እስትንፋሳቸውን ገበሩለት:: ሉቃስ 2÷8-20:: የሰማይ ሠራዊት ደግሞ «ክብር ለእግዚአብሔር በአርያም ይሁን ሰላምም በምድር ለሰውም በጎ ፈቃድ» እያሉ በምስጋና ተቀበሉት፡፡ ተቋርጦ የነበረው ሥራቸው ተጀምሯልና፡፡ እረኞችም ከብርሃኑ ብዛት ከሰማይ ሠራዊትም ምስጋና ድምጽ የተነሳ ይደነቁ ምስጋናም ያቀርቡ ነበር:: ሉቃስ 2÷8-20::\n\nእንዲሁም የጥበብ ሰዎች ከምሥራቅ ረጅም ጉዞዋቸውን መጥተው ሰገዱለት፤ ወርቅ ለመንግሥቱ፣ ዕጣን ለክህነቱ፣ ከርቤም ለሞቱ ምሳሌነት አድርገው ገበሩለት:: ማቴ. 2÷1-12፡፡ ቅድስት ድንግል ማርያም ግን የሆነውን ሁሉ ታስተውል በልብዋም ትጠብቅ ነበር፡፡ ታላላቅ ተአምራት ሲያደርግ አይታለችና፡፡ ይኸውም በኅቱም ድንግልና ፀንሳ በኅቱም ድንግልና መውለድ፣ የሰማይ ሠራዊት መጥተው ምስጋና ማቅረብ፣ ይህ ሁሉ ተጠቃሎ ማየት ታላቅነትን የሚገልጥ ነው፡፡ ሉቃስ 2÷19::\n\nጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ ሕግን እየፈጸመ ማደጉ ጌታችን ኢየሱስ ክርስቶስ በስምንተኛው ቀን ተገረዘ፤ ሉቃስ 2÷21። በአርባ ቀንም ወደ ቤተ መቅደስ ተወሰደ:: እዚያም ስምዖን አቀፈው ሐናም አየችው፡፡ ሉቃስ 2÷21-38::\n\nየጌታችንና የመድኃኒታችን ስደት ወደ ግብፅ የምሥራቅ ሰዎች ሲመጡ የአይሁድ ንጉሥ ወዴት ነው የተወለደው እያሉ የክርስቶስን ንጉሥነት እየመሰከሩ ስለመጡ ማቴ. 2÷1-4 ሄሮድስ ንጉሥ ከሆነማ «ንጉሥ ሳይገድል አይነግሥም በኔ ላይ የሚሰለጥን እንዴት ያለ ንጉሥ ተወለደብኝ» በማለት ጌታን ይገድል ዘንድ አሰበ:: ስለዚህም ወደ ግብጽ እንዲሰደዱ ምክሩን የሚለግስ መልአክ ከእግዚአብሔር ታዘዘ። እርሱም በሌሊት በራዕይ ለዮሴፍ ታየው:: ተናገረውም እንዲህ ሲል «ተነሳና እናቱንና ሕፃኑን ይዘህ በሌሊት ወደ ግብፅ ሽሽ፣ ሄሮድስም ሕፃኑን...\n\n...ይገድለው ዘንድ አለውና» አለው፡፡ ዮሴፍ ቅድስት ድንግል ማርያምንና ሕፃኑን ይዞ በሌሊት ወደ ግብፅ ተሰደደ:: ማቴ. 2÷13-15፣ ሆሴዕ 11÷1። ከዚያም ከቦታ ወደ ቦታ በመዘዋወር 3 ዓመት ከመንፈቅ ቆየ፣ ሄሮድስ እንደሞተ ያው መልአክ ለዮሴፍ ከግብፅ እንዲመለስ አመለከተውና ተመልሶ ወደ ናዝሬት ሄደ ጌታም በዚያ አደገ:: ማቴ. 2÷19-23።\n\nየክርስቶስ የሕፃንነቱ ጊዜ ከግብፅ ስደት ከተመለሱ በኋላ ጌታችን ቤተሰቦቹም መኖሪያቸው ናዝሬት ነበር። ማቴ. 2÷23፡፡ ናዝሬትም የገሊላ አውራጃ ከተማ ነበረች፡፡ እንደሌሎች አውራጃ ከተሞች ዝነኛ አልነበረችም፡፡ ስለዚህ የዕለት ምግቡን ያገኝ የነበረው እንጨት እየጠረበ ለቤት አገልግሎት የሚውሉ ዕቃዎችን እየሠራ በመሸጥ ነበር፡፡ ጌታችን ከዮሴፍ ጋር በመኖሩ ይህን ሥራ እንደሠራ ይገመታል፡፡ ሆኖም በዚህ በናዝሬት አደገ፤ ጥበብን እየተሞላ በመንፈስ እየጠነከረ ይሄድ ነበር፡፡ ምክንያቱም ጌታችን ግዕዘ ሕፃናት አላፋለሰም፡፡ እንደማንኛውም ሕፃን ቀስ በቀስ እያለ ነው ያደገው፡፡\n\nበ12 ዓመቱ ከዘመዶቹ ጋር ለበዓል ኢየሩሳሌም ሄዶ እንደነበር እናገኛለን፡፡ ሉቃስ 2÷41-51። ምክንያቱም እመቤታችንና ዮሴፍ በየዓመቱ እንደ አይሁድ ሥርዓት /ልማድ/ ለበዓል ወደ ኢየሩሳሌም ይወጡ ነበርና:: ዘፀ. 23÷14-17። ኦሪት በዓመት ሦስት ጊዜ በእናንተ ዘንድ ያለ ወንድ ሁሉ በጌታ በእግዚአብሔር ፊት ይታይ ትል ስለነበር፡፡\n\nበዚያም በኢየሩሳሌም በሊቃውንቱ መካከል ሆኖ ሲጠይቃቸውም ሲሰማቸውም ተገኝቷል:: ሉቃስ 2÷46-48:: ይህም ማለት የዕብራውያንን ሥርዓት በመከተል የዕብራውያንን ትምህርት እየተማረ እንዳደገ ያስረዳል:: አባ ሕርያቆስ ይህን ሲያስረዳ «የዕብራውያንን ሕግ ተማረ» ብሏል:: ስለዚህ የዕብራውያን ሕግ የፀና ሆነ፡፡ ጌታችንም በዚህ በናዝሬት እየኖረ በጥበብም፣ በቁመትም አደገ፡፡ በእግዚአብሔርና በሰው ፊትም ሞገስን አገኘ፤ ቤተዘመዶቹን ይታዘዝ ያገለግልም ነበር፡፡ ሉቃስ 2÷52:: ከሠላሳ ዓመት ዕድሜው በኋላ በመምህርነት እስከ ተገለጠበት ድረስ ተራ ሰው መስሎ በዚያው በናዝሬት ኖረ። በዚህም ዘመን ሰው የሚሠራውን ሁሉ ከኃጢአት በቀር ሠራ፡፡ አባ ሕርያቆስ በቅዳሴ ማርያም ከኃጢአት ብቻ በቀር የሰውን ሕግ ሁሉ ፈፀመ እንዳለ::\n\nየክርስቶስ ጥምቀት ጌታችን የሕፃንነቱን ዘመን ፈጽሞ ልክ ሠላሳ ዓመት ሲሞላው የይፋ ሥራውን ለመሥራት ከናዝሬት ወጣ ወደ ይሁዳም ሄደ:: የይፋ ሥራውንም በጥምቀት ጀመረ፡፡ ዮሐንስ በዮርዳኖስ ምድረ በዳ «ንስሐ ግቡ መንግሥተ ሰማያት ቀርባለችና» እያለ እያስተማረ ወደ እርሱ የሚመጡትን ሁሉ የንስሐ ጥምቀት እያጠመቀ የክርስቶስን መንገድ እየጠረገ እያዘጋጀም መጣ:: ክርስቶስ ከዮሐንስ ጋር በተገናኘ ጊዜ እንዲያጠምቀው ጠየቀው፤ ዮሐንስ ግን «እኔ በአንተ ልጠመቅ እወዳለሁ እንጂ አንተ ራው ስብከት በመባል የሚታወቀው እንደ ቤተክርስቲያናችን ስያሜ አንቀጸ ብፁዓን እየተባለ የሚጠራውን እንደ መጀመሪያ አዋጅ አድርጎ «ብፁዓን ብፁዓን» እያለ እውነተኛውን የክርስቲያንነት ትምህርት በዚህ መልክ አስተማረ። ማቴ. 5÷1-12:: ይህ ትምህርት ፍፁም ልዩ የሆነ የፍፁምነት ትምህርት ነው:: የክርስትናውም አርነት ፍፁም ነውና አንድ የመንግሥት መሪ መንግሥት እንደያዘ የሚያውጀው የመንግሥቱን ዓላማ ነው:: ክርስቶስ በመጀመሪያው የክርስትናውን ዓላማ ይህንንና ይህን ሠርቶ የፈፀመ ብፁዕ ነው በማለት እውነተኛውን ክርስቲያናዊ ትምህርት አስተማረ፡፡\n\nምንም በተለያዩ ቦታዎች ብፁዓን ቢጠሩም በዚህ በተራራው ትምህርት ጊዜ የተገለጡት እንደ ቅዱስ ማቴዎስ አገላለጥ ዘጠኝ ናቸው::\n\nትምህርቱ በምሳሌ ጌታችን ኢየሱስ ክርስቶስ ሲያስተምር በእንዲሁ ቢገባው ይግባው ካልገባውም ይቅር በማለት አልነበረም፡፡ ነገር ግን ሁሉንም በሚገባው በምሳሌ ያስተምር ነበር፡፡ ለምሳሌ ገበሬዎችን በእርሻ፣ በዘር እየመሰለ አስተምሯል:: ማቴ. 13÷3-50፣ ማር. 4÷13-20፣ ሉቃስ 8÷4-15። ለሴቶች በዱቄት፣ በእርሾ እየመሰለ አስተምሯል:: ማቴ. 13÷33:: ለነጋዴዎች በመክሊት በልዩ ልዩ ሚዛን እየመሰለ አስተምሯል፡፡ መንግሥተ ሰማያትን በልዩ ልዩ ምሳሌዎች እየመሰለ አስተምሯል፡፡ እንዲያውም ያለምሳሌ አላስተማረምም አልተናገረምም:: ማቴ. 13÷35:: እንግዲህ ወደዚህ ዓለም የመጣበት ዓላማ ለማስተማር ስለሆነ ሁሉንም በሚገባው መልክ አስተምሯል፡፡\n\nየጌታችንና የመድኃኒታችን የኢየሱስ ክርስቶስ ተአምራት ድውያነ ነፍስን በትምህርት እየፈወሰ፣ ድውያነ ሥጋን በተአምራት ይፈውስ ነበር፡፡ ከተአምራቱም በጥቂቱ ኅብስት አበርክቶ ማብላቱ ማቴ. 15÷32-38፣ ሕሙማንን መፈወስ ዮሐ. 5÷5-10፣ ዕውራንን መፈወስ ዮሐ. 9፣ ሙት ማንሳት ዮሐ. 11÷11-34 ... በአጠቃላይ ብዙ ገቢረ ተአምራትን ፈጽሟል፤ ግን ድውይ በመፈወሱ ተአምራትን ሁሉ በማድረጉ ሰንበትን ሻረ ተብሎ ተከሷል፡፡ ሰይጣንን በሰይጣን አለቃ ያወጣል ተብሎ ተከሷል::\n\nጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ በማኅበራዊ ኑሮ መድኃኒታችን ኢየሱስ ክርስቶስ ሰው የሆነው ሰውን መስሎ ሰው በሄደበት ሄዶ ለማስተማር ነው፡፡ በሰዎች ማኅበራዊ ነገሮችም እየገባ የደስታቸውም የኃዘናቸውም ተካፋይ ሆኗል:: በመጀመሪያ ጊዜ በገሊላ ቃና ተአምራትን ያደረገው በሠርግ ቤት በመገኘት የሰዎች የደስታ ተካፋይ ከመሆኑ የተነሣ ነው:: ዮሐ. 2÷1-12::\n\nከቅዱስ ማቴዎስ ቤት ጀምሮ በነአልዓዛር፣ ስምዖን ዘለምጽ ቤት ግብዣ እየተጋበዘ ገብቷል:: በእነዚህም ቤቶች ቀዳሚ የሆኑ ትምህርቶችን ሰጥቷል:: ሉቃስ 10÷38-42:: በቤተ መቅደስ ተገኝቶ የጸሎቱ ተካፋይ ለመሆን ከ12 ዓመት ዕድሜው ጀምሮ ፈጽሟል:: ሉቃስ 2÷42-50:: እኔ አምላክ ነኝና እኔ ያለሁበት ነው ቤተመቅደስ አላለም፡፡ ይህም ሰው እምነቱን ሥርዓቱን አክብሮ በማኅበር ጸሎት በተወሰነው...\n\n...ቦታ መገኘት ግዴታው መሆኑን ያስረዳል፡፡ በሐዘን ቤት ተገኝቶ ተንሰቅስቆ አልቅሷል፡፡ ይኸውም በአልዓዛር ሞት ጊዜ ነው:: በዚያም ከመገኘቱ የተነሣ አልዓዛርን ከሞት አስነስቶታል፡፡ ዮሐ. 11÷11-34:: በዚህም መልክ እንደማንኛውም ሰው ሆኖ ከኃጢአት በቀር የሰውን ችግር እየተካፈለ፣ እግረ መንገዱን ግን እያስተማረ ኖረ፡፡ ሲያስተምር ውሎ የሚያድርበት ቤት የሚያርፍበት ክፍል አልነበረውም፡፡ ቀን በምኩራብ በአዳራሽ ሁሉ ሲያስተምር ይውላል፡፡ ሌሊት ግን ወደ ደብረ ዘይት እየወጣ ያድር ነበር፡፡ ሉቃስ 21÷37። ምግብ የሚያዘጋጅለት፣ ደከመህ እረፍ የሚለው ዘመድ አልነበረውም፡፡ ሲያስተምር ውሎ «ልጆች የሚበላ አለን?» እያለ ይጠይቅ ነበር፡፡ ማቴ. 15÷32-38:: ማቴ. 21÷1-17፣ ሉቃስ 19÷29-48::\n\nየሐሙስ እራት ጌታችን ከደቀመዛሙርቱ ጋር የፍስሐን /የፋሲካን/ በዓል በማክበር እራት፣ ኅብስቱን አንስቶ ባረከ፣ ፈተተ፤ ለደቀመዛሙርቱም «እንኩ ብሉ ይህ ሥጋዬ ነው ነገ በመልዕልተ መስቀል የሚቆረሰው» ብሎ ሰጣቸው:: ጽዋውንም አንስቶ እንዲሁ ባረከ «እንኩ ሁላችሁ ጠጡ ይህ ነው የሐዲስ ኪዳን ደሜ ለዓለም ኃጢአት ማስተሰረያ ሆኖ ነገ የሚፈሰው» ሲል ሰጣቸው:: ማቴ. 26÷26-29:: በዚህ ጊዜ ሥርዓተ ቁርባንን አሳያቸው:: ምሥጢረ ቁርባንን መሠረተላቸው፡፡ ከዚያም ጊዜ ጀምሮ በክርስቶስ የሚያምን ሁሉ ከእርሱ ጋር ግንኙነት ሳያቋርጥ 1ኛ ቆሮ. 11÷26 ይኖር ዘንድ ሥጋውን መብላት ደሙን መጠጣት አስፈላጊ መሆኑን አስረዳ:: ከዚህ በኋላ ደቀመዛሙርቱን ይዞ ለጸሎት ወደ ጌቴሰማኒ ሄደ፡፡ ማቴ. 26÷36-49::\n\nየጌታችን መያዝ ጌታችን በጌቴሰማኒ ሆኖ ሲጸልይ ከደቀመዛሙርቱ አንዱ የነበረ ይሁዳ ወደ ካህናቱ አለቃ ሄዶ ነገር ሠራ:: ያስይዘውም ዘንድ ሠላሳ ብር ተቀብሎ የጭፍሮቹ መሪ ሆኖ ድንገት እርሱ ክርስቶስ ነውና ተባብራችሁ ያዙት ብሎ ምልክት ሰጥቷቸው ነበርና ይሁዳ ሄዶ «መምህር ሆይ ሰላም ላንተ ይሁን» ሲል እጅ ነሳው:: በዚህ ጊዜ ተረባርበው ያዙት:: ክርስቶስ ግን «ይሁዳ በመሳም ልታስይዘኝ መጣህን» ሲል የሰላም ቃል ተናግሮ እጁን ሰጠ እንጂ «አልያዝም» ብሎ አልታገለም፡፡ ወዲያውም ጭፍሮቹ እያዳፉ እያጋፉ ወደ ሊቀ ካህናቱ ወደ ቀያፋ ወሰዱት:: ማቴ. 26÷47-57::\n\nደቀመዛሙርቱ ግን ለራሳቸው ፈርተው ተበተኑ፡፡ ቅዱስ ጴጥሮስና ቅዱስ ዮሐንስ ብቻ የሚሆነውን ሁኔታ ሁሉ ለማየት ከኋላ ከኋላ እየተከተሉ እስከ ሊቀ ካህናቱ ግቢ አብረው ሄዱ:: ቅዱስ ዮሐንስ ግን እስከ መጨረሻውም ቢሆን አልተለየውም:: ስለዚህ በመስቀሉም ጊዜ በአንጻሩ ሆኖ ሲያለቅስ ውሏል:: ማቴ. 26÷58፣ ዮሐ. 19÷26:: ሊቀ ካህናቱም አጣድፎ የበኩሉን ምርመራ ፈጸመና በክርስቶስ ላይ ሊሞት የሚያስችለውን ውሳኔ በበኩሉ አስወስኖ ወደ ጲላጦስ ወሰደው፡፡ ጲላጦስ ግን ነገሩን መላልሶ በማጥናት ምንም በደል ያልተገኘበት መሆኑን ተረድቶ ሊለቀው ፈልጎ ነበር።\n\nነገር ግን የካህናቱ አለቃ፣ የሕዝብ ሽማግሌዎችም በአንድ ድምጽ ሆነው «ስቀለው አስወግደው» እያሉ ጮሁ:: በመቀጠልም «ይህን ሰው ካዳንከው የቄሣር ታማኝ አይደለህም ራሱን ከፍ ከፍ የሚያደርግ ነው:: ይህ ሰው የቄሣር ጠላት ነው፡፡ ለቄሣር ሰዎች ግብር እንዳይከፍሉ ከልክሏል» ሲሉ ከቄሣር ጋር እንደሚያጣሉት አስፈራሩት:: በሌላ በኩል ደግሞ እንደ ሕጋችን ሞት ይገባዋል ብለው የነበረውን ሕግ ስለጠቀሱበት እንደ ሕጋችሁ ወስዳችሁ ስቀሉት ብሎ ክርስቶስን አሳልፎ ሰጣቸው:: ጲላጦስ ግን ከነገሩ ንፁህ እንደሆነ ተናገረ:: ማቴ. 27÷15-26፣ ሉቃስ 23÷1-25፣ ዮሐ. 18÷28::\n\nጌታችን ኢየሱስ ክርስቶስ በመስቀል ላይ ጌታችን ኢየሱስ ክርስቶስ እንደ ክፉ አድራጊ ተሰቀለ፡፡ በመስቀል ተሰቅሎ የሞተ ሁሉ እርጉም ይባል ነበርና እርግማንን ውርደትን ከሰው ለማራቅ ሲል በእንጨት ተሰቀለ፡፡ ወንጀሉንም ከፍተኛ ለማድረግ በነፍሰ ገዳይና በልዩ ልዩ ወንጀል ከተፈረደባቸው ሁለት ወንበዴዎች ጋር ተሰቀለ፡፡\n\nክርስቶስ በሰው ዘንድ እንደ ክፉ አድራጊ ቢቆጠርም ሌላው ግዑዝ ፍጥረት ሁሉ ለአምላክ ለመመስከር ወደ ኋላ አላለም፡፡ ስለዚህ ፀሐይ ጨለመ፣ ጨረቃ ደም ሆነ፤ ከዋክብት ረገፉ፣ አእባን ተፈተቱ፣ መቃብራት ተከፈቱ፣ ሙታን ተነሱ፣ የቤተ መቅደስ መጋረ \n\n(የሥነ ምግባር ሕጎች መዋቅራዊ ሰንጠረዥ)\n\nየሥነ ምግባር ሕጎች\n\nመንፈሳዊ /አምላካዊ/ ሕግ\n\nኢ-ጽሑፋዊ ሕግ -> ሕገ ልቡና (እና ሕገ ሕሊና)\n\nጽሑፋዊ ሕግ -> ብሉይ ኪዳን (ዐሥርቱ ትዕዛዛት) እና ሐዲስ ኪዳን (6ቱ ቃላተ ወንጌል)\n\nሥጋዊ /ዓለማዊ/ ሕግ\n\nየቤተክህነት ሕግ\n\nየቤተመንግሥት ሕግ\n\nክርስቲያን ሁሉ መንፈሳዊነትም ሥጋዊነትም ያለው ምድራዊ ፍጡር እንደመሆኑ እርሱንም የሚመለከተው ሕግ ሁለት ወይም በሁለት ክፍል ያለው ሕግ ይሆናል። ይኸውም፣ መንፈሳዊ /አምላካዊ/ ሕግና ዓለማዊ /ሥጋዊ/ ሕግ በመባል የሚታወቅ ነው።\n\nመንፈሳዊ ወይም አምላካዊ ሕግ ለሰው ሁሉ ከልዑል እግዚአብሔር በተፈጥሮና በጽሑፍ የተሰጠው ሲሆን ዘለዓለማዊ በመሆኑ እና ከእግዚአብሔር በመገኘቱ መንፈሳዊ ሕግ ተብሏል። 1ኛ ጢሞ. 3፥16\n\nኢ-ጽሑፋዊ ሕግ፦ በሁለት ይከፈላል፤ የሰው ልጅ በተፈጥሮው ከእግዚአብሔር ያገኘው ነው።\n\n1. ሕገ ልቡና፦ ይህ ሕግ በሰው ልቡና አንድ ጊዜ ከተጻፈ በኋላ ሳያረጅ ሳያፈጅ ከትውልድ ወደ ትውልድ ሲተላለፍ ያለ የኖረ የተፈጥሮ ሕግ ነው። ሮሜ. 2፥14 ሕገ ልቡና የተባለው ሰው በተባለው ሁሉ በልቡናው ተጽፎ የሚገኝ እያንዳንዱን ሰው ማንም ሳያስተምረው ክፉውንና ደጉን ሳይነግሩት እንዲያውቅ የሚያደርገው ስለሆነ ነው። ሕገ ልቡና ሕገ ተፈጥሮአዊ ወይም ሕገ ጠባያዊ እየተባለ የሚጠራ ሲሆን ሰው የሚመሰገነው በተፈጥሮ የተሰጠውን ይህንን ሕግ በንጽሕና በመያዙና በማዳበሩ ነው። እንዲሁም የሰው ልጅ ክፉውን ለይቶ ያውቅበት ዘንድ የተሰጠው ሕግ ነው።\n\nየጽሑፍን ሕግ ለመመልከት ለመረዳት ይህ ሕግ አስፈላጊ ነው። ሕጉን እንደ ሕግነቱ ለመረዳት የሥጋ ዓይን ሳይሆን የልቡና ዓይን በጣም ያስፈልጋል። የሐዋ. ሥራ 16፥14-15 በብሉይ ዘመን የልቡናችን ሕግ በኃጢአት ቢቆሽሽም የልቡናችን ሰሌዳ ከክርስቶስ ካሣ ወዲህ ብሩህ ሆኗል፤ ማለት የመመልከት፣ የመረዳት፣ የማስተዋል ኃይላችን እያደገ እንዲሄድ የመንፈስም ማኅደር አድርጎታል። እኛ ደጉን እንመልከት ካልን ሁሉም ገልጾ ያሳየናል፣ ያስረዳናልም። ስለዚህም ነው ብዙዎች የሰው ወገኖች ቅዱሳን ለመሆን ቅድስናን ለማግኘት የቻሉት።\n\nየልባችንን ሕግ እንከተል በልቡናችን ዓይንም እንመልከት ክፉውንና ደጉንም እንለይ።\n\n2. ሕገ ሕሊና፦ ሕገ ሕሊና ወይም ሕሊናዊ ሕግ የእግዚአብሔር ድምጽ ለነፍስ የሚተላለፍበትን በማንኛውም ክርስቲያን ሁሉ አድሮ የሚሠራ ሥነ ምግባራዊ ሕግን እንድንፈጽም የሚያነቃ አርፈን እንቀመጣለን ብንል እረፍት የሚነሳ ነው። አንድ ሰው ነፍስ አጥፍቶ እንደሆነ የሚከስ አልምቶም ከሆነ እንዲደሰት የሚያደርግ የሕሊና ዳኛ ነው።\n\nይህ ሕግ አንድ ግብር እንዲፈጸም ወይም እንዳይፈጸም አስቀድሞ ማስጠንቀቂያና ምርጫን የሚያደርግ ሲሆን ከተደረገ በኋላ መጥፎ እንደሆነ መፀፀትን ሐዘንን ያመጣል፤ መልካም ከሆነ ደግሞ ደስታን መጽናናትን ይሰጣል። ማንኛውም የክርስትና ተከታይ የሆነ በስሙ የተጠራ ወገን ሁሉ ፍለጋውን የሚከተል ሁሉ የራሱን የሕሊና ምርጫ ማክበር የእግዚአብሔርን ድምጽ መስማት ግዴታው ይሆናል። እየተጠራጠረ እያመነታም የሚሠራ ሰው ሁሉ ከሕሊናው ግምት ውጭ ይሠራል ማለት ነው። ይህም ራስን መበደል ነው። ሮሜ. 14፥23\n\nበዚህ ምክንያት የሕሊና ዓይን በኃጢአት ምክንያት ይጨልማል፤ ይተኛል፤ ይደክማል። ግን ፈጽሞ ከነፍስ አይለይም፤ አይጠፋም፤ ምክንያቱም ከነፍስ ጋር የተያያዘ አድርጎ አምላክ የቀረፀውን በነፍስ ያሳደረው በዕውቀት ነውና። የሕሊና ፈቃድ አጠራጣሪ በሚሆንበት ጊዜ ማለት መልካም ነው ብለን ፈቅደን አቅደን የፈጸምነው አንዳንድ ጊዜ መጥፎ ሆኖ እናገኘዋለን። አንዳንድ ጊዜ ደግሞ መልካሙ ክፉ መስሎ ይገኛል። ስለዚህ ሳይሠራ ያመልጣል፤ ከሁሉ አስቀድሞ በምንሠራው ሥራ እንደ ሃይማኖታችን ጽናት መጠራጠር አይገባንም። ይህንን ሁሉ ለማስወገድ ከሁሉ በፊት፦\n\nጸሎት መጸለይ ማለት የሚሠሩትን ሁሉ «ወይኩን ፈቃድከ» (ፈቃድህ ይሁን) ብሎ መጠየቅ\n\nዓላማው ማንኛውም ነገር ከእግዚአብሔር ፍቅር የተነሣ የእርሱን አምልኮትና ፍቅር መግለጫ መሆን ይኖርበታል። አምላክ ሰውን አፍቅሮ አንድያ ልጁን ለእኛ አሳልፎ ቤዛ እንደሰጠ ሁሉ። ዮሐ. 3፥16\n\nስለ እግዚአብሔር ክብር ተብሎ የሚሠራ መሆን ይኖርበታል። 1ኛ ቆሮ. 10፥31\n\nስለ ባልንጀራው ፍቅር መሆን ይገባዋል።"}]}, {"chapter_id": "ksm_ch2", "title": "ክፍል አንድ፡ ዐሥርቱ ትዕዛዛት", "page_start": 2, "sections": [{"heading": "ክፍል አንድ፡ ዐሥርቱ ትዕዛዛት", "content": "ከእግዚአብሔር አምላክ በቀጥታ በሙሴ አማካኝነት ለእስራኤላውያን የተሰጠ ሕግ ነው። የተሰጣቸውም እስራኤላውያን ከግብጽ ከወጡ በ3ኛው ወር ፋሲካን ካከበሩ በ3ኛው ቀን በደብረ ሲና ሰፍረው ሳለ ነበር። ዘፀ. 19፥1-4 በዘፀ. 34፥28፣ በዘዳ. 4፥13 ላይ አሥሩ ትዕዛዛት አሥር መሆናቸውን እንረዳለን።\n\nበዝርዝር ተጽፈው የሚገኙት ግን በዘፀ. 20፥3-17 እና በዘዳ. 5፥5-21 ላይ ነው። አሥርቱ ቃላትና ስድስቱ ትዕዛዛት ለእስራኤል ዘሥጋና ለእስራኤል ዘነፍስ የተዘጋጁ ስለሆነ ሁላችንንም ይመለከታል። እነርሱም የሚከተሉት ናቸው፦\n\nክፍል አንድ፡ ዐሥርቱ ትዕዛዛት\n\nእኔ እግዚአብሔር አምላክህ ነኝ ከግብጽ ምድር ከባርነት ቤት ያወጣሁህ ነኝ ሌሎች አማልክት አይሁኑልህ ... እኔ እግዚአብሔር አምላክህ ቀናተኛ አምላክ ነኝ። ዘፀ. 20፥2\n\nየእግዚአብሔር የአምላክህን ስም በከንቱ አታንሳ እግዚአብሔር ስሙን በከንቱ ያደረገውን ይቀስፈዋል። ዘፀ. 20፥7\n\nየሰንበትን ቀን ትቀድሰው ዘንድ አስብ። ዘፀ. 20፥8-11\n\nአባትህንና እናትህን አክብር ዕድሜህ ይረዝም ዘንድ እግዚአብሔር አምላክህ በሚሰጥህ ምድር። ዘፀ. 20፥12\n\nአትግደል። ዘፀ. 20፥13\n\nአታመንዝር። ዘፀ. 20፥14\n\nአትስረቅ። ዘፀ. 20፥15\n\nበባልንጀራህ ላይ በሐሰት አትመስክር። ዘፀ. 20፥16\n\nየባልንጀራህን ቤት አትመኝ፣ አህያውንም ማንኛውንም ከባልንጀራህ ገንዘብ ሁሉ አትመኝ።\n\nባልንጀራህን እንደራስህ አድርገህ ውደድ። ዘሌ. 19፥18\n\nእነዚህ ሕግጋት የብሉይ ኪዳን መሠረቶች ናቸው። እግዚአብሔር ሕግን ብትጠብቁ ብትፈጽሙትም ሕዝቤ ትሆናላችሁ እኔም አምላክ እሆናችኋለሁ ብሎ ቃል ኪዳን ገባ። ሕዝቡም በአንድ አፍ ድምጻቸውን ከፍ አድርገው «እግዚአብሔር ያለውን ሁሉ እናደርጋለን፣ እንታዘዛለን» ብለው ቃል ኪዳን ገቡ። ዘፀ. 19፥8፣ 24፥1-8። ቅዱስ ጳውሎስም እንደነገረን ይህ ፊተኛው ኪዳን ያለ ደም አልተመረቀምና (ዕብ. 9፥18-22) ሙሴ ኪዳኑን ለማጽናት የደም መርጨት ሥርዓት እንዳደረገ።\n\nበሐዲስ ኪዳንም ቢሆን ዐሥርቱ ትዕዛዛት ሙሉ በሙሉ ተቀባይነት ያላቸው ሕግጋት ናቸው። ማቴ. 5፥17፣ 19፥15-22 (ዮሐ. 1፥12 እግዚአብሔር ሕዝቦቹና ልጆቹ ሊያደርገን ይህን ታላቅ ተስፋ በመስጠት ቃል ከገባልን እኛ ደግሞ ትዕዛዛቱን ለመጠበቅ ምን ያህል ቃል ገብተንለታል? ጌታችን ብትወዱኝስ ትዕዛዜን ጠብቁ ዮሐ. 14፥15 እንዲሁም ከሆነ እንደ እስራኤላውያን እግዚአብሔር ያለውን ሁሉ እናደርጋለን እንታዘዛለን ብለን ከሁሉ በፊት ለእግዚአብሔር ቃል መግባት አለብን። ክርስትናውን ስንጀምር የመ ም ቢሆኑ ከግብጽ ምድር ያወጣቸውን አምላክ እግዚአብሔርን በመዘንጋት ብዙ ጊዜ ጣዖትን አምልከው እንደነበር የሚከተሉት ጥቅሶች ያስረዳሉ። ምሳ. 2፥11-14፣ 2ኛ ነገ. 17፥7-18፣ 21፥11-12፣ 1ኛ ነገ. 12፥25-32\n\nበዚህ በአንደኛው ትዕዛዝ እኔ እግዚአብሔር አምላክ ቀናተኛ ነኝ በማለት እግዚአብሔር እንዳስረዳው ሰው ለእጁ ሥራ ሲንበረከክ በተመለከተ ጊዜ ዝም ብሎ አልተመለከተም ብዙ ጊዜ ይቆጣ ነበር፤ ዛሬም ቢሆን የእግዚአብሔር ቅጣት እንዳይሰነዘር የተቀረጹ ምስሎችን ማራቅ አለብን።\n\nለአንተ አታድርግ ለአንተ አታድርግ የሚለው ትዕዛዝ አነጋገር አትስገድላቸው፣ አታምልካቸው በሚለው ቃል ተብራርቷል። ዘፀ. 20፥5። አሕዛብ ጣዖትን ሲያመልኩ በኮረብታዎች መሥዋዕትን በመሠዋት ዕጣንን በማጠን ወደ እነርሱም በመጸለይና በመስገድ አካላቸውን እንኳ ሳይቀር በመጉዳትና በማሰቃየት ነበር። ይህ ትዕዛዝ እንዲህ እንዳናደርግ ያዝዘናል። በአንጻሩም ደግሞ እግዚአብሔር ሕጉ የተጻፈበትን ጽላት ማደሪያ የሆነውን የእንጨት ታቦት እንዲቀርጹ ያዘዘ መሆኑን መዘንጋት የለብንም። ዘፀ. 37፥1-9፣ 34፥1-25፣ 40፥20 የኪሩቤል ቅርጽም ከተቀጠቀጠ ወርቅ እንዲሠራ በመጋረጃው ላይ እንዲሠሩ አዟል። ዘፀ. 25፥12-22 ይህ ሲባል ጽላቱና ታቦቱ የኪሩቤል ቅርጽም አምላክ ሆነው ወይም እግዚአብሔር አምላክን መስለው የሚመለኩ ሳይሆን እግዚአብሔር በሚመለክበት ጊዜ ለቅዱስ አገልግሎት የሚውሉ ንዋያተ ቅድሳት ናቸው።\n\nየእግዚአብሔር የክብሩ መገለጫዎች ናቸው። ዛሬ በቤተክርስቲያን ያለው ጽላትና የሥዕል ጉዳይ ከዚህ ጋር የሚታይ ነው። በታቦተ ጽዮን የሚገለጠው እግዚአብሔር መሆኑን በአሕዛብ ሀገር እንኳ ታውቋል። በታቦተ ጽዮን ዳጎን የሚባለው ጣዖት እንደተሰባበረ ይታወቃል። 1ኛ ሳሙ. 5፥1-5 ስለዚህ የእግዚአብሔር ታቦት /ማደሪያ/ የሆነው ሰውነታችን ጣዖታትን መሰባበር ብሎም ማቃጠል ይገባዋል። ሰውነታችን መቅደስ ነው የእግዚአብሔር ቤተመቅደስም ከጣዖት ጋር ምንም ኅብረት ስለሌለው (2ኛ ቆሮ. 6፥14) ከጣዖት መለየት ይገባል። ጣዖትን የሚያመልኩት ለጣዖት የሚሠዉ ለአጋንንት ይሠዋሉ። ታዲያ ቅዱስ ሥጋውን ክቡር ደሙን የተቀበለ ሰውነት የአጋንንትን መሥዋዕት በመሳተፍ ከአጋንንት ጋር ማኅበርተኛ መሆን የለበትም። 1ኛ ቆሮ. 10፥16-22 የተቀረፀ ምስልን /ጣዖትን/ ማምለክ ጣዖት ኃይል የሌለው ደካማ የሰው እጅ ሥራ ምንም ማድረግ የማይችል መሆኑን እንድናስተውል ይሆናል። ኢሳ. 44፥18 ጣዖት ግን ዓይን እያላቸው የማያዩ ጆሮ እያላቸው የማይሰሙ እግር እያላቸው የማይራመዱ እንደእነሱ ስለሆነ ከዚህ ለመዳን ከጣዖት ሽሹ ራሳችሁን ጠብቁ ይለናል። 1ኛ ቆሮ. 10፥14፣ 1ኛ ዮሐ. 5፥21"}, {"heading": "2ኛ ትዕዛዝ፡ የእግዚአብሔርን የአምላክህን ስም በከንቱ አትጥራ", "content": "የእግዚአብሔር ስም ስም ሲባል አንድ ነገር ከሌላው ተለይቶ የሚታወቅበት መጠሪያ ነው። ስም ጠባይን ግብርንና ሁኔታን እንደሚገልጥ ሆኖ ሊሰየም ይችላል። እግዚአብሔርም ባሕርዩን ሕልውናውን ግብሩን የገለጹ ብዙ ስም አለው። ዘፀ. 15፥3፣ አሞጽ 4፥13 ከብዙዎቹ የእግዚአብሔር ስሞች ሦስቱን እንደሚከተለው እንመለከታለን፦\n\nኤል፦ ኃያል ማለት ነው። ዘፍ. 17፥1\n\nኤሎሄ፦ አምላክ ማለት ነው። ማቴ. 27፥46\n\nያሕዌ፦ ያለና የሚኖር ማለት ነው። ዘፍ. 22፥14፣ ዘፀ. 3፥13-15፣ ዘፀ. 17፥15\n\nክርስቶስ እርሱ እግዚአብሔር ነው። በሐዲስ ኪዳን እግዚአብሔር ወልድ በሥጋ ሲገለጥ በሚከተሉት ስሞች ተጠርቷል፦\n\nአማኑኤል (ኢሳ. 7፥14፣ ማቴ. 1፥23)\n\nኢየሱስ (ማቴ. 1፥25)\n\nክርስቶስ (ሉቃ. 1፥31)\n\nየእግዚአብሔር ስም ባዶ ቃል አይደለም፤ ኃይሉን ግርማውን ይዞ ይገኛል። ማቴ. 18፥20 የማይታየው እግዚአብሔር ራሱን የገለጠው በስሙ አማካኝነት ነው። በተለይም ክርስቶስ በሥጋ በተገለጠ ጊዜ ስሙን ለዓለም አስታውቋል። ዮሐ. 17፥26 ስሙም ከሁሉ በላይ ነው። ፊል. 2፥9-11 «እግዚእ መባልን፣ አምላክ መባልን፣ ወልድ መባልን ሰጠው»\n\nሕዝቡ ሁሉ እያንዳንዱ በየአምላኩ ስም ይሄዳል እኛም በአምላካችን በእግዚአብሔር ስም ለዘለዓለም እንኖራለን። ሚክ. 4፥5 ስለዚህ የእግዚአብሔርን ስም አክብረን ልንይዘው ልንቀድሰው ይገባል እንጂ በከንቱ ልንጠራው አይገባም፤ ስሙ ቅዱስ ነውና። ሉቃ. 1፥50 እስራኤል በሐሰት መማል ያበዙ ነበር። እግዚአብሔር የእውነት አምላክ ስለሆነ በእውነት እንጂ በሐሰት መማል ሊጠራ አይገባም። የእግዚአብሔር ስሙ በከንቱ የሚጠራ ከበደሉ ሊነፃ አይችልም። በሐዲስ ኪዳን ጌታችን እንኳን የእግዚአብሔር ስም በከንቱ መጥራት ለራስ መማል እንደማይገባ አስተምሯል። ማቴ. 5፥34-39\n\nመላእክት ቅዱስ ቅዱስ ቅዱስ እያሉ የሚያመሰግኑት አምላክ መሆኑን አውቀን ስሙን በከንቱ መጥራት ግብሩን ማርከስ ነው። ሌላው ደግሞ ጌታ አምላክን በአፍ እያመሰገኑ በልባቸው ውሸት አምቀው ስሙን የሚጠሩ አሁንም ስሙን ከንቱ ማድረግ ነው። እምነት በአፍም በልብም ነውና። ሮሜ. 10። በማኅበር ስንኖር ከሳሽ ተከሳሽ ስለሚኖር የክርክሩ መፈጸሚያ የእውነት ማረጋገጫ መሐላ ስለሆነ ዳኛው እንዲምል ካስገደደው መማል ይፈቀዳል። ዘፀ. 22፥11፣ ዕብ. 6፥13። ከዚህ ሌላ ቃል ለመግባት አንድ ነገርን ለመሥራት መሐላ መማል ቃል መስጠት የእግዚአብሔር ስም መጥራት የሚያስፈልግባቸው ጊዜ አለ። እንዲሁም እግዚአብሔርን ለማገልገል ሲሉ ብፅዓት የሚያደርግ አለ፤ ይኸም በቤተክርስቲያን ሥርዓት የተፈቀደ ሥርዓት ነው (ለምሳሌ በድንግልና ለመኖር)።\n\nበከንቱ አትጥራ ከንቱ ማለት በእግዚአብሔር የተናቀ የማይገባ ምናምን ነገር ማለት ነው። የእግዚአብሔርን ስም በእንዲህ ዓይነት ሁኔታ መጥራት እንደማይገባ ይህ ትዕዛዝ ያስተምረናል። የሚከተሉት ነገሮች ከንቱ እንደሆኑ መጽሐፍ ቅዱስም ያስተምረናል፦\n\nየሰው ሥጋዊ ፈቃድ (ኢዮብ 7፥3፣ መዝ. 38፥5-6፣ ሮሜ. 8፥20፣ ኤፌ. 4፥17)\n\nጣዖትን ማምለክ (2ኛ ነገ. 17፥15፣ ኢሳ. 44፥9)\n\nሐሰተኛ ትንቢት (ሕዝ. 13፥1-23፣ ዘካ. 10፥1፣ 2ኛ ጴጥ. 2፥18)\n\nበእነዚህ ከንቱ ነገሮች የእግዚአብሔርን ስም መጠቀም ስሙን በከንቱ መጥራት ነው። ይኸውም፦ 4. በእግዚአብሔር ስም በሐሰት መማል (ዘካ. 5፥4፣ ማቴ. 5፥33-37) 5. በእግዚአብሔር ስም መራገም (ማቴ. 5፥44፣ ሮሜ. 12፥14) 6. በእግዚአብሔር ስም መጠንቆል (ኢሳ. 19፥3)። የእግዚአብሔርን ስም ማቃለልና ክብር አለመስጠት ስሙን ከንቱ ማድረግ ነው (ምሳሌ፦ በእግዚአብሔር ስም ለተቀደሱት ነገሮች ክብር አለመስጠት ዳን. 5፥23-26) 7. በእግዚአብሔር ስም የተናገርነውን ቃል አለመፈጸም (ዘፀ. 23፥21-23)፤ በስሙ ወይም ስለ ስሙ የምናስተምረውን በተግባር አለማዋል (ሮሜ. 2፥24፣ ቲቶ 1፥16)። ይህ ትዕዛዝ ብርቱ ማስጠንቀቂያ የያዘ ስለሆነ በማስተዋል ልንጠብቀው ይገባል።\n\nየእግዚአብሔርን ስም የምንጠራው ምን ጊዜ ነው?\n\nበጸሎት ጊዜ (ኢዮኤል 2፥32፣ ዮሐ. 14፥14)\n\nበሰላምታ ጊዜ (1ኛ ጴጥ. 1፥1-2፣ ሮሜ. 1፥7)\n\nበአምልኮ ጊዜ (መዝ. 134፥3፣ ት.ሚል. 1፥11፣ ፊልጵ. 2፥10)\n\nበቡራኬ ጊዜ (ዘኁል. 6፥23፣ 2ኛ ቆሮ. 13፥13)"}, {"heading": "3ኛ ትዕዛዝ፡ የሰንበትን ቀን ትቀድሰው ዘንድ አስብ", "content": "የቃሉ ትርጉም አቆመ አረፈ ማለት ነው። ይህ ማለት የሰው ልጅ ከጌታ ጋር የሚቀራረብበት መገናኛ መንገድ ነው። ከማንኛውም ሥጋዊ ተግባር የምናርፍበት፣ ትርጓሜው የእግዚአብሔርን ሥራ እንድናስታውስ የሚያደርግበት ቀን ነው።\n\nይኸውም በቅዱስ መጽሐፍ ተጽፏል። ሰንበት የመንግሥተ ሰማይ ምሳሌ ነች። የሰው ልጅ በዓለም ሠርቶ ወጥቶ ወርዶ በመልካም ሥራው የሚያርፍበት ቦታ ናት። ሰው ዕረፍት ያስፈልገዋል የሰንበት ቀን የተፈጠረውም ለዚህ ነው። ዘዳ. 5፥14፣ ማር. 2፥28\n\nየሰንበት ቀን ከሥነ ፍጥረት ጀምሮ የታወቀ ነው። እግዚአብሔር ስድስት ቀን ፈጥሮ በሰባተኛው ቀን አርፎአል። ዘፍ. 2፥2-3 ለዚህ ትዕዛዝ መነሻ የሆነው ይኸው ነው። የሰንበት ቀን የዕረፍት ቀን ስለሆነ የሚከተሉትን ሁለት ነገሮች ያሳስበናል፦\n\nሰው በኃጢአት ከመውደቁ በፊት ከአምላኩ ጋር ያለውን ግንኙነት የነበረውን ዕረፍት\n\nከጌታችን ከመድኃኒታችን ከኢየሱስ ክርስቶስ አዳኝነት የተገኘውን ዘለዓለማዊ የነፍስ ዕረፍት (ዕብ. 4፥1-10)\n\nበሐዲስ ኪዳን ሰንበት ሁለት ናቸው፤ ቀዳሚትና እሑድ። ቅዳሜ ማለት የበፊቷ የቀደመችው ማለት ነው። ቆላስ. 2፥16 እሑድ ማለት ደግሞ መጀመሪያ ስለሆነ ከዚህ ጀምረን ስንቆጥር ቅዳሜ ሰባተኛ ቀን ይሆናል።\n\nበዚህ 3ኛ ትዕዛዝ እንዲከበር የታዘዘው ይህ ቀን ነው። ይህ ቀን እግዚአብሔር እስራኤላውያንን ከግብጽ ባርነት ወደ እረፍት እንዳወጣቸው ያመለክታል። ዘዳ. 5፥12-15 በእግዚአብሔርና በሕዝቡ ዘንድ ምልክት ነበር። ዘፀ. 31፥17፣ ሕዝ. 20፥12 እስራኤላውያን ሰንበትን በጥብቅ ያከብሩ ነበር፤ ሰንበትን አለማክበር ግን ከባድ ቅጣት ያስከትል ነበር። ዘኁ. 15፥32-36 ሰንበትን የማያከብሩ ሰዎችም በነቢያት ይወቀሱ ነበር፤ በባቢሎን ምርኮ ጊዜ ተዛብቶ በአንዳንዶችም ተረስቶ የነበረውን በነቢዩ ነህምያ አማካይነት በሙሴ ሕግ መሠረት እንዲከበር ተደረገ። ጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ እና ሐዋርያት ይህን ቀን አክብረውታል። ሉቃ. 4፥16 ፈሪሳውያን በሰንበት ቀን እግር ከዘረጉ አያጥፉም፣ ካጠፉም አይዘረጉም መልካምም ሥራ ቢሆን አይሠሩም ነበር። ማቴ. 12፥1-14\n\nከሣምንቱ በፊተኛ ቀን ይህ ቀን ዛሬ እሑድ የምንለው ቀን ነው። ይህ ቀን ሥነ ፍጥረት የጀመረበት ኋላም ጌታ የተነሳበት መንፈስ ቅዱስ የወረደበት እንዲሁም ጌታችን የሚመጣበት ዕለት ነው። የመጀመሪያዎቹ ክርስቲያኖች ይህን የመጀመሪያ ቀን ልዩ ትኩረት በመስጠት ይሰበሰቡበት ነበር። ስለዚህ ቀን ከመጽሐፍ ቅዱስ የሚከተለውን እንረዳለን፦\n\nሀ. ጌታ እንደተነሳበት (ዮሐ. 20፥1-24)\n\nለ. መንፈስ ቅዱስ እንደወረደበት (የሐዋ. ሥራ 2፥1-4)\n\nሐ. የጢሮአዳ አማኞች እንደሚሰበሰቡበት (የሐዋ. ሥራ 20፥7)\n\nመ. ገንዘብን እንደሚያዋጡበት (1ኛ ቆሮ. 16፥2)\n\nበቤተክርስቲያን ታሪክ ደግሞ ንጉሡ ቆስጠንጢኖስ ዕለተ እሑድ የክርስቲያኖች ቀን ስለሆነች ሥራ እንዳይሠራ እንደወሰነ ይተረካል። ይኸውም ማለት በሕገ መንግሥቱ አጽድቆ አውጆአል ማለት ነው እንጂ በክርስቲያኖች ዘንድ ዕለተ እሑድ ከጥንት ጀምሮ የሚታወቅና የተከበረ ዕለት ነው። በብሉይ ኪዳን ከፋሲካ በፊት የሰንበት ማግስት በመባል በኩራትና ቀዳምያት የሚቀርቡበት ቀን ነው። ራዕ. 1፥10 ክርስቶስ በዚህች ቀን ከሙታን ተነስቶ ሰላምና እረፍት ሰጥቶናል። እሑድ የሰንበት ትርጉምን የሚያሟላ ስለሆነ ይከበራል።\n\nሰንበትን ማክበር የሰንበት ቀን የዕረፍት ቀን ስለሆነ የሰው ልጆች እረፍት እንድናገኝ ስድስት ቀን በሥራ የደከመው ሰውነታችን እንዲታደስ እግዚአብሔር የሠራልን ትዕዛዝ ነው። ስለዚህ ሥጋዊ ፈቃዳችንን በዚህ በተቀደሰው ቀን ከማድረግ በመከልከል ሰንበትን ማክበር አለብን። ኢሳ. 58፥13 እኛ በሰንበት ከመሥራት ተከልክለን ሠራተኞቻችንንም ሆነ እንስሶቻችንንም እንድናሠራ አልተፈቀደም። ዘዳ. 5፥14 የሰንበት ቀን ከሥራ ተከልክለን የምናርፍበት ቀን ብቻ ሳይሆን ባልተከፈለ ልቡና እግዚአብሔርን የምናመልክበት ቀን ነው። እንዲያውም የዚህ ትዕዛዝ ዋናው ቁም ነገር ይህ ነው። ስለዚህ ቀን የተግባር ዕረፍት ነው ስለተባለ ሥራ ፈተን መዋል የለብንም። በተቀደሰው የእግዚአብሔር ጉባዔ መገኘትና እግዚአብሔርን ማምለክ ቃሉን በመማር ከእግዚአብሔር የሚገኘውን ሰላምና እረፍት መቀበል አለብን። ዘሌ. 23፥3\n\nከዚህም ሌላ ጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ በሰንበት መልካም ሥራ መሥራት ተፈቅዷል ብሎ ባስተማረው መሠረት መልካም ሥራ በመሥራት እናከብራታለን። ምሳሌ፦ ጌታችን በዚህ ቀን በሽተኞችን ይጎበኝና ይፈውሳቸው ነበር። ማቴ. 12፥12 እኛም በሽተኞችን፣ የታሠሩ ሰዎችን መጠየቅ ይገባናል። ወደ ቤተክርስቲያን በመሄድ መባዕ በማስገባት ለድሆች ምጽዋት መስጠት የተጣሉ ሰዎችን ማስታረቅ ይገባል። በመንፈሳዊ ጉባዔያት ሁሉ መገኘት የእግዚአብሔርን ቃል መስማትና ለእግዚአብሔር ዝማሬን ማቅረብ ተገቢ ነው። ለነፍሳችን ዕረፍት የምናገኘው ከክርስቶስ ነው፤ ጌታችን ወደ እኔ ኑ ከእኔም ተማሩ ለነፍሳችሁም ዕረፍት ታገኛላችሁ ይላል። ማቴ. 11፥28 ስለዚህ ዘላለማዊ ዕረፍት የሆነው ክርስቶስ ከእኛ ጋር ይኖራልና (ዮሐ. 6፥56) እንግዲህ በክርስትና ሰንበት የሚከበረው በዚህ መልክ ነው። የእግዚአብሔር ቃል እንዲህ ይላል። ዕብ. 4፥11 ከዚህ ሌላ በቅድስት ቤተክርስቲያን ሥርዓት መሠረት ወር በገባ ቁጥር የሚከበሩ ዕለታት አሉ፦ በ12 ሊቀ መላእክት ቅዱስ ሚካኤል፣ በ21 የእመቤታችን የቅድስት ድንግል ማርያም፣ በ29 በዓለ ወልድ ናቸው።"}, {"heading": "4ኛ ትዕዛዝ፡ አባትህንና እናትህን አክብር", "content": "አባትህንና እናትህን አክብር የሚለው ትዕዛዝ የፍቅረ ቢጽ መጀመሪያ ነው። አራተኛው ትዕዛዝ ወላጆቻችንን እንድናከብር ያዝዛል (ዘፀ. 20፥12)። በዘፀአት እንደተጠቀሰው ሁሉ በአዲስ ኪዳንም ከሌሎች ትዕዛዛት ጋር ተጠቅሷል (ማቴ. 15፥4፣ ማቴ. 19፥18፣ ኤፌ. 6፥1)። አባትና እናት ሲል በሥጋ የወለዱንን ብቻ ሳይሆን በአርአያ ሥላሴ የተፈጠረ ሁሉ እንድናከብር ነው። እነዚህም የሥጋ አባቶችና የመንፈስ አባት በማለት ለሁለት ከፍለናቸዋል፦\n\n1. የሥጋ አባት\n\nሀ. ወላጆቻችን (ዕብ. 12፥9፣ ዘፍ. 2፥24)\n\nለ. የትውልድ አባት (ዮሐ. 4፥12)\n\nሐ. የአንድ ዓይነት የኑሮ ወገን አባት (ዘፍ. 4፥20)\n\nመ. አሳዳጊ /ሞግዚት/ (1ኛ ቆሮ. 4፥15)\n\nሠ. በወላጆቻችን ዕድሜ የሚገኙ\n\nረ. የቀለም አባቶች\n\nሰ. የሀገር መሪዎች (ሮሜ. 13፥7፣ 1ኛ ጴጥ. 2፥17)\n\nሸ. ሽማግሌዎች (ዘሌ. 19፥32፣ 1ኛ ጢሞ. 5፥1-2)\n\nቀ. የጡት አባት\n\nበ. የእንጀራ አባት\n\n2. የመንፈስ አባት እና እናት\n\nሀ. የንስሐ አባት\n\nለ. ካህናት\n\nሐ. የወንጌል ሰባኪ (1ኛ ቆሮ. 4፥15፣ 1ኛ ጢሞ. 5፥17፣ 1ኛ ተሰሎ. 5፥12)\n\nመ. ቅዱሳን አባቶች እና እናቶች (ዳን. 7፥27)\n\nሠ. የክርስትና አባትና እናት\n\nአክብር አባት እና እናት ማክበር ማለት መውደድ፣ መታዘዝ፣ መርዳት፣ አለማቃለል ማለት ነው (ዘሌ. 19፥3፣ ዘዳ. 27፥16፣ ቆላ. 3፥20)። «በሁሉ ለወላጆቻችሁ» ሲል በሁሉ የሚለው ቃል ብዙ ነገሮችን ያመለክታል። ይኸውም፦\n\nሀ. ምክራቸውን በመስማት (ምሳ. 1፥8፣ 1ኛ ሳሙ. 2፥25)\n\nለ. በተቸገሩ ጊዜ የሚያስፈልጋቸውን በመስጠት (ዘፍ. 47፥12)\n\nሐ. በሌላቸው ጊዜ የሚረዱበትን መንገድ ማዘጋጀት (ዮሐ. 19፥26-27)\n\nመ. በጠቅላላው ለወላጆች ብድራትን መመለስ (1ኛ ጢሞ. 5፥4)\n\nወላጆችንም ሆነ ሌሎችን የሥጋና የመንፈስ አባቶችን ሲኖራቸውም፣ ሲያጡም፣ ጤና ቢሆኑ፣ ቢታመሙም፣ ባረጁ ጊዜ ልንረዳቸው፣ ልናከብራቸው፣ ልንሰጣቸው ይገባል። አቅም አግኝተን ወላጆቻችንን የምንረዳ እኛ ብንሆን እንኳን ማክበር እንደሚገባን ጌታ አስተምሮናል (ማቴ. 15፥4፣ ምሳሌ 22፥23፣ ሲራ. 3፥11)። ይሁንና ወላጆቻችንም ሆነ ሌሎች ከእግዚአብሔር ጋር የሚያጣላና የሚያጋጭ ትዕዛዝ ቢያዙን ከእግዚአብሔር ይልቅ እነርሱን ብቻ መውደድም ማክበርም አይገባም (1ኛ ሳሙ. 20፥31፣ ማቴ. 10፥35-37፣ ማቴ. 19፥22)።\n\nበተገቢው መንገድ ግን አባትና እናትን ማክበር ዕድሜን እንደሚያረዝም አራተኛው ትዕዛዝ ያስተምረናል (ዘፀ. 20፥12፣ ኤፌ. 6፥1-3)። ከዚህ ሌላ ወላጆቻችንም ሆነ እግዚአብሔርን ያስደስታል (ምሳ. 23፥25፣ ቆላ. 3፥20)። ቅዱስ ጳውሎስ ይህ በእግዚአብሔር ፊት መልካምና የተወደደ ነው ብሎታል። አባትና እናትን አለማክበር በብሉይ ኪዳን ያስቆጣ ነበር (ዘፀ. 21፥15፣ ዘዳ. 21፥18-21)። ዛሬም ቢሆን አባቱና እናቱን የማያከብረውን እግዚአብሔር ይቀጣዋል። አባትና እናቱም ቢሆኑ ልጆቻቸውን በጌታ ምክርና በተግሣጽ እንዲያሳድጓቸው እንጂ በከንቱ እንዳያበሳጯቸው አራተኛው ትዕዛዝ አይፈቅድም (ኤፌ. 6፥4፣ ቆላ. 3፥21)።\n\nየእግዚአብሔርን ቃል የሚሰማ ልጅ እናቱን ያሳርፋታል። ባሮቹ ለርሱ እንዲገዙለት እሱም ለወለደው ለአባቱ ይገዛል (ሲራ. 3፥9-10)። የአባት ምርቃት የልጅ ቤት ያድናል የእናት እርግማን ግን መሠረት ይነቅላል።"}, {"heading": "5ኛ ትዕዛዝ፡ አትግደል (ዘፀ. 20፥13)", "content": "ሕይወት በአጋጣሚ፣ በልማድና በእንዝህላልነት የምትገኝ አይደለችም። ሕይወት ከአንድ ትልቅ ሕይወት ካለው የተገኘች ነች። ሕይወት ለራሱ ምክንያት እና አስገኝ ከሌለው የተገኘች ገንዘብ ነች። ሕይወትን ማንም ሊያዝባት እንደፈለገው ሊያደርጋት አይችልም። ለምን? የእርሱ አይደለችምና። ለዚህ ነው አትግደል የተባለው። በመሠረቱ ሞትን ሰው በገዛ ፍላጎቱ ያመጣው ስለሆነ ሞት ከእግዚአብሔር ያልመጣ እንደሆነ እናውቃለን። በዚህ ሁኔታ ማንም ሰው ነፍስ ማጥፋት የለበትም (ዘፍ. 9፥6፣ 1ኛ ነገ. 20፥19 ስለናቡቴ)።\n\nመግደል ማለት በተለያዩ መንገድ ተጠቅሞ የሰው ሕይወት እንዲሞት ማድረግ ነው። መግደል ከውስጥ ከሰው የሚወጡ ሰውንም የሚያረክሱ ብሎ ጌታችን ከዘረዘራቸው ክፉ ሥራዎች አንዱ ነው (ማቴ. 15፥19፣ ማር. 7፥22)። ቅዱስ ጳውሎስም በገላትያ ላይ ከዘረዘራቸው 16 የሥጋ ሥራዎች አንዱ መግደል ነው (ገላ. 5፥21)። በሕይወት ላይ ሥልጣን ያለው እግዚአብሔር ብቻ ነው (ዘዳ. 32፥39) ብሎ እንደተናገረ ሰውን ቢያድንም ቢገድልም ሥልጣኑ የእግዚአብሔር ነው። ነገር ግን በትዕቢት ተነሥቶ አንድ ሰው እንደራሱ የተፈጠረውን ሌላ ሰው ቢገድል ከባድ ኃጢአት መሆኑን ይነግረናል። መግደል ሲባል ፊት ለፊት ሄዶ የሰውን ሕይወት ማጥፋት ብቻ ሳይሆን ሰውን ለሞት የሚያበቁትን ነገሮች ሁሉ ነው። ይኸውም፦\n\nበተለያዩ ሁኔታ (በቃላትና በመጠቆም) አጥፊውን መርዳት\n\nየሰው ሕይወት ሊድን የሚችልበትን መረጃ በመከልከል\n\nበሽታና ድካምን ሌላም ችግርን ሲያዩ ለሞት የሚያደርስ ሥራ ማሰራት\n\nለሞት የሚያደርስ ረሀብንና ጥም በሽታም አይተን የተቻለንን አለመርዳት\n\nሰውን በሥጋ ብቻ ሳይሆን በነፍሱ መከራ የሚያመጣበትን መንገድ መፍጠር መግደል ነው።\n\nዓለማውያንን በመንፈስ ባዶ ቀፎ ሆነው የተበላሹበትን ወደ እናት ቤተክርስቲያን አለማምጣት ነፍስን መግደል ነው።\n\nወደ መግደል የሚያደርሱ ነገሮች ወደ መግደል የሚያደርሱ ብዙ ነገሮች አሉ፤ እነርሱም ቅንዓት፣ ምቀኝነት፣ ስድብ፣ ጥላቻ፣ ቁጣ ጥቂቶቹ ናቸው። ከነዚህ ውስጥ ቁጣን ብንመለከት በሁለት ሰዎች መካከል የሚነሳው ጠብ የሚያባብስ ዋነኛ ምክንያት ነው። በእርግጥ የሚገባ ቁጣ አለ፤ ይህንንም ሲያስረዳ «ተቆጡ ነገር ግን ኃጢአትን አታድርጉ» (መዝ. 4፥4፣ ኤፌ. 4፥26)። ጌታችን «አትግደል» የሚለው ሕግ ለመፈጸም በቅድሚያ ወደ መግደል የሚያደርሰውን ቁጣን ማስወገድ እንዲገባ ሲገልጽ «በወንድሙ ላይ የሚቆጣ ሁሉ ፍርድ ይገባዋል» በማለት ገልጾታል (ማቴ. 5፥21-22)።\n\nአትግደል ሲባል ምን ያመለክታል? ይህንን ትዕዛዝ በሐዲስ ኪዳን ጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ፣ ቅዱስ ጳውሎስ፣ ቅዱስ ያዕቆብ ከተወሰኑ ትዕዛዛት ጋር አብረው አንስተውታል (ማቴ. 19፥18፣ ሮሜ. 13፥9፣ ያዕ. 2፥11)። መግደል የሥጋ ሥራ በመሆኑ ነፍስ ገዳዮች የእግዚአብሔርን መንግሥት አይወርሱም (ዘዳ. 24፥16፣ ማቴ. 5፥21)። የሰዎች ደም በከንቱ ፈሶ አይቀርም፤ እግዚአብሔር የአቤልን የደሙን ድምፅ ሰምቶ ቃየንን እንደተበቀለ ይበቀላል (ዘፍ. 4፥9-15)። «በቀል የእኔ ነው ብድራትን እመልሳለሁ» ብሎ ጌታ ስለተናገረ ሰዎች ችግር እንኳን ቢደርስባቸው በቁጣ ተነስተን ራሳችን እንድንበቀል አልተፈቀደም (ሮሜ. 12፥19)። ነገር ግን በሕጋዊነት አጥፊዎችን በሞት ለመቅጣት ለባለሥልጣኖች ተፈቅዷል (ዘዳ. 21፥18-23፣ የሐ. ሥራ 13፥6-12)። ይሁን እንጂ እነርሱም ቢሆኑ ከሕግ ውጪ ሰውን ለሞት አሳልፈው መስጠት አይችሉም። አትግደል የሚለው ትዕዛዝ በመንፈሳዊ ትርጉም ሲታይ የሰውን ሞራል በመንካት አትግደል ነው። ሰውየው እያየው እየታወቀው ስለሆነ ሞራሉን የሚመታው ቃል መናገር ቀላል ኃጢአት አይደለም።\n\nከዚህ ሌላ ሰውን ከእግዚአብሔር እንዲለይ እንዲርቅ ማድረግ እንደማይገባ ትዕዛዙ ያሳስበናል። ምክንያቱም ሰው ከእግዚአብሔር ከተለየ መንፈሳዊ ሕይወቱ ይሞታል፤ ኃጢአትም ይሠራል። የኃጢአት ደመወዝ ሞት ነው (ሮሜ. 6፥23)። ስለዚህ በሐሰት ትምህርት በዓለማዊ ስብከት ሰዎችን ከእግዚአብሔር እንዲርቁ ማድረግ ነፍሰ ገዳይ መሆን ነው። ዲያብሎስ «እርሱ ከመጀመሪያ ነፍሰ ገዳይ ነበር» የተባለው በዚህ ምክንያት ነው (ዮሐ. 8፥44)። የእግዚአብሔር ቃል «በእኔ ከሚያምኑ ከነዚህ ከታናናሾች አንዱን የሚያሰናክል ሁሉ የወፍጮ ድንጋይ በአንገቱ ታስሮ ወደ ጥልቅ ባሕር መስጠም ይሻለው ነበር» በማለት ያስተምረናል (ማቴ. 18፥6)።\n\nራሳችንን እንደምንወድ ሁሉ ሌላውን መውደድ ይገባናል። መሞት እንደማንፈልግ ሌሎችንም የሚሞቱበትን መንገድ ማዘጋጀት የለብንም፤ እንደራሳችን እንጠነቀቅላቸዋለንና። ወንድሙን የሚጠላ እርሱ ነፍሰ ገዳይ ነው ተብሏል (1ኛ ዮሐ. 3፥15)። ክርስትና ራሳችንን አሳልፈን በመስጠት ለሌላው እንድንሞት እንጂ ሰውን በጥላቻ እንድንገድል አያስተምረንም (ዮሐ. 15፥12)። ጥላቻም ቢሆን በንግግር ይገለጣል። በተለይ ደግሞ በሽንገላ ፍቅር ሰዎችን በማቅረብ ጥላቻን መግለጽ መግደል ነው። ይህ የእባብ ጠባይ ነው። መጥምቁ ዮሐንስና ጌታችን የአብርሃም ልጆች ነን እያሉ ሲመኩና ሲታበዩ የነበሩትን «እናንተ የእፉኝት ልጆች እባቦች» በማለት ይወቅሷቸው ነበር (ማቴ. 3፥7)።\n\nአትግደል ሌላውን ብቻ ሳይሆን እራሳችንንም ጭምር ነው። በራሳችንም ላይ ሥልጣን ያለው እግዚአብሔር ነውና (ዘፍ. 9፥5)። በተለያዩ ነገሮች የራሳችንን ሕይወት በመታነቅ፣ ባሕር ውስጥ በመግባትም፣ መርዝ በመጠጣት፣ በጥይት በመምታት በተጨማሪም በሚከተሉት መንገዶች ነፍስን ማጥፋት ፈጽሞ በእግዚአብሔር ዘንድ የተከለከለ ነው። በስካር፣ በሱስ፣ በጫትና በሲጃራ፣ በዝሙት፣ ጽንስን በማስወረድ፣ ልጅ እንዳይወለድ መከላከያ በማድረግ መግደል ነው።"}, {"heading": "6ኛ ትዕዛዝ፡ አታመንዝር", "content": "ይህ ትዕዛዝ ስለማንኛውም ሰው ክብር፣ ንጽህና፣ ቅድስና ሕይወት ሲባል ተዘጋጅቷል። ይህ ሕግ ለምድራዊ ኑሮአችን መመሪያ ይበጅ ዘንድ የተሰጠ ነው።\n\nይህ ትዕዛዝ ጾታዊ ሕይወትን የሚመለከት ነው። የእግዚአብሔር ሕዝብ ከሌላው አረማዊ ሕዝብ የተለየ ወይም ቅዱስ መሆን ስለሚገባው በጾታ ሕይወቱ ላይ ሕግ ተሰጥቶታል። የጾታ ሕይወት በተቀደሰ ጋብቻ ተጠብቆ በጥንቃቄ ከተያዘ ቅዱስና ደስ የሚያሰኝ ሕይወት ነው። ከዚህ እንዳንወጣ ሕግ የተሰጠን ለምድራዊ ኑሮአችን እንጂ በረቂቁ ዓለም ግን ማግባትና መጋባት የለም (ማቴ. 22፥30፣ ኢሳ. 3፥16)። ብቻ በግዙፍ ዓለም የሚኖሩ ጥንድ የሆኑ አካላት የሁለት ተቃራኒ ጾታ ግንኙነት መሆኑ ግልጽ ነው።\n\nጋብቻ የባልና የሚስት ሕብረት አንድነት ነው። መሥራቹም ልዑል እግዚአብሔር ነው (ዘፍ. 2፥18-24)። ስለዚህ ጋብቻ እጅግ የተቀደሰ ሕይወት ነው። እግዚአብሔር አንድ ያደረገውን ወይም ያጣመረውን የጋብቻ ሕይወት ሰው ሊለየው አይገባም (ማቴ. 19፥3-5)። እግዚአብሔር ባልና ሚስትን በጋብቻ አንድ ያደረገው በሚከተሉት ዓላማዎች መሠረት ነው፦\n\nዘርን እንዲተኩና ምድርን እንዲሞሉ (ዘፍ. 1፥27-28)\n\nእርስ በርስ እንዲረዳዱ (ዘፍ. 2፥18)\n\nበፍትወተ እንስሳዊ እንዳይቸገሩ ነው (1ኛ ቆሮ. 7፥8-9)\n\nሰዎች ጋብቻን ሲመሰርቱ በእነዚህ ዓላማዎች ነው። ይህ ሲፈጸም በወላጆቻቸውና በራሳቸው ፈቃድ መሆን ይገባል። ከተጋቡ በኋላ ወላጆቻቸውን ትተው አብረው መኖር ይገባቸዋል (ማቴ. 19፥5)። የጋብቻ ሥርዓት በግልጽ መሆን አለበት። በሠርግ በዓል አማካኝነት ለቤተክርስቲያንና ለሕዝብ ግልጽ ማድረግ አለባቸው። ጌታችን በሠርግ ቤት ተገኝቶ የሠርግንም ሥርዓት ባርኳል (ዮሐ. 2፥1-2)። ከዚህ ውጪ ግን በድብቅ ያለ ፈቃድ በግድ የሚሆን ጋብቻ ከዝሙት አይለይም። ቅዱስ ጳውሎስ ለቆሮንቶስ ሰዎች ሲጽፍ «ስለዝሙት ጠንቅ ለእያንዳንዱ ሚስት ትኑረው ለእያንዳንዲቱም ባል ይኑራት» በማለት የጋብቻን አስፈላጊነት ከገለጸ በኋላ ለባልና ለሚስት የሚከተሉትን ማሳሰቢያዎች ይሰጣል፦\n\nባል ለሚስቱ የሚገባትን ያድርግላት፤ እንዲሁም ደግሞ ሚስቲቱ ለባልዋ። ሚስት በገዛ ሥጋዋ ላይ ሥልጣን የላትም ሥልጣን ለወንዱ ነው እንጂ፤ እንዲሁም ባል በገዛ ሥጋው ላይ ሥልጣን የለውም ለሚስቱ ነው እንጂ። እንዲሁም ለጸሎት ትተጉ ዘንድ ተስማምታችሁ ለጊዜው ካልሆነ በቀር እርስ በርሳችሁ አትከላከሉ። ራሳችሁን ለመግዛት ሰይጣን እንዳይፈትናችሁ ደግሞ አብራችሁ ሁኑ (1ኛ ቆሮ. 7፥2-6)። ከዚህም ሌላ ስለባልና ሚስት መከባበርና መዋደድ እንደሚገባቸው የእግዚአብሔር ቃል በግልጽ ያስተምራል (ኤፌ. 5፥33፣ 1ኛ ጴጥ. 3፥1-7)።\n\nበክርስትና ትምህርት ጋብቻ አንድ ለአንድ ብቻ ነው። ሁለቱም አንድ ሥጋ ይሆናሉ ሲል አንድ ለአንድ መሆኑን ያመለክታል (ዘፍ. 2፥24)። እግዚአብሔር ከጥንት ተፈጥሮ አንድ አዳምን ለአንዲት ሔዋን በመፍጠር ጋብቻን አንድ ወንድ በአንድ ሴት መሠረተ። በሕይወት እያሉ በዝሙት ምክንያት ካልሆነ በቀር ከሕጋዊ ሚስት ጋር መፋታት አይቻልም። ከሁለት አንዳቸው ከሞቱ ግን ማግባት ይችላሉ። የጋብቻ ሕይወት በክርስቶስ እና በቤተክርስቲያን መካከል ባለው አንድነት ተመስሏል። ስለዚህ ይህንን ታላቅ ምስጢር ከትዕዛዝ ውጭ መሆኑ ከባድ ኃጢአት ነው።\n\nየአመንዝራ ሕይወት በሦስት ይከፈላል፦\n\nዝሙት፦ ማለት ሰው በተልካሻና ርካሽ ተግባር ሕይወቱን ሙሉ ለዚህ ለጨለማ ጉዞ ተገዝቶ በመተዳደሪያነት ሥራዬ ብሎ የሚኖር ሰው ሁሉ ዘማዊ ይባላል (1ኛ ቆሮ. 6፥12-20)።\n\nሴሰኝነት፦ እግዚአብሔር ባዘዘው መሠረት በጋብቻ ተወስኖ ቤተሰብ ለማፍራት የማይፈልግና እራስ ወዳድነትና ስግብግብነት የሚያጠቃው ሰው ሴሰኛ ይባላል።\n\nአመንዝራነት፦ ባል ሚስቱን ትቶ ወይም ሚስትም ባልዋን ትታ፣ ቤትዋን ትታ፣ ጋብቻዋን ዘንግታ ከሌላ ወንድ ጋር እና ከሌላ ሴት ጋር መሄድ አመንዝራነት ይባላል። ይህ አመንዝራነት በስህተት አይፈጸምም፤ ማለት ሁኔታን አጥንቶ ሰልሎና አስቦ ተዘጋጅቶ የሚደረግ ነገር እንጂ እንደ እንቅፋት ጉድጓድ የሚወደቅበት አይደለም። ጨለማን ለብሶ ሰው አየኝ አላየኝ ተብሎ የሚሠራ ሥራ ነው።\n\nየአመንዝራነት መንሥኤ መንስኤ ማለት የአንድ ነገር መነሻው መሠረቱ ምንጩ ማለት ሲሆን፣ የአመንዝራነትንም መንስኤዎች ማወቁ ይጠቅማል። እነዚህም፦ መጠጥ፣ ፊልም፣ የምንዝር ጌጥ፣ አደንዛዥ ዕፅ፣ የወሲብ መጽሐፍት፣ ጭፈራ ወዘተ።\n\nሀ. ሐሳብ፣ ጠግቦ መብላት\n\nለ. ምኞት\n\nሐ. አለባበስ\n\nመ. መነጋገር፣ መቀራረብ፣ መተያየት\n\nሠ. መላፋት፣ መተቃቀፍ ወዘተ... በሌሎችም ነገር ሁሉ ቅዱስ የነበረውን ሰውነት ያረክሱታል።\n\nአንድ ሴት ከ3-4 ድረስ ካገባች አመነዘረች፤ የተፈታችዋንም ያገባ እንዲሁም አንድ ወንድ ከ2-3 ሴት ካገባ አመነዘረ፤ ይህም ትልቅ ዘማዊነት ነው። የተፈታችንም ማግባት ማመንዘር ነው (ማር. 10፥2)። እያንዳንዱ ወንድ የራሱ ሚስት ትኑረው ሴትም ባል ይኑራት (1ኛ ቆሮ. 7፥2)።\n\nየአመንዝራነት ፍጻሜው በሦስት ይከፈላል፦\n\nየአእምሮ /ሞራል/ ሞት፦ ወኔ ማጣት፣ ለሥራ እንቅስቃሴ ማጣት\n\nየመንፈስ ሞት፦ የላሸቀና ባዶ ይሆናል፣ ትንሳኤ ልቡና ያጣል\n\nየሥነ ምግባር ሞት፦ በሰው የተጠላ ረብ የሌለው መጠቋቆሚያ መሆን። ዝሙት ሞትን ያመጣል (1ኛ ቆሮ. 6፥6-9)። በኦሪት ሕግም ዘማዊ ሰው በድንጋይ ተወግሮ ይሙት ይባላል።\n\nየአመንዝራነት መንፈሳዊ ገጽታ ኃይማኖት መለዋወጥ ዝሙት ነው (ማቴ. 12፥38)። በየጊዜው ጓደኛን መለዋወጥ፣ ወረተኛነት፣ በአንድ አለመወሰን፣ የማያገኙትን መሻት፣ መመኘት፣ ከእግዚአብሔር ሌላ ወደ ጣዖት መሄድ ማመንዘር ነው።\n\nግብረ ሰዶም መሥራት ይኸም ዝሙት ሲሆን በበለጠ ከተመሳሳይ ጾታ ጋር የሚደረግ የረከሰ ግንኙነት ስለሆነ እንስሶች እንኳን የማይሠሩትን ሥራ የሰው ልጅ ስለሚሠራው በደሉ ቅጣቱ አሁንም ከፍተኛ ነው። በጥንቱ ዘመን ግብረ ሰዶም ማለት ወንድ ከወንድ ጋር የሚያደርጉት ግንኙነት ነበር። በዘመናችን ግን ሴቶችም ከሴቶች ጋር የሚያደርጉት ግንኙነት አላቸው፤ ይኸም /ሊዝቢያኒዝም/ ይባላል (ሮሜ. 1፥24-27)። ወንዱ የምትሆነውን ሴት ማግባት ሴቷም የሚሆናትን ወንድ ማግባት በብሉይም በሐዲስም የተፈቀደ ቅዱስም የሆነ ግንኙነት ነው። በዚህም ምክንያት የሰው ዘር ይበዛል፣ ጤንነቱም ይጠበቃል፣ የኑሮ ጸጥታን ያገኛል፣ ጋብቻም በእምነት ከብሯል (1ኛ ቆሮ. 6፥9)።"}, {"heading": "7ኛ ትዕዛዝ፡ አትስረቅ", "content": "ሰው ሁሉ ያልደከመበትን ንብረት እንዳይፈልግ፣ የራሱን ብቻ ሠርቶ እንዲጠቀም፣ አንዱ በሌላው ጉልበት እንዳይኖር፣ ጉልበተኛ አቅመ ደካማውን እንዳያጠቃ፣ ሁሉም ተስማምቶ እንዲኖር ይህ ሕግ ተሰጠ።\n\nእያንዳንዱ ሰው የግሉን ድርሻ ንብረቱን መጠበቅና መንከባከብ አለበት። የሰውን ሕይወት የምንንከባከብባቸው በሕግ የተሰጡ ሦስት ነገሮች አሉ፦\n\nሕይወት\n\nጋብቻ\n\nንብረት ናቸው\n\nሰው የግል ድርሻ ከሌለው ሕይወቱ ለስርቆት ይጋበዛል። የግል ድርሻ መጠበቅ ባይኖር ኖሮ ዓለም ዝብርቅርቅ፣ ውጥንቅጡ የጠፋ ሕይወት ይኖረው ነበር። ሰው የራሱ ንብረት ሊኖረው ይገባል።\n\nየመስረቅ ምክንያቶች ምንድን ናቸው?\n\nዋናው ምክንያት አለማመን ነው\n\nእግዚአብሔርን አለመፍራት\n\nስንፍና\n\nበሰይጣን ግፊት በመነሳሳት\n\nአትስረቅ የሚለው ይህ ትዕዛዝ በሐዲስ ኪዳን ጌታችን በድጋሚ ጠቅሶታል (ማቴ. 19፥18)። የሰው ንብረት እንዲጠበቅ አትስረቅ ያለው ሕግ ተሰጠ። በዘሌዋውያን ላይ «አትስረቅ» ተብሎ ተነግሯል (ዘሌ. 19፥11)። በዚህ ትዕዛዝ እግዚአብሔር ሰው ያልደከመበትንና የራሱ ያልሆነውን ንብረት በማናቸውም ምክንያት ያለባለንብረቱ ፈቃድ እንዳይወስድ ያሳስባል።\n\nስርቆት፦ ስርቆት ያለባለቤቱ ፈቃድ የሌላውን ንብረት መውሰድና መጠቀም ነው። ሰውንም ከሚያረክሱት የኃጢአት ዓይነቶች አንዱ መስረቅ ነው (ማቴ. 15፥19)። አንድ ሰው የሚሰርቀው በሚከተሉት ምክንያት ነው፦\n\nምንም ስለሌለው በድህነት፣ በችግር\n\nበተንኮልና በምቀኝነት\n\nበልማድ\n\nይሁንና በምንም ምክንያት ይሁን ስርቆት ነው። ስርቆት በሚከተሉት ዓይነት ሊፈጸም ይችላል፦\n\nበመቀማት\n\nባለቤቱ ሳያውቅ በስውር በመውሰድ\n\nበማታለልና በማስመሰል\n\nስርቆት እግዚአብሔር የሚጠላው ስለሆነ የሚሰርቁም የእግዚአብሔርን መንግሥት አይወርሱም ሲል ቅዱስ ጳውሎስ ተናግሯል።\n\nአትስረቅ ሲባል የግል ንብረትና ገንዘብ መኖሩን ያመለክተናል። ስለዚህ በዚህ ሕግ መሠረት አንድ ሰው ያልሠራውንና ያልደከመበትን የሌላውን ሰው ንብረት፣ ገንዘብ ያለባለቤቱ ፈቃድ መውሰድ አይችልም። ሰውን መስረቅ ከመግደል ያላነሰ ኃጢአት ነው። ምክንያቱም ተቸግሮ በመራብ ወይም ተበሳጭቶ በመታመም የተሰረቀው ሰው ሊሞት ይችላልና ነው። ነገር ግን አትስረቅ የሚለው ትዕዛዝ በቀጥታ ብቻ ሳይሆን በተዘዋዋሪም የሚፈጽሙትን ስርቆት ይከለክለናል። ለምሳሌ፦ በንግድ ቦታ በሚዛን በመበደል፣ የማይፈለግ ዕቃን አስመስሎ በመሸጥ ስርቆት፣ በሥራ ቦታም የሥራ ሰዓትን አለማክበር፣ ባልሰሩበት ሰዓት ገንዘብ መቀበል ስርቆት ነው። የሠራተኛን ዋጋ ቀንሶ መክፈል ስርቆት ነው። የእጅ መንሻ መቀበልም ስርቆት ነው። በዚህ ዓይነት በተዘዋዋሪ የሚፈጸሙ ስርቆቶች ሕግን ያስታሉና በማስተዋል ልንመለከታቸው ይገባል።\n\nበእግዚአብሔር ስምና ቃል እየሰበኩ የምእመናንን ንብረት ለግል መጠቀም ሌብነት ነው። ጻፎችና ፈሪሳውያን በጸሎት ርዝመት እያመካኙ የመበለቶችን ቤት ይበሉና ይበዘብዙ ነበር (ማቴ. 23፥14፣ ሉቃ. 20፥47)። ይሁዳም ለድሆች ያሰበ መስሎ ማርያም በቢታኒያ ጌታን የቀባችውን ሽቶ «በሦስት መቶ ዲናር ተሽጦ ለድሆች ያልተሰጠ ስለምን ነው» ያለው ሌባ ስለነበር ነው (ዮሐ. 12፥3-6)። ዛሬም ቢሆን አትስረቅ ብለው የሚያስተምሩ በጎን በተዘዋዋሪ አስመስለው የሚሠርቁ ከሆነ ከይሁዳም አይለዩም። «አትስረቅ ብለህ የምትሰብክ ትሰርቃለህን?» ይላል (ሮሜ. 2፥21)።\n\nከዚህ ሌላ አትስረቅ ሲባል ሰውን ብቻ ሳይሆን እግዚአብሔርንም እንዳንሰርቀው ያሳስበናል። የእግዚአብሔርን ጊዜ ሠርቀን የምናገኘው ገንዘብ በስርቆት እንደመጣ ይቆጠራል። ባንሠራበትም እንኳን የእግዚአብሔርን ጊዜ መስረቅ አይገባም። ከአሥር አንድ ለእግዚአብሔር እንድንሰጥ ታዟል። ስለዚህ ከምናገኘው ከአሥር አንዱ የእግዚአብሔር ነው። ለግላችን ከተጠቀምንበት ግን ስርቆት ነው። «ሰው እግዚአብሔርን ይሰርቃልን? እናንተ ግን እኔን ሰርቃችኋል» (ሚል. 3፥8)። በተጨማሪ ስዕለትን ተስለን ሲሳካልን ስዕለቱን አለማቅረብ ስርቆት ነው፤ ለግላችን እንጠቀምበታለንና። የእግዚአብሔርን ለእግዚአብሔር እንድንሰጥ እንጂ ልንሰርቅ አይገባንም።\n\nእግዚአብሔር ለእያንዳንዱ የግል ንብረትን የሰጠው ለራሱ የሚበቃውን ከተጠቀመ በኋላ ለሌላው ይሰጣል እንጂ አይሰርቅም። የእግዚአብሔር ቃል «ከሚቀበል ይልቅ የሚሰጥ ብፁዕ ነው» ይላልና (የሐዋ. ሥራ 20፥35)። ይህን ለማድረግና ከስርቆት ለመዳን በገዛ እጅ ጠንክሮ መሥራት ይገባል። ቅዱስ መጽሐፍም «የማይሠራ አይብላ» ይላል (1ኛ ተሰ. 4፥12፣ 2ኛ ተሰ. 3፥10)። ከዚህ ሌላ ደግሞ ለኑሮ ያህል ሠርቶ ካገኙ ኑሮዬ ይበቃኛል ማለት ይገባል (ፊል. 4፥12)። ሠርቶ ትንሽ ካገኙ በኋላ ወደ ስርቆት የሚገፋፋው በቃኝ አለማለት ነው። የእግዚአብሔር ቃል «ያላችሁ ይበቃችኋል» ይላል (ዕብ. 13፥5)። አትስረቅ የሚለው ትዕዛዝ ሰዎች እንዳይሠርቁ ብቻ ሳይሆን የሚሰርቁም ስርቆታቸውን አቁመው እንዲመለሱ ይጋብዛል። «የሰረቁ አይስረቁ» ተብሎ ተጽፏል (ኤፌ. 4፥28)። ስለዚህ ማንኛውም ሰው በማናቸውም ዓይነት ምክንያት መስረቅ አይገባውም። የሰረቁ ከስርቆቱ ተመልሰው በገዛ እጃቸው እየሠሩ እንዲኖሩ ለኑሮአቸውም የሚበቃቸውን እንዲያገኙ ይገባል።"}, {"heading": "8ኛ ትዕዛዝ፡ በባልንጀራህ ላይ በሐሰት አትመስክር", "content": "ይህ ትዕዛዝ በማናቸውም ቦታ፣ ጊዜ እንዲሁም በማናቸውም ምክንያት ባልንጀራችን ላይ በሐሰት እንዳንመሰክር ልጓም ሆኖ ይይዛል። እግዚአብሔር ይህን ትዕዛዝ የሰጠው የሰዎች ስማቸው፣ ክብራቸው፣ ሕይወታቸው እንዲጠበቅ ነው።\n\nትዕዛዙ ዳኞች፣ ከሳሾችን፣ ምስክሮችን ይመለከታል። የሰውን ክብርና መልካም ስም የሚነካ ስለሆነ ክብራችንን ለመጠበቅ ለምስክርነት መቅረብ ብዙ ፈተና አለው። ሐሰት በምላስ፣ ሐሰት በጽሑፍ፣ ሐሰት በፊርማ፣ ሐሰት በዝምታ፣ ሰርቆ በማተም፣ የሐሰት ማስረጃን በመስጠት ይፈጸማል። እግዚአብሔር አምላክ ሰውን ሁሉ አክብር ይላልና (1ኛ ጴጥ. 2፥17)።\n\nበሐሰት አትመስክር በሐሰት መመስከር ማለት ያላዩትንና ያልሰሙትን፣ ጨርሶ የማያውቁትንና ያላጣሩትን ነገር በትክክል እንደሚያውቁት አድርገው መናገር መመስከር ነው። በሌላ በኩል ደግሞ ምሥጢር ከሆነ ነገር በቀር እውነትን አለመናገር አለመግለጽም በሐሰት እንደ መመስከር ይቆጠራል።\n\nበሐሰት መመስከር በተለያዩ ምክንያቶች የሚፈጸም ሰዎችን የማቃለያ መንገድ ነው። ሰዎች በሐሰት የሚመሰክሩ በምን ምክንያት ነው?\n\nበይሉኝታ\n\nበዘረኝነት\n\nበጥቅም\n\nበምቀኝነት\n\nምስጋና በመፈለግ /ውዳሴ ከንቱን/\n\nበልማድ ወዘተ ምክንያት ሊሆን ይችላል።\n\nበሐሰት ባልና ሚስትን ማፋታት፣ አሽከርና ጌታን ማለያየት፣ ድሃና ባለጠጋን ማጣላት፣ አባትና ልጅን ማራገም፣ ወንድምና ወንድምን ማጋደል ይፈጸማል (ማቴ. 10፥21)።\n\nበሐሰት የሚመሰክር ሰው በሥጋውም በነፍሱም ብዙ ጉዳት አለው። በሐሰት ሰው በአንድ ጊዜ 3 ነገሮችን ይተላለፋል፦\n\nበሐሰት መመስከሩ ራስን ይጎዳል (ዘዳ. 19፥16-20)\n\nበሐሰት የተመሰከረበትን ሰው ይጎዳል (ምሳ. 25፥18)\n\nየሚመሰክርለትን ሰው ይጎዳል (1ኛ ነገ. 20፥22-25)\n\nከዚህም ሌላ በሐሰት መመስከር ሌሎች ትዕዛዛትንም የሚሽር ከባድ ኃጢአት ነው። ምክንያቱም ሐሰትን በመሐላ ለማጽናት ሲሞክር የእግዚአብሔርን ስም በከንቱ መጥራት ይሆናልና። በሐሰት የተመሰከረበት ሰው ሞት ሊፈረድበት ይችላል፤ ወይም ካሣ ተጠይቆ ገንዘብና ንብረት ሊበዘበዝ ይችላል። በዚህ አኳኋን የእግዚአብሔር ስም በከንቱ አትጥራ፣ አትግደል፣ አትስረቅ የሚሉት ሕጎች ሁሉ ይፈርሳሉ። ስለዚህ ሐሰተኛነት ከባድ ወንጀል ነው (ምሳ. 26፥12)።\n\nክርስቲያን እውነትን መመስከር አለበት እንጂ የሐሰት ባርያ መሆን የለበትም። ስለሰው የምናውቀው ጥቂት ስለሆነ ከሐሰት ምስክርነት እንቆጠብ። በሐሰት የጓደኛን፣ የጎረቤትን፣ የመሥሪያ ቤትን ስም በየአደባባዩ መናገር በሐሰት ማንሳት ኃጢአት ነው። እውነተኛ የክርስቲያን ፍቅር በግልጽ መናገር ነው እንጂ ማማት፣ መተቸት አይገባም።\n\nይህንን ትዕዛዝ ለመጠበቅ፦\n\nበንግግራችን እውነተኛ ሆኖ መገኘት\n\nበሥራ ልናሳይ መቻል አለብን።\n\nበሃሳብም እውነተኛ በመሆን በሐሰት የተፈረደበትን ማጽናናት ነው። እውነት ከእግዚአብሔር፣ ሐሰት ግን ከዲያብሎስ ነው። ሐሰት ተናጋሪ የሰይጣን የግብር ልጅ መሆኑንም ማወቅ አለብን (ዮሐ. 8፥44)። ክርስቶስ በትምህርቱ እውነትን እውነት ሐሰትን ሐሰት እንድንል አስተምሮናል (ማቴ. 5፥37)። ሐሰተኛ ከንፈር በእግዚአብሔር ዘንድ የተጠላ ነው (ምሳ. 12፥19)። የሐሰተኛ ሰው ዕድሉ የዲን እሳት የተመሰለ የሞት ሞት ነው (ራእይ 21፥8)። ውሸታም ሰው ክብር የለውም፤ በሚናገረውም ሐሰት ሲቀል ይኖራል። «ውሸታም ሰውና ስንቅ እያደር ይቀላል»። ቅዱስ ጴጥሮስም መልካም ዘመን ሊያይ የሚሻ ምላሱን ከክፉ ይከልክል ብሏል (1ኛ ጴጥ. 3፥10፣ መዝ. 33፥12-16)።\n\nሐሰተኛ ነቢያት በተለያየ የሐሰት ዓላማ ተነሳስቶ በሐሰተኛ ሕልምና ራዕይ ወይም በሐሰተኛ ትንቢት እንዲሁም ስብከት ሰዎችን ማታለል ይህንንም ትዕዛዝ ማፍረስ ነው። እግዚአብሔርም በሐሰት የሚመሰክሩትን አይፈልግም። ሰዎችን በሐሰተኛ ሕልምና ራዕይ እንዲሁም ትንቢትና ስብከት የእግዚአብሔርን ስም ለመጠቀሚያ ፈልገው ያታልሉበታል። እንደዚህ ያሉ ሰዎች ሐሰተኛ ነቢያት እንደሚነሱ አስቀድሞ ክርስቶስ ተናግሯል (ማቴ. 24፥14-26)። እግዚአብሔር ጥንት በብሉይ ኪዳን ሲያደርግ እንደነበረው ሐሰተኛ ነቢያትና ሐሰተኛ ምስክሮችን ይቃወማል (ዘዳ. 18፥20፣ 2ኛ ዜና 18፥22፣ ኤር. 14፥14)። ክርስቲያን ግን በእውነት ለእውነተኛ አምላክ እንደ ሐዋርያት ምስክርነት ሊሰጥ ይገባል። እግዚአብሔር ሐሰትንና ሐሰተኛ ከንፈሮችን በጣም አድርጎ ይጠየፋል። እውነትን የሚያደርጉ ግን በእርሱ ዘንድ የተወደዱ ናቸው (ምሳ. 12፥22)። ሐሰትን የሚናገሩትን ግን እግዚአብሔር እንደሚያጠፋቸው ቃሉ ይናገራል (መዝ. 5፥6፣ ምሳ. 21፥28)። ስለዚህ ውሸትን አስወግዳችሁ እርስ በርሳችሁ ብልሆች ሆናችሁ እያንዳንዳችሁ ከባልንጀሮቻችሁ ጋር እውነትን ተነጋገሩ (ኤፌ. 4፥25)። ስለሆነም ክርስቲያን በማናቸውም ቦታ በማናቸውም ምክንያት እውነትን መናገር እንጂ ሐሰትን መናገር አይገባውም።"}, {"heading": "9ኛ ትዕዛዝ፡ የባልንጀራህን ቤት አትመኝ (ዘፀ. 20፥17)", "content": "የሰው ንፅህና በውጭ ብቻ ሳይሆን በውስጥም መሆን አለበት። አትመኝ ሲባል መመኘት ብቻ ሳይሆን አታስበው አትፈልገው ሲል ነው። እግዚአብሔር የእያንዳንዱን ሰው ሕይወት ከልቡ በመነጨ ግዴታ ብቻ ሳይሆን ከሕሊና ከመነጨ ፈቃድ እንዲጠብቁለት ይፈልጋል። ሰው ሕግን እንዲፈራ ብቻ ሳይሆን በሕሊና እንዲያመዛዝን እንዲያገናዝበውም ጭምር ነው። ምኞት ፀንሳ ኃጢአትን ትወልዳለች፤ ኃጢአትም ካደገች በኋላ ሞትን ትወልዳለች (ያዕ. 1፥14-15)። ስለዚህ ምኞት ቀላል ኃጢአት ስላልሆነ በአጭሩ መቅጨት ያስፈልጋል። እንዲህ ያለ ኃጢአት ባይሠራም እንደ ተፈጸመ የሚቆጠር ነው። ጊዜና ቦታ አልፈቀዱም እንጂ ከታሰበ ተሰራ ማለት ነው። ሕጉም የተሰጠው በዚህ ምክንያት ነው።\n\nነገር ግን ምኞትን በውጫዊው ማስወገድ ሳይሆን ከምኞት ጋር ታግሎ ማሸነፍን ያመለክታል። ሰዎች በዝሙት ኃጢአት የሚወድቁት አትመኝ የሚለውን ትዕዛዝ በቅድሚያ ሲተላለፉ ነው። ጌታችን ግን «ወደ ሴት ያየ ሁሉ የተመኛትም ያን ጊዜ በልቡ ከእርሷ ጋር አመንዝሯል» በማለት መመኘት እራሱ አመንዝራነት እንደሆነ ገልጿል (ማቴ. 5፥28)። ምኞቱን የገደለ ክርስቲያን ግን አመች ሁኔታዎች እንኳን ቢሟሉለት እንደ ዮሴፍ ይህንን ክፉ ሥራ በእግዚአብሔር ፊት አላደርገውም ብሎ የዝሙትን ጦር ይሸሻል (ዘፍ. 39፥7-18)። በሌላ በኩልም ስርቆትን፣ ግድያን፣ በሐሰት መመስከርን፣ ፍርድ ማዛባትን የሚፈጽሙት ገንዘብን ሌላም ጥቅምን በመመኘት ነው፤ አንዳንዶችም ሃይማኖታቸውን ይለውጣሉ። የእግዚአብሔር ሰው ግን ከዚህ መሸሽ አለበት (1ኛ ጢሞ. 6፥9-11)።\n\nምኞት ብዙ ጉዳት ያለበት ኃጢአት ነው። መልካምን ሊመኝና ሊያስብ የሚገባውን ሕሊና ክፉውን በመመኘት ጊዜውን እንዲያሳልፍ ያደርጋል። እንዲህ የሚያደርግ ሰው ከነፍሱ ጋር የሚታገል ሰውን ይመስላል (1ኛ ቆሮ. 14፥9-10)። ሥጋውንና ነፍሱን ይጎዳል። ክፉ ምኞትን መርምሮ ከተረዳ በኋላ ከሕይወቱ ማስወገድ አለበት። እግዚአብሔርንም የዓመት ልብስ የዕለት ጉርስ ስጠኝ ብሎ በጾም፣ በጸሎት፣ በስግደት መማፀን ይገባዋል። ቅዱስ ጳውሎስም «ፊተኛውን ኑሮአችሁን እያሰባችሁ እንደሚያታልል ምኞት የሚጠፋውን አሮጌውን ሰውነት አስወግዱ» ይለናል (ኤፌ. 4፥22)። ስለዚህ በምድር ላይ ያሉ ብልቶቻችንን ገድለን ከክርስቶስ ጋር ተሰቅለን ለኃጢአት ስንሞት ክርስቶስም በውስጣችን ሕያው ሲሆን ክፉ ምኞትም ያን ጊዜ ይወገዳል (ቆላ. 3፥5፣ ገላ. 2፥20)። ከመጽሐፍ ቅዱስ ውስጥ ምኞት አዳምንና ሔዋንን፣ ንጉሥ ዳዊትንና ሌሎች አባቶቻችንን አሳስቷል።\n\n«ሰው ሰማይን ያህል ዳቦ ከሰጠህ ከዋክብትን ያህል በላተኛ ይወርድብሃል»። ምኞት ወደ ምግባር እንዲለወጥ የሚገፋፋ አወዳደቅን የማያሳምር ኃጢአት ነው። የሥጋም ፈቃድ ነውና ሞትን ያመጣል (ሮሜ. 8፥12)። ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ አትመኝ ያለው ክፉውን እንጂ ደጉን አይደለም (ማቴ. 6፥33፣ 1ኛ ቆሮ. 14፥1)። ክፉ ሃሳብ መጥፎ ምኞት በሰው ላይ የሚሰለጥነው ሰውየው ሥራ ፈት ሆኖ ሲገኝ ነው። እንግዲህ ሥራ መፍታት እራሱ በደል ነው። «ሥራ ያጣ መነኩሴ ቆቡን ቀዶ ይሰፋል» እንዲሉ።\n\nየባልንጀራ ቤት የባልንጀራ ቤት ሲባል ቤቱን ብቻ ሳይሆን በቤቱ ውስጥ ለኑሮው አስፈላጊ የሆኑትን ሁሉ ያጠቃልላል። ይሄንንም በአራት ክፍል ማየት ይቻላል (ዘፀ. 20፥17)፦\n\nየባልንጀራ ሚስት\n\nሎሌውን ገረዱንም /አገልጋዩንም/\n\nአህያውን፣ በሬውን /እንስሳቱንም/ እነዚህን መመኘት እንደማይገባ ይህ ትዕዛዝ ያስገነዝበናል፡፡ ምኞት ከፍ ባለ ስሜት አንድን ነገር መሻትና መፈለግ ነው:: ሰው የእግዚአብሔርን ድንቅ ሥራ ለማየት ቢመኝ የቃሉን ወተት ሲመኝ ሰላምን ፍቅርን ሕብረትን ሊመኝ ተገቢ ነው::"}, {"heading": "10ኛ ትዕዛዝ፡ ባልንጀራህን እንደራስህ አድርገህ ውደድ (ዘሌ. 19፣18)", "content": "ባልንጀራ በጣም ስውር ምሥጢር የምንነግረውና እንደራሳችን አድርገን የምንወደው ነው:: በአጠቃላይ ደቂቀ አዳም መዋደድ አለበትና ሁሉንም እንደበጎ ባልንጀራና ወዳጅ ማየት አለብን፡፡ ከአንድ ግንድ የበቀለ ነውና፡፡ ፍቅር፣ ውዴታ፣ ይቅርታ፣ ሰላም፣ አንድነት፣ ረቂቅ አእምሮ እና የሐሳብ ሙጫ ናቸው:: በሐዲስ ኪዳን ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ እንደተናገረው በሁለት ትዕዛዛት ሕጉም የሚምሩ ብፁአን ናቸው ይማራሉና\n\nልበ ንፁሐን ብፁአን ናቸው እግዚአብሔርን ያዩታልና\n\nየሚያስታርቁ ብፁአን ናቸው የእግዚአብሔር ልጆች ይባላሉና\n\nስለጽድቅ ብለው የሚሰደዱ ብፁአን ናቸው መንግሥተ ሰማያት የእነርሱ ናትና\n\nሲነቅፏችሁና ሲያሳድዷችሁ በእኔ ምክንያት ክፉውን በውሸት ሲናገሩባችሁ ብፁአን ናችሁ ዋጋችሁ በሰማያት ታላቅ ነውና ደስ ይበላችሁ:: ሐሴትም አድርጉ ከእናንተ በፊት የነበሩትን ነቢያት እንዲሁ አሳድደዋቸዋልና የሚሉት ዘጠኙ ናቸው::\n\n1. በመንፈስ ድሆች የሆኑ ብፁአን ናቸው መንግሥተ ሰማያት የእነርሱ ናት በመንፈስ ድሆች የሆኑ ብፁአን ናቸው ሲባል ድህነቱ የመንፈስ መሆኑን ልናስተውል ይገባል:: የመንፈስ ድሆች ማለት ደግሞ መንፈሳቸው /ሞራላቸው/ ከእውቀት ከማስተዋል ወዘተ የደኸዩ ምንም ያልተማሩ ማንነታቸውን የማያውቁ ማለት ሳይሆን ሁሉ እያላቸው ግን የራሳቸው ሳይሆን የእግዚአብሔር መሆኑን አውቀው እና አምነው ያላቸውን ሁሉ የእግዚአብሔር ነው ያሉ እኔ ደሀ ነኝ የሚሉ ማለት ነው:: ሰው ከእናቱ ሆድ ሲወጣ እራቁቱን ይወጣል ወደ መጣበትም እራቁቱን ይመለሳል፡፡ አንዳች ነገር የራሱ የሆነ የለውም ኢዮብ 1፣21 እንኳን ያገኘነው ሀብት እውቀት፣ ደስታና ሰላም ቀርቶ እኛ ራሳችንም የእግዚአብሔር ነን ምድር መላዋ የእግዚአብሔር ናት መዝ. 23፣1 እንዲህም ከሆነ ፍፁም ድሆች መሆናችንን ልናምን ይገባል፡፡ ሀብትና ባለጠግነት፣ ሥልጣንና ክብር ዕውቀት ደስታ፣ ሰላም ቢኖሩንም እንኳን የኛ ስላልሆነ እንደሰጠን ሁሉ እግዚአብሔር በተለያየ ምክንያት ሊወስደው ይችላል:: ታዲያ በዚህ ጊዜ በመንፈስ ድሆች የሆኑ እንደጻድቁ ኢዮብ \"እግዚአብሔር ሰጠ እግዚአብሔር ነሳ የእግዚአብሔር ሥም የተባረከ ይሁን\" ይላል ኢዮብ 1፣21 ከጥንቱ ድኅነታቸውን አምነዋል፡፡ ቅዱስ ዳዊት በጉባዔ ፊት እግዚአብሔርን ሲያመሰግን ክብር ባለጠግነት ኃይልና ብርታት የእግዚአብሔር መሆኑን በመግለጽ ተናግሯል:: 1ኛ ዜና\n\n29፣11-16 ስለዚህ በመንፈስ ደሀ መሆን ከተሰበረ ልብ ይሄ ፍፁም ትህትና ነው:: የተሰበረውንና የተዋረደውን ልብ ደግሞ እግዚአብሔር አይንቅም:: ወደ ትሁታንና በቃሉም ወደሚኖሩት ሰዎች ይመለከታል:: መዝ. 50፣17፤ ኢሳ. 57፣15።\n\nሁሉንም ትተው ጌታችንን በመከተል እራሳቸውን ያደኸዩ የመንፈስ ድሆች ናቸው ጌታችን እራሱ ሁሉ የእርሱ ሲሆን እኛ ባለጠጎች እንድንሆን ስለ እኛ ደሃ ሆኗል፡፡ 2ኛ ቆሮ. 8፣9\n\nከዚህ በመነሳት ሐዋርያትም ሁሉን ትተው ጌታን ተከተሉ:: ሁሉን ሲባል መጀመሪያ ራስን መካድ ከዚያም አባት፣ እናት፣ እህት፣ ወንድም ልጅንም ሀብትንም ንብረትንም መተው ነው:: ይህም ሌላውን ለማገልገል በወንጌል ምክንያት ነው እንጂ በሌላ ምክንያት አይደለም እንዲህም ሲባል እናጣዋለን ማለት ሳይሆን ሙሉ ሕይወታችን የሚያስፈልገን ከእግዚአብሔር ይገኛል ማለት ነው::\n\nቅዱስ ጳውሎስ ድሆች ስንሆን ብዙዎችን ባለጠጎች እናደርጋለን፡፡ አንዳች የሌለን ስንሆን ሁሉ የእኛ ነው ብሏል:: 2ኛ ቆሮ. 6፣10:: እንግዲህ ያለን ነገር ሁሉ ለእኛ አለመሆኑን ካወቅን የእግዚአብሔርን ለእግዚአብሔር ልንሰጥ ይገባልና። እግዚአብሔርም በድሆች ብድራት በማይመልሱ ይገለጣል፡፡ እንዲህ ካደረግን መንግሥተ ሰማያት የእኛ ትሆናለች:: ማቴ. 25፣35-46 ተመልከት።\n\n2. የሚያዝኑ ብፁአን ናቸው መጽናናትን ያገኛሉና እንደ እግዚአብሔር ፈቃድ የሚያዝኑ እንጂ የዓለምን ሐዘን እያሰቡ የሚያዝኑትን አይደለም ስለ ኃጢአት ተጸጽቶ ለንስሐ ማዘን ተገቢ ነው:: የእዚህ ዓይነቱ ጸጸት የሌለበትን ወደ መዳን የሚያደርሰው ንስሐ ያደርጋል፣ የዓለም ሐዘን
