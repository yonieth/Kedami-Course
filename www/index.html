ng": "ስድስቱ ቃላተ ወንጌል", "content": "እንደ እግዚአብሔር ቅዱስ ፈቃድ ለመኖር የሚያስችሉ የሰው ልጅ ወደ ሕይወት ጎዳና ለመራመድ መዘጋጀት ምክንያት የሚሆኑ ስድስቱ ቃላት የተባሉ ሕግጋት ይገኛሉ፡፡ እነኝህም የሥነ ምግባር መሠረታዊ ሕጎች ናቸው:: ክርስቶስም አጽንቶ ተናገራቸው:: እነኝህን ሕግጋት በግልጽ ማወቅና መጠበቅ አለብን፡፡ ዘለዓለማዊ ሕይወትን ለማግኘት ከፈለግህ ሕግጋትን መጠበቅ አስቡ ብሎናል ማቴ. 19፣16 የብሉይ ኪዳን ሕግጋት ለሐዲስ ኪዳን ሕግጋት መሸጋገሪያ ሆነው አጥረው ተጠቃለው ከበድም ብለው የሐዲስ ኪዳን መታወቂያ መለያ ሕግ ናቸው::\n\nእነዚህም፡-\n\nበወንድሙ ላይ የሚቆጣ ሁሉ ፍርድ ይገባዋል::\n\nወደሴት ያየ ሁሉ የተመኛትም ያን ጊዜ በልቡ ከርሷ ጋር አመንዝሯል\n\nያለ ዝሙት ምክንያት ሚስቱን የሚፈታ አመንዝራ ያደርጋታል\n\nከቶ አትማሉ\n\nክፉውን በክፉ አትቃወሙ\n\nጠላቶቻችሁን ውደዱ\n\nአስተውል እነዚህ ትዕዛዛት የብሉይ ኪዳን ፍፃሜ ናቸው:: የመጀመሪያዎቹን ሁለቱን ትዕዛዛት ጌታችን ከብሉይ ኪዳን ይልቅ የበለጠ በማጥበቅ አጥር በማበጀት አጽንቶአቸዋል፡፡ በሦስተኛው ደግሞ ማስተካከያ ሰጥቶበታል፡፡ በመጨረሻዎቹ ሦስት ትዕዛዛት ግን የኦሪቱን ሽሮ በሐዲስ ኪዳን መንፈስ ለውጦአቸዋል፡፡\n\n1. አትግደል፣ ላለው ሕግ መፈጸሚያ «አትግደል እንደተባለ ሰምታችኋል:: እኔ ግን እላችኋለሁ በወንድሙ ላይ የሚቆጣ የሰደበውም ፍርድ ይገባዋል::» ማቴ. 5፣22 እኔ ግን እላችኋለሁ ሲል እውነተኛ አምላክነቱን በቀጥታ ያስረዳናል፡፡ እኔ ግን እላለሁ ኦሪትንስ ወንጌልንስ የሰራሁ አይደለሁምን? እኔ ግን ማለቱ ስለምንድን? ቢሉ \"ጌታ ሁን፣ እንዳሻህ ሁን\" ሳይሆን ይህስ በጌታ የለበትም ኦሪትን በሙሴ በኢያሱ አድሮ ሰርቶታል ወንጌልን ግን እርሱ ሰው ሆኖ ሰርቶታልና:: አንድም ለቀደሙ ሰዎች እንዲህ ብዬ ነበር ዛሬ ግን እንዲህ አልኩ ማለቱ ነው:: የቀደመውን ሕግ የሠራው እንዲህ መሆኑ አሁንም ከቶ አልሻረውም፣ አልናቀውም ግን ያንኑ አጠበቀው:: ባለሥልጣንነቱን በመግለጽ ገለጸው እንጂ ለብሉይ አትግደል ሲል ለሐዲስ ግን ወንድምህን በከንቱ አታስቆጣ፣ አታሳዝን፣ አትስደብ ሲል ለሞት ምክንያት የሚሆኑትን በሮች ዘጋ:: ሥሩንም ቆረጠው:: በብሉይ ወንድምህን ያለው እስራኤላውያንን ለእስራኤላውያን ነበር፡፡ ሐዲስ ግን የሰውን ነገድ የሆነው ሁሉ ነው:: ሁሉም የአንድ የእግዚአብሔር ልጅ ነውና:: በከንቱ የተቆጣ ማለቱ ምክንያት ካለ ይቆጣ ይጣላ ማለት አይደለም፡፡ ሕገ እግዚአብሔር ሲፈርስ ሕይወት ከመንፈሳዊ መስመር ውጭ ሆኖ ሲገኝ መምከር እምቢ ሲልም መቆጣት መገሰጽ ተገቢ መሆኑን ሲያስረዳ ነው:: ወንድሙን ጨርቃም (ራቃ) ብሎ የሚሰድብ በሸንጎ ይፈረድበታል፡፡ በማለት ለሞት ወይም ለመግደል ምክንያት ስለሆነ ነው:: ቅጣቱን ከፍ አድርጎ የተናገረው ደንቆሮ በማለት የሚሳደብም ሰውየውን ብቻ ሳይሆን ፈጣሪውንም የሰደበ በመሆኑ በገሀነም እንዲፈረድበትና ቅጣቱ የበለጠ ከፍተኛ መሆኑን ገልጧል:: እንግዲህ ነፍስ የገደለውማ ምን ያህል ከፍተኛ ቅጣት ያገኘው ይሆን:: ከክርስቲያን አንደበት ሊወጣ ሊሰማ የሚገባው ምክር ተግሳጽ እንጂ ቁጣ ርግማን ስድብ ሊሆን አይገባም፡፡\n\n2. አታመንዝር ላለው ሕግ መፈጸሚያ፣ «አታመንዝር እንደተባለ ሰምታችኋል፡፡ እኔ ግን እላለሁ ወደ ሴት ያየ የተመኛትም በዚያን ጊዜ ከእርሷ ጋር አመንዝሯል፡፡» ማቴ. 5፣ 28 ዘማዊ በመሆኑ ብቻ የሚፈረድበት አይደለም በሐሳቡ እንኳን የተመኘ ይፈረድበታል፡፡ ሰው በተግባር እንዳያመነዝር ብቻ ሳይሆን በልቡም ማመንዘር እንደሌለበት እንረዳለን:: በዚህ መሠረት የልቡን ምንዝርና የሚያመጡትን ነገሮች ሁሉ ማስወገድ ይገባል:: ሰው በዓይን በማየት፣ በመጥቀስ፣ በእጅ በመዳሰስና በመቆናጠጥ፣ በመተቃቀፍ በእግር በመጨፈርና በመደነስ ሴት/ወንዱን/ ከተመኘ በልቡ አመንዝሯል፡፡ ይህ እንዳይሆን አሰናካይ የሆኑትን የዝሙት ዓይኖች የዝሙት እጆች እግሮች ማስወገድ ይገባል፡፡ የንጽሕናና የቅድስና አካላት እንድናደርጋቸው በነዚህ አማካኝነት የሚመጡ ሐሳቦችን እናጥፋቸው ማለትን ያሳያል፡፡ ማቴ. 5፣29\n\nወደ ሴት ያየ በልቡ አመንዝሯል ሲባል በምክንያት ወይም በአጋጣሚ በማኀበራዊ ኑሮና በባልንጀራነት ተቃራኒ ጾታዎች ሳይተያዩ መኖር አለባቸው ማለት አይደለም፡፡ በእርግጥ ወንድ የሴት ስሜት ሴትም እንዲሁ ሊኖራቸው ይችላል:: የተፈጥሮ ጠባይ ነውና፡፡ ይህ ዓይነቱ ስሜት እንደ ወንጀል ሊቆጠር አይችልም:: ሰው ሁሉ ከባሕርይው ጋር የተያያዘ ነውና ነገር ግን አይቶ መመኘት ሆነ ብሎ የሠራው ጥፋት ይሁንብኝ ብሎ ያደረገው ስህተት ስለሆነ ያስጠይቃል:: አይቶ፣ ሰምቶ ስሜትን ለልቦና ሳይሰጡ ያለፉት እንደሆነ ምንም አይደለም ኃጢአትም አይደለም:: ሰው የዝሙት ዋዜማ በሆነው በመዳራት ላይ የሚያሳያቸው ምልክቶች የልቡን ምንዝርና ይገልፁታል:: ምናልባት በተግባር ያልፈጸመው የጊዜና የቦታ የሌሎች ሁኔታዎች አለመሟላት አግዶት ሊሆን ይችላል፡፡ ይህንንም ልብና ኩላሊትን የሚያይ አምላክ አጣርቶ ያውቀዋል:: ኤር 17፣10 ንስሐ ካልገባን ኃጢአት ሆኖ ይያዛል፡፡ ስለዚህ ክርስቲያኖች መድኃኒታችን ከዚህ እንድንለይ እንዳዘዘን አውቀን የልብ ምንዝርናን እናስወግድ፡፡\n\n3. መፋታት ተገቢ አለመሆኑን የሚገልጥ ሕግ «እኔ ግን እላችኋለሁ ያለዝሙት ምክንያት ሚስቱን የሚፈታ የፈታችውንም ያገባ አመንዝሯል፡፡» ማቴ 5፣32\n\nሚስቱን ያለዝሙት ምክንያት የፈታ እንድትሴስን ከሕግ ውጪ እንድትሆን ምክንያት የሆነ እርሱ ስለሆነ በደሉ ወደ ወንዱ እንደሚተላለፍ ተናገረ፡፡ እንዲሁም የተፈታችውን ያገባ አሁንም አመነዘረ፡፡ ባሏ እያለ ወደ ሌላ ወንድ የሄደች ሴት ባሏን እንደገደለች በሕይወትም እንደሌለ ስላደረገችው መፈታት አለባት እግዚአብሔር አንድ ያደረገውን በራሳቸው ፈቃድ ሊለያዩ አይችሉምና:: ጋብቻ ባሕርያዊ ምሥጢራዊ እንደመሆኑ መጠን እግዚአብሔር የመሠረተው ነው:: ያለበቂ ምክንያት በቃል ኪዳኑ ጋብቻን የመሠረቱ ባልና ሚስት መፋታት አይችሉም:: ሙሴ የፍቺ ጽሕፈት በመስጠት ሰዎች በሆነው ምክንያት እንዲፈቱ ፈቅዶ ነበር። ዘዳ 24፣1 ሙሴ ይህን ያደረገው ስለሰዎች ልብ ጥንካሬ እንደሆነ ጌታችን ለጠየቁት መልሷል:: ማቴ. 19፣7 የክርስቲያን ጋብቻ በጌታ ቅዱስ ደምና ሥጋ የታተመ በመሆኑ እስከ ሞት ድረስ በታማኝነት በቃል ኪዳን መጽናት ይገባል፡፡ እንግዲህ በዝሙት ምክንያት ይህን የተቀደሰ ጋብቻ ያሰናከለ የክርስቶስና የቤተክርስቲያንን ሕብረት የካደ እና ቃል ኪዳን የረገጠ ሰው ስለሆነ በደሉ ከፍ ያለ ነው:: ይህም የታተመው በሥጋወደሙ ነውና ጋብቻን ብናፈርስ ብናበላሽ ከኑሮ ጓደኛችን ብቻ ሳይሆን ከክርስቶስ ጋር ያለን ሕብረትና አንድነት ይፈርሳል፡፡ ስለዚህ ክርስቲያን በጌታ ደም በተገኘው ፍቅር ጋብቻቸውን እስከ ሞት ጠብቀው ሊይዙ ይገባቸዋል::\n\n4. መሐላን በሚመለከት፣ «እኔ ግን እላችኋለሁ ከቶ አትማሉ» ማቴ 5፣34 ሰማይ ከነዙፋኑ ምድር ከነልብሱ ራሳችንን ጨምሮ ሁሉም ነገር የእግዚአብሔር ነው:: እንጂ እኛ በአንድም ላይ ማዘዝ አንችልም:: ስለሆነም በምንም ነገር ጠቅሰን መማል እንደማንችል ይህ ትዕዛዝ ያስረዳል፡፡ መሐላ ማለት አንድን ነገር ምስክር አድርጎ መጥራት ነው:: በብሉይ ኪዳንም ሆነ በሐዲስ ኪዳን አንዳንድ ቅዱሳን በእውነት ለመመስከር ሲሉ የእግዚአብሔርን...\n\n...ስም በመሐላ ጠርተዋል። ዘፍ 21፣23 1ኛ ነገ 18፣ ገላ 1፣20 ቅዱስ ጳውሎስ «ሰዎች ከእነርሱ በሚበልጠው ይምላሉና ለማስረዳትም የሆነው መሐላ የሙግት ሁሉ ፍጻሜ ይሆናል» ይላል:: ዕብ 6፣ 16-18 ስለዚህ እውነት የሆነውን ቃል ለማስረዳት ያላቸው የመጨረሻ አማራጭ እግዚአብሔርን ምስክርና ተጠሪ /ዋስ/ ለማድረግ ስሙን በመሐላ ቢጠሩ ኃጢአት አይሆንም::\n\nነገር ግን በሐሰትና በሆነው ባልሆነው አስፈላጊ ሳይሆን የእግዚአብሔርን ሥም በከንቱ እያነሱ መማል ኃጢአት ነው:: ነገሩ እውነት እንኳ ቢሆን ተሟጋች ከሌለውና ካላስፈለገ አዎን አዎ ወይም አይደለም ማለቱ በቂ እንደሆነ ጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ አስረድቷል፡፡ ማቴ 5፣37 ቅዱስ ያዕቆብም በመልዕክቱ ጽፎታል፡፡ ያዕ 5፣12 ከቶ አትማሉ ሲል በማያስፈልግ ከቶ አትማሉ ማለት መሆኑን ከዚህ እንረዳለን፡፡\n\n5. በአጠቃላይ የሕግ አፈፃፀም «እኔ ግን እላለሁ ክፉን በክፉ አትቃወሙ ለሚለምንህ ስጥ ከአንተም ይበደር ዘንድ ከሚወደው ፈቀቅ አትበል፡፡» በዚህ አንቀጽ ማንኛውም ነገር በትእግሥት እንድናሳልፈው ያስረዳል፡፡ ክፋት የዲያብሎስ ነውና የዲያብሎስ መገለጫ የመጣውን በሥነ ምግባር ማሸነፍ ነው:: ዲያብሎስን /ሰይጣንን/ ግን እንድንቃወመው ታዘናል፡፡ ያዕ 4፣7 ስለዚህ ክፉውን አትቃወሙ ሲባል ሰውን አትቃወሙ ማለት ነው:: ክፉ ሰውን መልሶ መቃወም በክፋቱ መተባበር ነው:: ሰውየውን ክፉ ያደረገው ሰይጣን ነውና እኛንም ክፉ ለማድረግ ሰይጣን በሰዎች ይፈትነናል:: ለሰዎች በክፋት ከመለስን በሃሳብ ስለተፈጸመ ሰይጣንን አልተቃወምነውም ማለት ነው:: ስለሆነም ጌታችን የትሩፋትን ሕግ በማስተማር ለክፉ ሰው የበለጠ መልካም ነገርን እንድናደርግ አስተምሮናል፡፡ ቅዱስ ጳውሎስም በሮሜ 12፣21 ላይ «ክፉውን በመልካም አሸንፉ እንጂ በክፉ አትሸነፉ» ብሏል፡፡ ይህንን ትዕዛዝ የምንፈጽመው ብልሆች ሳለን በፈቃዳችን ራሳችንን በማሞኘት ነው:: ክፉውን ለመቃወም አቅም ቢኖረንም በፈቃዳችን ደካሞች ሆነን ነው የክርስቲያናዊ ሕይወት መለኪያ የሥነ ምግባር ተገዥነታችንን የሚያረጋግጠው ይህ ትዕዛዝ ነው:: ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ ራሱ ሲሰድቡት መልሶ አልተሳደበም:: ሲቃወሙት አልተቃወመም ማቴ. 27፣12-14 1ኛ ጴጥ 2፣ 23 ስለዚህ ክርስቲያን በዓለም ላይ ክፉዎቹን ከሚቃወማቸው ይልቅ ሊጸልይላቸው ይገባል::\n\n6. ፍቅር እንዴት እንደሚገለጥ ያሳያል «እኔ ግን እላችኋለሁ ጠላቶቻችሁን ውደዱ የእግዚአብሔር ልጆች ትሆኑ ዘንድ፡፡ የሚረግሟችሁን መርቁ ለሚጠሏችሁ መልካም አድርጉ እርሱ በክፉዎችና በበጎዎች ላይ ፀሐይን ያወጣልና:: በጻድቃንና በኃጥአን ላይ ዝናምን ያዘንባልና፡፡» ማቴ 5፣44 በብሉይ ኪዳን ጠላትህን ጥላ ወዳጅህን ውደድ የሚል ሕግ ነበር፡፡ ጌታችን ግን ይህንን በዚህ ጠላቶቻችሁን ውደዱ በሚለው ሕግ ይሽረዋልና፡፡ ለሰማዩ አባታችን ልጆች እንሆን ዘንድ ጠላቶቻችንን ልንወድ ይገባል፡፡ እግዚአብሔር የወደደን፣ ያፈቀረን፣ በልጁ ሞት የታረቀንም ገና በኃጢአታችንና ጠላቶቹ ሳለን ነበር:: ሮሜ 5፣8-10 ቆላ 1፣21-22 ስለዚህ ልጆች ለመሆን ከፈለግን እርስ...\n\n...በርሳችን ልክ እኛን እንደወደደን መዋደድ አለብን፡፡ ፍቅራችን የማያዳላ መሆን አለበት:: ነገር ግን የሚወደንን የምንወድ ከሆነ የሚጠላንን የምንጠላ ከሆነ ከአይሁድና ከአሕዛብ በምን እንለያለን? ይህ ጠላትን ጭምር ሰውን ሁሉ መውደድ የክርስቲያኖች ልዩ ምልክት ነው፡፡ ቅዱስ ጳውሎስ ጠላትህ ቢራብ አብላው ቢጠማ አጠጣው ይላል፡፡ ሮሜ 12፣ 20 ጠላቶቻችሁን ውደዱ የሚለው ትዕዛዝ የረገሟችሁን መርቁ ለሚጠሉአችሁ መልካም አድርጉ ስለሚያሳድዷችሁ ጸልዩ በማለት አብራርቷል:: ሮሜ 12፣14 በአጠቃላይ በፍቅሩ ምክንያትና መነሻ ስለማይኖረው የክርስቲያን እውነተኛ ፍቅሩ የሚታወቀው ጠላትን በመውደድ ነው:: ክርስቲያናዊ ሕግ ፍፁምና ጠባብ በር ናትና፡፡ ማንም ሰው ጠላት ሊኖረው አይችልም የክርስቶስ ልጅ ነውና ቂም በቀልም አያስፈልግም አባታችን እግዚአብሔር ሐዳጌ በቀል ነውና ሁሉን ይቅር የሚል ነውና፡፡ ስድስቱ ቃላተ ወንጌል በአሥሩ ቃላት አንፃር የሚውሉ እነዚህ እንደሆኑ ሲነገርም በሌላ በኩል ደግሞ ስድስቱ ቃላት እየተባሉ የሚጠሩ ሌሎች እንደሆኑ ጌታ ለሁለተኛ ጊዜ ወደዚህ ዓለም ሲመጣ ሰዎችን የሚጠይቃቸው እነዚህን ነው:: እነዚህም ለሰው ሁሉ ሊደረጉና ሊፈፀሙ የሚገባቸው መሆኑን ገልጿል:: ሰው የሆነ ሁሉ ወዶና ፈቅዶ ያለዚያም ተገዶ ሊፈጽማቸው የሚገቡ ናቸው::"}, {"heading": "ስድስቱ ቃላተ ወንጌል (ለ)", "content": "ተርቤ ነበርኩኝ አበላችሁኝ\n\nተጠምቼ ነበር አጠጣችሁኝ\n\nስደተኛ ነበርኩኝ ተቀበላችሁኝ\n\nታርዤ ነበርኩ አለበሳችሁኝ\n\nታምሜ ጎበኛችሁኝ\n\nታስሬ ነበርኩ ወደ እኔ መጣችሁ\n\n1. ተርቤ ነበርኩኝ አበላችሁኝ ለጊዜው ተርቦ ሳለ ራሱንና ችግሩን የሚያስታግስበት የሚያስወግድበት የሚቀምሰውን መስጠት ያመለክታል:: የተቸገሩ ወገኖች በየቤተክርስቲያኑ በየመንደሩ በየአስፋልቱ በየጥጉ ወድቀው ይገኛሉና። ስመ እግዚአብሔርን በመጥራት ይማፀናሉና፡፡ በሌላ በኩል ደግሞ ምዕመናን የእግዚአብሔርን ቃል ከመስማት ተርበዋልና፡፡ ከቅድስት ቤተክርስቲያን ጡት ወተቷን የቀመሰ ሁሉ የተማረውን ማስተማር የእግዚአብሔርን ቃል መመገብ እንዳለበት ያመለክታል፡፡ ሰው በእንጀራ ብቻ አይኖርምና በእግዚአብሔር ቃል እንጂ ማቴ 4፣4 ዘዳ 8፣3 እንዲሁም የክርስቶስን ቅዱስ ሥጋና ክቡር ደም መቀበል ፈልጎ ተርቦ ይሆናል:: በየጊዜው ቅዱስ ቁርባን ማቀበል የካህኑ ግዴታ እንዳለበት ያስረዳል፡፡ የረሀብ ዓይነት ብዙ ነውና፡፡ ቤተክርስቲያንም በሁሉ ምልዕት ናትና በሁሉ መልክ አብልታ ታረካናለች::\n\n2. ተጠምቼ ነበር አጠጣችሁኝ ቀዝቃዛ ውኃ ያጠጣ በችግሩ ጊዜ የረዳ ዋጋ አለው ማለቱ ነው:: እንዲሁም የእግዚአብሔርን ቃል ማጠጣት ሊሆን ይችላል፡፡ ዮሐ 7፣38 ስለዚህ ካህናት የምእመናንን ፍላጎት ማርካት ከሥጋው ማብላት ከደሙ ማጠጣት ግዴታቸው ይሆናል:: የቤተክርስቲያን ልጅነት በሥጋም በነፍስም የተሟላ ሕይወትን አግኝቶ መኖር ነውና የተጠማ ሰውነት በንፁህ ውሃ ደረቁን...\n\n...ሰውነት ማጠጣት ማለምለም ተገቢ ነውና፡፡ ሥጋ ያለውኃ ነፍስም ያለ ቃለ እግዚአብሔር አይኖርም፡፡\n\n3. ስደተኛ ነበርኩኝ ተቀበላችሁኝ እንግዳ በሚችሉት አቅም ማስተናገድ ተቀብሎ ማሳደርን ያመለክታል፡፡ በቤተክርስቲያናችንም ዘወትር ይነገረናል:: በሀገራችን ልማድ፣ ባሕል ቤት ለእንግዳ ቤት የእግዚአብሔር ነው እየተባለ ይነገራል፡፡ ጌታም በወንጌሉ ቀዝቃዛ ውሃ የሰጠ ዋጋው አይጠፋም ብሏል ማቴ 10፣42፡፡ ስደተኛ ከላይ ጥላ ከታች ጫማ ከፊት ከኋላ እቅፍ ድግፍ የሚያደርጋቸው ዘመድ አዝማድ የላቸውም እና ለሀገር እንግዳ ለሰው ባዳ ናቸውና ስደተኛን መቀበል ለክርስቲያን ወጉና ክብሩ ነው::\n\n4. ታርዤ ነበርኩ አለበሳችሁኝ እግዚአብሔር አምላክ በፈቀደ ሁለት እጀ ጠባብ ያለው አንዱን ለሌለው እንዲሰጥ ያስተምረናል፡፡ ሰው ካልለበሰ ከእንስሳት ያንሳልና። ፀጋውም ክብሩም ይረክሳልና ለታረዘ ማልበስ ፀጋን መጎናፀፍ ነውና አዳም በኃጢአቱ ከፀጋው ታረዘ እኛ በኃጢአታችን መታረዝ እንዳይኖርብን ከቅድስት ቤተክርስቲያን አባቶች የንስሐ ልብስ በወንጌል ተመርተን እንልበስ እናልብስ:: ከቃሉ የታረዝን ብዙ ነንና እርቃናችንን እየተጓዝን የሰው መሳቂያ ሆነናል፡፡ ሥነ ምግባርን ልብስ አድርገን መልበስ አለብን፡፡\n\n5. ታምሜ ጎበኛችሁኝ ሰው የሆነ ሁሉ ለታመመ ወንድሙ በጎ አድራጎትን መፈጸም አለበት:: ይህንን አመጣችሁልኝ ይህንንና ይሄንን ሰጣችሁኝ አላለም፡፡ ነገር ግን አቅሙ በፈቀደው ማጽናናት በሃሳብ በገንዘብ በሌሎችም እንድንጎበኛቸው በሽተኞችን እግዚአብሔር ይማርህ ማለት ምግባቸው ነውና። በየጸበሉ በየሆስፒታሉ በየቤቱ የአልጋ ቁራኛ የደዌ ዳኛ ሆነው መጻጉዕን የመሰሉ አሉና፡፡ መጠየቅ የእግዚአብሔር የምህረት እጅ እንድትቀርብ መጸለይ ለክርስቲያን የዕለት ተዕለት ተግባር ነውና። በሌላም በኩል ቃሉን አጥተው በነፍስ ታመው ይሆናል:: ቃለ ሕይወት ወንጌልን ለታመመው ነፍስ መስጠትና በቃሉ ማዕድነት መጠየቅ ተገቢ ነው::\n\n6. ታስሬ ነበርኩ ወደ እኔ መጣችሁ የታሰረን መጎብኘት ማነጋገር ችግሩን ጠይቆ ተረድቶ ለማቃለል መሞከር ትልቁ ክርስቲያናዊ ተግባር ነው:: ጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ በዘመነ ሥጋዌ የታሰሩትን ያስፈታቸው ነበር። እኛም የታሰሩትንና ያለአግባብ በሐሰት የተፈረደባቸውን በየእስር ቤቱ የሚማቅቁትን ወገኖች መጠየቅ ይገባናል፡፡ በየእስር ቤቱ የሚሰቃዩ አሉና እግዚአብሔር ያስፈታህ ብሎ መጠየቅ ተገቢ ነው:: በነፍሳችንም የታሰርን ብዙ ነንና በኃጢአት ገመድነት ሰንሰለት የፊጥኝ የታሰርን አለንና በቃሉ አስፈቺነት ልንጠያየቅ ይገባል፡፡ የበረታው የደከመውን በመጠየቅ ከኃጢአት እስር ልንፈታ እንችላለን፡፡\n\nእነዚህን ስድስት ትዕዛዛት ያከበሩትን በሥራም የገለጡትን ክርስቲያኖች እውነተኛ ፈራጅ ጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ በክብሩ ሲቀበላቸው በጉባዔም ሲያስመሰግናቸው ደግነት ልማዳቸው የሆነ በሥነ ምግባር ያጌጡ ክርስቲያኖች መቼ ይኸን ሠራንልህ መቼስ ይሄን አደረግንልህ እያሉ እንደሚመልሱለት ከትሩፋት ወደ ትሩፋት መሄድ ልማዳቸው ነውና በትሕትና ቃል ሲጠይቁት ያሳያል፡፡ ሰማያዊ ንጉሥ ክርስቶስ ግን ይኸን ሁሉ ለወንድሞቼ ለችግረኞቹ ያደረጋችሁት ስለኔ ለእኔ እንዳደረጋችሁት እቆጥርላችኋለሁ ሲል ተናግሯል፡፡ ማቴ 25፣31-40"}]}, {"chapter_id": "ksm_ch5", "title": "የጽድቅ ሥራ እና የኃጢአት ሥራ (ማጠቃለያ)", "page_start": 5, "sections": [{"heading": "የጽድቅ ሥራ እና የኃጢአት ሥራ (ማጠቃለያ)", "content": "ጽድቅ ማለት፦\n\nጥልቅ የሆነ መንፈሳዊ ስሜት ማግኘት ወይም መኖር ማለት ነው:: የሥነ ምግባርን ሕግ ሁሉ ለመፈጸም ንፁሕና ፍፁም የሆነ ፍቅረ እግዚአብሔር ያለው ሆኖ መገኘት ከፍቅሩ የተነሣ ፈቃዱን ለመፈጸም የሚያደርገው ጥረት፡፡\n\nበሰይጣን ላይ መሰልጠን /ድል መንሳት/፣ የእግዚአብሔርን መንግሥት ለመውረስ ብቁ ሆኖ መገኘት፣ በእውነት ጎዳና መራመድ ምግባረ ሠናይ መፈጸም፡፡\n\nበእግዚአብሔር ምሥጋና ጸንቶ መኖር ወዘተ የጽድቅን ቦታ ለመያዝ የጽድቅን ግብር የሆኑትን ሁሉ ለመፈጸም በግድ ያስፈልጋል፡፡\n\nባመኑት እምነት ጸንቶ መኖር።\n\nየጽድቅን ሥራ ለመሥራት በጎ ፈቃድ ያለው ሆኖ መገኘት\n\nየሚሠራውን የሚያምን፣ የሚያምነውን የሚሠራ ሆኖ መገኘት:: ለጽድቅ የሚያበቃውን ማወቅ ብቻ ሳይሆን ተግቶ በመሥራት ጽድቅ ይገኛል፡፡ ያዕ 2፣21-24 ሮሜ 2፣13 «በእግዚአብሔር ፊት ሕግን የሚያደርጉት ይጸድቃሉ እንጂ ሕግን የሚሰሙ ጻድቃን አይደሉም፡፡» ሮሜ 2፣13 ከአምላክና ከባልንጀራ ፍቅር የተነሳ መፈጸም አለበት:: ማቴ 22፣37\n\nየጽድቅ ሥራ በሁለት ከፍለን መመልከት እንችላለን፡፡\n\n1. እግዚአብሔርን የሚመለከቱ ሥነ ምግባሮች (የጽድቅ ሥራዎች) ለእግዚአብሔር አገልግሎት የሚውሉ የእግዚአብሔር ሀልዎት አምልኮት መገለጫ የሚሆኑ የጽድቅ ሥራዎች ናቸው:: ስለ እርሱ በቀጥታ የሚናገሩ፣ የሚሠሩ አሉ፡፡\n\nሀ/ እግዚአብሔርን መፍራት\n\nለ/ ሃይማኖት\n\nሐ/ ተስፋ\n\nመ/ ፍቅር\n\nሠ/ ቅድስና\n\nረ/ ጸሎት\n\nሰ/ ጾም\n\nሸ/ ምፅዋት\n\nቀ/ ጽድቅ\n\nበ/ ንጽሕና\n\n2. ሰዎችን የሚመለከቱ የጽድቅ ሥራዎች\n\nሀ/ ጥበብ\n\nለ/ አስተዋይ\n\nሐ/ እውነተኛ\n\nመ/ ፍትሕ\n\nሠ/ ጽኑእ\n\nረ/ ትዕግስተኛ\n\nሰ/ ጨዋነት\n\nሸ/ ትህትና\n\nቀ/ ሰላማዊነት\n\nበ/ ልበ ሰፊ\n\nተ/ ኅዳጌ በቀል\n\nቸ/ ገር /ደግ/\n\nኀ/ ለጋስ\n\nነ/ ደስተኛ\n\nኘ/ አማኝ ወዘተ"}, {"heading": "የኃጢአት ሥራ", "content": "ለእግዚአብሔር ሕግ በፈቃድ አለመገዛት በሃሳብም በንግግርም በሥራም ይህንን በመሳሰሉት ሁሉ አለመታዘዝን መግለጽ ነው::\n\nሥርዓት አልበኝነት ሕገወጥነት ልቅነት ማለት ነው::\n\nየሥጋ ምኞት የሥጋም ፈቃድ ሁሉ ኃጢአት ነው:: ከእንስሳዊ ባሕርይ የሚመነጭ የሚገታው የሚከለክለው የሌለ እንዲሁም የሚሠራ ነው::\n\nየሥጋ ምኞት የሚባለውን ቅዱስ ጳውሎስ በገላ 5፣19-21 የገለጸውን ሲሆን ይህንም የሚያደርግ የእግዚአብሔርን መንግሥት አይወርስም:: መመኘት የኃጢአት ሁሉ ሥር ናት፡፡ ስለዚህ አንድ ሰው ክፉ ምኞቱን ቶሎ ነቅሎ ካልጣለ ከጊዜ ወደ ጊዜ እያደገች ሄዳ ወደ መጎምጀት ወደ መጓጓት ታደርሳለች፡፡ ቀጥሎ እንዲሠራት እንዲፈጽማት ትገፋፋለች። ራስን ከልዩ ልዩ ልምድ ወይም አምሮት/ሱስ/ ማራቅና ራስን መቅጣት ስሜትን መሰብሰብና ሕዋሳትን በሙሉ ከክፉ ነገር መከልከል ይገባል፡፡ 1ኛ ዮሐ 2፣16::\n\nሰው በራሱ ላይ በመመኘት ፈተናን ይጋብዛል እንጂ እግዚአብሔር ሰውን በክፉ አይፈትንም፡፡ ከዚህ በተጨማሪም ሰይጣን ራሱ ይፈታተነናል፡፡ መግቢያ ቀዳዳ በመፈለግ ሰውየው ሰንፎ በሩን ከፍቶ ካገኘው ያሰፋዋል፡፡ የእሱም ተገዢና ፈቃዱንም ፈፃሚ ያደርገዋል፡፡ ሉቃ. 22፣31-32 ሐዋ. 5፣3\n\nበእርግጥ ምድራዊ ሕይወታችንን እንፈተን ዘንድ ግድ አለብን፡፡ ሆኖም ፈተናው ኃጢአት አይደለም:: እንዲያውም የሚፈተነው ሁሉ ጻድቅ ነው:: እግዚአብሔር በፈተናው ያጸናዋል እንጂ፡፡ እንዲያልፈውም ያስችለዋል:: ያዕ. 1፣2-4\n\nለምሳሌ የትዕግስት አባት ኢዮብ ብዙ ፈተና ደርሶበት ሁሉን በትዕግስት አለፈው:: ምስጋናም ዋጋም ተከፈለው:: ጌታችንና መድኃኒታችን ኢየሱስ ክርስቶስ አንድ ጊዜ ብቻ ሳይሆን በተለያየ መልክ በዲያብሎስ ተፈተነ ነገር ግን ለፈቃዱ ስላልተገዛለት ድል አደረገው:: እኛም ሦስቱ አርዕስተ ኃጣውእ ተብለው የሚጠሩትን ስስትን በትዕግስት፣ ፍቅረ ንዋይን በጸሊአ ንዋይ፣ ትዕቢትን በትህትና ልናሸንፍ ይገባናል፡፡ ማቴ. 4፣1-11\n\nከሰይጣን ፈተና ለመውጣትና እሱንም ድል ለመንሳት ከብዙ መንገዶች ውስጥ፦\n\nእውነተኛ ጸሎት መጸለይ፡፡ «ወደፈተና እንዳትገቡ ተግታችሁ ጸልዩ» በማለት ጌታ እንዳስተማረን፡፡ ሉቃ. 22፣40\n\nለእግዚአብሔር ፈቃድ በመገዛት ሰይጣንን እምቢ ማለት ያዕ. 4፣7\n\nነቅቶ ተግቶና ታጥቆም መኖር ነው:: ዲያብሎስ ይጥለን ዘንድ ዘወትር ይፈልጋልና፡፡ 1ኛ ጴጥ. 5፣8\n\nልማዳዊ ስሜታዊ ኃጢአትን ነቅቶ በቶሎ መሠረዝ ያስፈልጋል፡፡ ካልሆነ እንደ ሕጋዊ ሥራ እንዲቀጥል ያደርጋል::"}, {"heading": "ኃጢአት (አከፋፈል)", "content": "ኃጢአት ዘበጥንተ አብሶ\n\nየግል ኃጢአት\n\nየጋራ ኃጢአት\n\nኃጢአት ከባድ ሥርየት ያለውና ሥርየት የሌለው\n\nቀላል ኃጢአት\n\nከባድ ኃጢአት\n\n1. ኃጢአት ዘበጥንተ አብሶ:- ከአዳምና ከሔዋን ሲወርድ ሲዋረድ የመጣ ኃጢአት ነው:: ከዘር ወደ ዘር ሲወርድ የመጣና የሰውን ዘር ሁሉ የበተነ ሲሆን በክርስቶስ ደም ተሽሯል፡፡\n\n2. የግል ኃጢአት:- ሰው በግሉ በራሱ የኅሊና ፈቃድ የሚሠራው ኃጢአት ነው::\n\n3. የጋራ ኃጢአት:- በተመሳሳይ ጠባያቸው ተቀራርበው በመመካከር ይሁንብን ይደረግብን ብለው በጋራ የሚሠሩት ኃጢአት ነው::\n\n4. ሥርየት ያለው ኃጢአትና ይቅርታ የሌለው ኃጢአት አለ:- ይኸውም ሆኖ አንድ ኃጢአት የሚቀልበት ጊዜ /ምክንያት/ ይኖረዋል፡፡ በዚህ አንፃር የግል ኃጢአት በሁለት ይከፈላል፡፡\n\nቀላል ኃጢአት፦ ኃጢአት መሆኑን ሳያውቁት ተገዶ ቀን ጥሎ ከዕውቀት ማነስና ከማስተዋል ጉድለት የተሠራ እንደሆነ በመጠኑ የቀለለ ይሆናል፡፡\n\nከባድ ኃጢአት፦ ተጠንቅቆለት ቀን ተለይቶለት ውጤቱ ታውቆ ይሁንብኝ ይደረግብኝ ተብሎ የተሠራ እንደሆነ ከባድ ኃጢአት ይባላል፡፡\n\nየከበደና የቀለለ ኃጢአት ለመኖሩ ጌታ በዮሐ. 19፣11 አስረድቷል:: 1ኛ ዮሐ. 5፣16 ማቴ. 12፣31 ኃጢአትን የማይሠራና ያልሠራ ከጌታና ከእናቱ በቀር ማንም የለም፡፡ ያዕ. 3፣2 1ኛ ዮሐ. 1፣8:: ኃጢአት ቀላል ነው እየተባለ ማድረግ ሳይሆን በየጊዜው እንደ ኃጢአትነቱ አውቆ መከላከልና ለመራቅ መሞከር ይገባል፡፡ ካልሆነ ግን ወደ ከባድ ኃጢአት ያደርሳል፡፡ ለጊዜውም ቢሆን ኃጢአት ከእግዚአብሔር ፀጋ ያርቃል:: ስለዚህ እውነተኛ ክርስቲያን ኃጢአትን ከሥሩ ቆርጦ መጣል በየጊዜው ንስሐ መግባት በእንባ መታጠብ ያስፈልጋል::\n\n1. ቀላል ኃጢአት የሚባሉት ከብዙ በጥቂቱ፦\n\nመስረቅ፣ ኩራት፣ ክፋት\n\nበቀለኝነት፣ ስስት፣ ነገረ ሠሪነት\n\nሐሜት፣ ስንፍና\n\nክፋት መሥራት፣ ርኩሰት\n\nይሉኝታ ማጣት፣ ምቀኝነት፣ ቅናት\n\nተንኮለኛ መሆን፣ ስድብ፣ ተንኮለኝነት፣ ማቃለልና መሸንገል፡፡\n\n2. ከባድ ኃጢአት የሚባሉት፦\n\nመንፈስ ቅዱስ ላይ የስድብ ቃል መናገር\n\nአምልኮተ ጣኦት\n\nክህደት\n\nነፍስ ማጥፋት\n\nዝሙት፣ አመንዝራነት፣ ሴሰኝነትና ግብረሰዶም፡፡"}, {"heading": "ማጠቃለያ", "content": "«በሰማያት ያለውን የአባቴን ፈቃድ የሚያደርግ እንጂ ጌታ ሆይ ጌታ ሆይ የሚለኝ ሁሉ መንግሥተ ሰማያት የሚገባ አይደለም፡፡» ማቴ. 7፣21:: ይህ ቃል ጌታችን መድኃኒታችን ኢየሱስ ክርስቶስ በተራራው ስብከት መደምደሚያ ላይ የተናገረው ቃል ነው:: ይኸውም ጌታን አምነዋለሁ እያሉ በግብዝነት ጌታ ሆይ በማለት እግዚአብሔርን መሸንገል እንደማይቻል ያሳያል፡፡ ነገር ግን ጌታችንን የሚያምንና የሚወድ በከንፈር ሳይሆን በተግባር የእግዚአብሔርን ፈቃድ በመፈጸም ፍቅሩንና እምነቱን መግለጥ አለበት፡፡\n\nጌታችን ቃሉን ሰምቶ የሚያደርገውን በአለት ላይ በተመሠረተ ቤት ሲመስል ቃሉን ሰምቶ የማያደርገውን ደግሞ በአሸዋ ላይ በተመሠረተ ቤት መስሎታል፡፡ ማቴ. 7፣24-27 በሌላ በኩል ደግሞ ሰምቶ የማይሠራውንና የማያደርገውን ሰው በመንገድ በጭንጫ እሾህ መሀል በተዘራ ዘር ስለመሰለው ቃሉን ሰምቶ የሚያደርገውን ደግሞ በመልካም በለምለም መሬት መስሎታል፡፡ ማቴ. 13፣1-23 እኛም በጎርፍ፣ በነፋስ፣ በዝናብ፣ ከተመሰለው መከራ ክህደትና ጥርጣሬ ተገፍተን ከመውደቃችን በፊት እምነትን በሥነ ምግባር አለትነት ላይ እንድንመሰርተው ካልሆነ ግን አወዳደቃችን ይከፋል፡፡ ልባችንን ገር የሕሊና ታዛዥ ብናደርገው በለም መሬት ላይ እንደተዘራው ዘር 30፣ 60፣ እና 100 መልካም ፍሬ እናፈራለን፡፡ ብዙዎቻችን መልካም ማድረግን ማለትም የእግዚአብሔርን በጎ ፈቃድ ለማድረግ እንፈልጋለን ነገር ግን አናደርግም የእግዚአብሔር ቃል «ለበጎ ፈቃድ መፈለግንም ማድረግንም በእናንተ የሚሠራ እግዚአብሔር ነውና ይለናል»፣ ፊል. 2፣13 ከዚህ የምንረዳው ሥነ ምግባር እግዚአብሔርን በማመን የሚገኝ መሆኑን ነው::\n\nእግዚአብሔርን አምነን ሙሉ ሕይወታችንን በፊቱ ጥለን በልባችን ብናነግሠው ፈቃዱን ለማድረግ ያስተምረናል፡፡\n\nጥቅስ፦ «ቃሉን የምታደርጉ ሁኑ እንጂ ራሳችሁን እያሳታችሁ የምትሰሙ ብቻ አትሁኑ» ያዕ. 1፣22\n\nጸሎት፦ «አንተ አምላኬ ነህና ፈቃድህን ለማድረግ አስተምረኝ ቅዱስ መንፈስህም በጽድቅህም ነፍሴን ከመከራዋ አውጣት» መዝ. 142፣10-11\n\nወስብሐት ለእግዚአብሔር በመናገሻ ገነተ ጽጌ ቅዱስ ጊዮርጊስ ቤተ ክርስቲያን ሰንበት ት/ቤት ትምህርት ክፍል የተዘጋጀ::"}]}]}]};

    let currentBookIdx = 0;
    let currentChapterIdx = 0;
    let fontSize = 18;
    const themes = ['light', 'sepia', 'dark'];
    let themeIdx = 0;

    function initApp() {
      document.getElementById('app-title').innerText = appData.app_metadata.app_title;
      renderBookTabs();
      selectBook(0);
    }

    function renderBookTabs() {
      const tabs = document.getElementById('book-tabs');
      tabs.innerHTML = appData.books.map((b, idx) =>
        `<button class="book-tab ${idx === currentBookIdx ? 'active' : ''}" onclick="selectBook(${idx})">${idx + 1}. ${b.title}</button>`
      ).join('');
    }

    function selectBook(bookIdx) {
      currentBookIdx = bookIdx;
      currentChapterIdx = 0;
      renderBookTabs();
      renderChapters();
      renderChapterContent();
    }

    function renderChapters() {
      const book = appData.books[currentBookIdx];
      const list = document.getElementById('chapter-list');
      list.innerHTML = book.chapters.map((ch, idx) =>
        `<div class="chapter-item ${idx === currentChapterIdx ? 'active' : ''}" onclick="selectChapter(${idx})">
          ${idx + 1}. ${ch.title}
        </div>`
      ).join('');
    }

    function selectChapter(chIdx) {
      currentChapterIdx = chIdx;
      renderChapters();
      renderChapterContent();
      toggleDrawer(false);
    }

    function renderChapterContent() {
      const book = appData.books[currentBookIdx];
      const ch = book.chapters[currentChapterIdx];
      const container = document.getElementById('reader-content');

      let html = '';
      if (currentChapterIdx === 0 && book.epigraph) {
        html += `<div class="epigraph-box">${book.epigraph}</div>`;
      }

      html += `<h2>${ch.title}</h2>`;
      ch.sections.forEach(sec => {
        html += `
          <div class="section-card">
            <h3>${sec.heading}</h3>
            <div class="section-content">${sec.content}</div>
          </div>
        `;
      });

      html += `
        <div class="nav-footer">
          <button class="btn" style="background:var(--primary)" ${currentChapterIdx === 0 ? 'disabled' : ''} onclick="selectChapter(${currentChapterIdx - 1})">← ቀዳሚ ምዕራፍ</button>
          <button class="btn" style="background:var(--primary)" ${currentChapterIdx >= book.chapters.length - 1 ? 'disabled' : ''} onclick="selectChapter(${currentChapterIdx + 1})">ቀጣይ ምዕራፍ →</button>
        </div>
      `;

      container.innerHTML = html;
      document.getElementById('reader').scrollTop = 0;
    }

    function handleSearch(query) {
      const q = query.trim();
      if (!q) {
        renderChapterContent();
        return;
      }
      const results = [];
      appData.books.forEach((book, bIdx) => {
        book.chapters.forEach((ch, cIdx) => {
          ch.sections.forEach(sec => {
            if (sec.heading.includes(q) || sec.content.includes(q)) {
              results.push({ bookTitle: book.title, chTitle: ch.title, sec, bIdx, cIdx });
            }
          });
        });
      });

      const container = document.getElementById('reader-content');
      if (!results.length) {
        container.innerHTML = `<h3>ለ «${q}» ምንም ውጤት አልተገኘም፡፡</h3>`;
        return;
      }
      container.innerHTML = `<h3>የፍለጋ ውጤቶች (${results.length})፦</h3>` + results.map(r => `
        <div class="section-card" onclick="selectBook(${r.bIdx}); selectChapter(${r.cIdx});" style="cursor:pointer">
          <small style="color:var(--muted)">${r.bookTitle} › ${r.chTitle}</small>
          <h3>${r.sec.heading}</h3>
          <div class="section-content">${r.sec.content.substring(0, 260)}...</div>
        </div>
      `).join('');
    }

    function toggleDrawer(forceState) {
      const sidebar = document.getElementById('sidebar');
      if (typeof forceState === 'boolean') {
        if (forceState) sidebar.classList.add('open');
        else sidebar.classList.remove('open');
      } else {
        sidebar.classList.toggle('open');
      }
    }

    function closeDrawerOnMobile() {
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('open');
      }
    }

    function changeFont(delta) {
      fontSize = Math.min(28, Math.max(14, fontSize + delta));
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
    }

    function cycleTheme() {
      themeIdx = (themeIdx + 1) % themes.length;
      document.documentElement.setAttribute('data-theme', themes[themeIdx]);
    }

    initApp();
  </script>
</body>
</html>
