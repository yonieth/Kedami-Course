name: Build Android APK & Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & Capacitor CLI
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Add Android Platform & Copy Web Assets
        run: |
          npx cap add android
          npx cap copy android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Senbet-Books-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean double extension if any & Build Windows EXE
        shell: bash
        run: |
          if [ -f "electron-main.js.js" ]; then mv electron-main.js.js electron-main.js; fi
          npm install
          npm run build:win

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Senbet-Books-Windows-EXE
          path: dist/*.exe
